name = "pelicans-community"
main = "community-worker.js"
workers_dev = true
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "pelicans-community"

# Anonymous users can share an IP (especially mobile networks). Allow a normal
# multi-asset project burst. These are per-location, approximate abuse limits.
[vars]
UPLOADS_ENABLED = "true"

[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "2026090601"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "UPLOAD_TOTAL_LIMITER"
namespace_id = "2026090602"
simple = { limit = 300, period = 60 }
