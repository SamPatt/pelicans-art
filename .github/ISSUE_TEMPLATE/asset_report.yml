name: Pouch asset report or removal request
description: Report spam, a rights concern, or another problem with a shared asset.
title: "Pouch asset report: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include private information, credentials, sensitive evidence, or security exploit details. Contact the repository owner privately for sensitive reports; use the repository security policy for vulnerabilities. Reports are reviewed by the maintainer without a guaranteed response time.
  - type: input
    id: asset
    attributes:
      label: Pouch asset URL
      description: Open the asset and use Copy Link.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason and requested action
      description: Briefly describe the issue and whether you are requesting removal. For a rights claim, include a public original-source link if available; keep private evidence out of this issue.
    validations:
      required: true
