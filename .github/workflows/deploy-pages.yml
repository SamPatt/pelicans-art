name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/community.html'
      - 'src/skit-player.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site/player

          # Copy community.html as index.html, removing header links that won't work
          # Delete lines from "header-links" div through its closing tag
          sed '/<div class="header-links">/,/<\/div>/d' src/community.html > _site/index.html

          # Copy skit-player.html as player/index.html for clean /player URLs
          cp src/skit-player.html _site/player/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
