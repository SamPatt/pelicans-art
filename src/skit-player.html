<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src * data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src *; media-src * blob: data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>pelicans.art — Watch</title>
  <link rel="stylesheet" href="pelicans-theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(180deg, var(--player-surface) 0%, var(--player-bg) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: var(--font-body);
      color: var(--player-text);
      padding: 0;
    }

    .player-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      flex: 1;
      width: 100%;
    }

    h1 { color: var(--pouch-orange); font-size: 18px; margin-bottom: 10px; display: none; }
    
    /* Default portrait viewport - 9:16 aspect ratio, scaled to fill ~75% of screen */
    #viewport {
      position: relative;
      height: 75vh;
      width: auto;
      aspect-ratio: 9 / 16;
      background: #000;
      overflow: hidden;
      border-radius: var(--radius-md);
      box-shadow: 0 0 30px rgba(45,142,196,0.1), 0 10px 40px rgba(0,0,0,0.4);
      transition: aspect-ratio 0.3s ease;
    }

    /* Landscape viewport - 16:9 aspect ratio */
    #viewport.landscape {
      aspect-ratio: 16 / 9;
      height: 75vh;
      width: auto;
    }

    @media (max-width: 500px) {
      .player-body { padding: 5px; }
      h1 { font-size: 14px; margin-bottom: 5px; }
      #viewport { height: auto; width: 100%; max-height: 70vh; border-radius: 0; }
      #viewport.landscape { height: auto; width: 100%; max-height: 70vh; }
    }
    
    /* Stage in world coordinates */
    #stage {
      position: absolute;
      width: 100%;
      height: 100%;
      transition: transform 0.6s ease-out;
      will-change: transform;
    }
    
    #background {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Characters positioned by world x-coordinate */
    .character {
      position: absolute;
      height: 40%;
      width: auto;
      transition: left 1s ease-in-out, opacity 0.3s;
      transform: translateX(-50%);
      transform-origin: bottom center;
    }
    
    .character svg {
      height: 100%;
      width: auto;
      animation: sway 7s ease-in-out infinite;
      transform-origin: 50% 100%;
    }
    
    .character.flipped {
      transform: translateX(-50%) scaleX(-1);
    }
    
    .character.offscreen { opacity: 0; pointer-events: none; }
    
    /* Head transform settings for speaking animation (regular sprites) */
    .character svg:not([data-photo-sprite]) #head-top,
    .character svg:not([data-photo-sprite]) #head-bottom {
      transition: transform 0.05s ease-out;
      transform-origin: 50% 55px;
    }
    
    /* Breathing animation on body group */
    .character svg #body {
      animation: breathe 4s ease-in-out infinite;
      transform-origin: 50% 100%;
    }

    @keyframes breathe {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50% { transform: scaleY(1.008) translateY(-0.4px); }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(0.4deg); }
      70% { transform: rotate(-0.3deg); }
    }
    
    /* Photo sprite animations */
    .character svg[data-photo-sprite] #head-bottom {
      transition: transform 0.15s ease-out;
      /* transform-origin is set inline based on pivot point */
    }
    .character svg[data-photo-sprite] #head-top {
      transition: transform 0.25s ease-out;
    }
    .character svg[data-photo-sprite] #face-upper {
      transition: transform 0.25s ease-out;
      transform-origin: center 70%; /* Transform from lower part of upper face */
    }
    
    /* Mouth animation for lip sync - smooth scaling */
    .character svg #mouth-open {
      transition: ry 0.08s ease-out, rx 0.08s ease-out, opacity 0.3s ease-out;
    }
    .character svg #mouth-closed {
      transition: opacity 0.4s ease-in, d 0.3s ease-out;
    }
    
    /* Eye direction via pupil transform - supports combining horizontal + vertical */
    .character svg .pupil { transition: transform 0.15s ease-out; }
    .character.look-left svg .pupil { transform: translateX(-1.5px); }
    .character.look-right svg .pupil { transform: translateX(1.5px); }
    .character.look-up svg .pupil { transform: translateY(-1.5px); }
    .character.look-down svg .pupil { transform: translateY(1.5px); }
    /* Combined directions */
    .character.look-left.look-up svg .pupil { transform: translate(-1.5px, -1.5px); }
    .character.look-left.look-down svg .pupil { transform: translate(-1.5px, 1.5px); }
    .character.look-right.look-up svg .pupil { transform: translate(1.5px, -1.5px); }
    .character.look-right.look-down svg .pupil { transform: translate(1.5px, 1.5px); }
    
    /* Blinking */
    .character.blinking svg #eye-left-white,
    .character.blinking svg #eye-right-white,
    .character.blinking svg #eye-left-pupil,
    .character.blinking svg #eye-right-pupil,
    .character.blinking svg #eye-left-highlight,
    .character.blinking svg #eye-right-highlight {
      opacity: 0 !important;
    }
    
    /* Character facing direction */
    .character.facing-left { transform: translateX(-50%) scaleX(calc(-1 * var(--char-scale, 1))) scaleY(var(--char-scale, 1)); }
    .character.facing-right { transform: translateX(-50%) scaleX(var(--char-scale, 1)) scaleY(var(--char-scale, 1)); }
    
    /* SVG emotion transitions - specific elements only */
    .character svg #eye-left-white,
    .character svg #eye-right-white,
    .character svg #eye-left-pupil,
    .character svg #eye-right-pupil,
    .character svg #brow-left,
    .character svg #brow-right,
    .character svg #mouth-closed,
    .character svg #eye-left-highlight,
    .character svg #eye-right-highlight {
      transition: all 0.25s ease-out;
    }
    
    /* Mouth open/closed should NOT transition - instant for lip sync */
    .character svg #mouth-open {
      transition: none !important;
    }
    
    /* Captions - TikTok/Shorts style */
    #caption {
      position: absolute;
      bottom: 5%;
      left: 5%;
      right: 5%;
      color: #fff;
      padding: 10px 15px;
      font-family: 'Arial Black', 'Helvetica Bold', sans-serif;
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 100;
      /* Black outline for readability */
      text-shadow: 
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0px -2px 0 #000,
         0px  2px 0 #000,
        -2px  0px 0 #000,
         2px  0px 0 #000;
    }
    #caption.visible { opacity: 1; }
    body.captions-off #caption { display: none; }

    @media (max-width: 500px) {
      #viewport.landscape #caption {
        font-size: clamp(10px, 3.2vw, 16px);
        line-height: 1.25;
        letter-spacing: 0.2px;
        padding: 3px 5px;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000,
                     -1px 1px 0 #000, 1px 1px 0 #000;
      }
    }

    /* Props */
    .prop {
      position: absolute;
      bottom: 12%;
      height: 15%;
      width: auto;
      transition: left 1s ease-in-out, bottom 1s ease-in-out, transform 0.5s ease-out, opacity 0.3s;
      transform: translateX(-50%);
      transform-origin: bottom center;
      z-index: 5; /* Between background and characters */
    }
    .prop svg {
      height: 100%;
      width: auto;
    }
    .prop.foreground { z-index: 15; }
    .prop.held {
      transition: none; /* Follow character smoothly */
      height: 12%;
    }
    .prop.hidden { opacity: 0; pointer-events: none; }

    .radio-signal { opacity: 0; }
    .animate-radio .radio-signal {
      animation: radio-signal 0.65s ease-in-out infinite;
    }
    .animate-radio .radio-led {
      animation: radio-led 0.32s steps(2, end) infinite;
    }
    @keyframes radio-signal {
      0%, 100% { opacity: 0.15; }
      45% { opacity: 1; }
    }
    @keyframes radio-led {
      from { fill: #ffe896; }
      to { fill: #f16b46; }
    }

    /* Prop animations */
    @keyframes prop-bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-15px); }
    }
    @keyframes prop-spin {
      from { transform: translateX(-50%) rotate(0deg); }
      to { transform: translateX(-50%) rotate(360deg); }
    }
    @keyframes prop-shake {
      0%, 100% { transform: translateX(-50%) translateX(0); }
      25% { transform: translateX(-50%) translateX(-5px); }
      75% { transform: translateX(-50%) translateX(5px); }
    }
    @keyframes prop-pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.2); }
    }
    @keyframes prop-float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-10px); }
    }
    .prop.animate-bounce { animation: prop-bounce 0.5s ease-in-out infinite; }
    .prop.animate-spin { animation: prop-spin 1s linear infinite; }
    .prop.animate-shake { animation: prop-shake 0.2s ease-in-out infinite; }
    .prop.animate-pulse { animation: prop-pulse 1s ease-in-out infinite; }
    .prop.animate-float { animation: prop-float 2s ease-in-out infinite; }
    
    /* Controls */
    #controls {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 400px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--player-border);
      color: var(--player-text);
      cursor: pointer;
      font-size: var(--text-sm);
      font-family: var(--font-body);
      transition: all var(--duration-fast);
    }
    button:hover { background: var(--ocean-deep); }
    button.active {
      background: linear-gradient(135deg, var(--pouch-orange), var(--pouch-deep));
      color: #fff;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #playBtn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pouch-orange), var(--pouch-deep));
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      text-indent: 2px; /* visually center the triangle */
      padding: 0;
      box-shadow: 0 2px 8px rgba(245,166,35,0.3);
    }

    #playBtn:hover {
      box-shadow: 0 4px 16px rgba(245,166,35,0.5);
      filter: brightness(1.1);
    }

    #status {
      margin-top: 10px;
      color: rgba(232,228,223,0.5);
      font-size: var(--text-xs);
    }

    #debug {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      padding: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      border-radius: var(--radius-sm);
      display: none;
    }

    /* URL loader input */
    #url-loader input[type="text"] {
      background: var(--player-surface);
      border: 1px solid var(--player-border);
      color: var(--player-text);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-family: var(--font-body);
      font-size: var(--text-sm);
    }

    #url-loader input[type="text"]:focus {
      outline: none;
      border-color: var(--ocean-blue);
      box-shadow: 0 0 0 3px rgba(45,142,196,0.15);
    }

    /* Embed mode - hide chrome, fill container */
    body.embed-mode .pelicans-nav { display: none; }
    body.embed-mode #url-loader { display: none !important; }
    body.embed-mode #publishBtn { display: none !important; }
    body.embed-mode .player-body { padding: 0; }
    body.embed-mode #viewport {
      height: 100vh;
      width: 100vw;
      border-radius: 0;
      box-shadow: none;
    }
    body.embed-mode #viewport.landscape {
      height: 100vh;
      width: 100vw;
    }
    body.embed-mode #controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      margin-top: 0;
    }
    body.embed-mode #controls button:not(#playBtn):not(#captionBtn) {
      display: none !important;
    }
    body.embed-mode #status { display: none; }
    body.embed-mode h1 { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .character svg #body,
      .character svg {
        animation: none !important;
      }
    }
  </style>
</head>
<body class="captions-off">
  <!-- NAV (dark variant) -->
  <nav class="pelicans-nav dark">
    <a href="./" class="pelicans-nav-logo">pelicans<span>.art</span></a>
    <ul class="pelicans-nav-links">
      <li><a href="sprite-editor.html">Studio</a></li>
      <li><a href="./" class="active">Watch</a></li>
      <li><a href="community.html">The <span style="color:var(--pouch-orange)">Pouch</span></a></li>
    </ul>
  </nav>

  <div class="player-body">
  <h1>AI Improv Theater</h1>

  <div id="debug"></div>

  <div id="viewport">
    <div id="stage">
      <img id="background" src="backgrounds/restaurant.svg" alt="">
    </div>
    <div id="caption" role="status" aria-live="polite"></div>
  </div>
  
  <div id="controls">
    <button id="playBtn" aria-label="Play skit" disabled>▶</button>
    <button id="captionBtn" aria-label="Toggle captions">CC</button>
    <button type="button" class="demo-skit-btn active" data-skit="luckyCharms">Lucky Charms</button>
    <button type="button" class="demo-skit-btn" data-skit="trumpAlien">Trump/Alien</button>
    <button type="button" class="demo-skit-btn" data-skit="theInterview">The Interview</button>
    <button id="publishBtn">📦 Publish</button>
  </div>
  <div id="url-loader" style="margin-top: 10px;">
    <input type="text" id="skitUrl" placeholder="Paste published skit URL..." style="width: 300px; padding: 5px;">
    <button id="loadUrlBtn">Load</button>
  </div>
  
  <div id="status">Loading...</div>
  </div><!-- end player-body -->

  <script src="vendor/dompurify/purify.min.js"></script>
  <script src="js/svg-sanitizer.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/backend/storage-idb.js"></script>
  <script src="js/backend/tts-provider.js"></script>
  <script src="js/skit-player.js"></script>
</body>
</html>
