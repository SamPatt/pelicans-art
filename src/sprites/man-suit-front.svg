<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Suit jacket -->
    <rect x="32" y="75" width="36" height="75" rx="3" fill="#1a237e"/>
    <!-- Shirt/tie -->
    <polygon points="50,75 43,150 57,150" fill="#ffffff"/>
    <polygon points="50,75 46,150 54,150" fill="#c62828"/>
    <!-- Lapels -->
    <polygon points="44,75 32,92 44,97" fill="#0d1442"/>
    <polygon points="56,75 68,92 56,97" fill="#0d1442"/>
    <!-- Neck -->
    <rect x="44" y="62" width="12" height="15" fill="#ffcc80"/>
  </g>
  <g id="head-top">
    <!-- Hair -->
    <ellipse cx="50" cy="28" rx="22" ry="14" fill="#3e2723"/>
    <!-- Head/face - positioned like girl sprite -->
    <ellipse cx="50" cy="42" rx="20" ry="22" fill="#ffcc80"/>
    <!-- Ears -->
    <ellipse cx="30" cy="44" rx="4" ry="7" fill="#ffcc80"/>
    <ellipse cx="70" cy="44" rx="4" ry="7" fill="#ffcc80"/>
    <!-- Eye whites -->
    <ellipse id="eye-left-white" cx="42" cy="42" rx="5" ry="4" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="58" cy="42" rx="5" ry="4" fill="#ffffff"/>
    <!-- Pupils -->
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="42" r="2" fill="#000000"/>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="42" r="2" fill="#000000"/>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="41" cy="41" r="1" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="57" cy="41" r="1" fill="#fff" opacity="0"/>
    <!-- Eyebrows -->
    <path id="brow-left" d="M36 36 Q42 34 48 37" stroke="#3e2723" stroke-width="2" fill="none"/>
    <path id="brow-right" d="M52 37 Q58 34 64 36" stroke="#3e2723" stroke-width="2" fill="none"/>
    <!-- Nose -->
    <ellipse cx="50" cy="48" rx="2.5" ry="3" fill="#ffb74d"/>
  </g>
  <g id="head-bottom">
    <!-- Chin area -->
    <ellipse cx="50" cy="58" rx="16" ry="8" fill="#ffcc80"/>
    <!-- Mouth closed - aligned with mouthHuman y≈52-54 -->
    <path id="mouth-closed" d="M44 54 Q50 57 56 54" stroke="#8d6e63" stroke-width="1.5" fill="none"/>
    <!-- Mouth open -->
    <ellipse id="mouth-open" cx="50" cy="55" rx="4" ry="3" fill="#5d4037" opacity="0"/>
  </g>
</svg>
