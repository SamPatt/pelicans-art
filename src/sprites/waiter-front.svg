<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- White shirt -->
    <rect x="32" y="72" width="36" height="78" fill="#ffffff"/>
    <!-- Black vest -->
    <path d="M32 72 L40 72 L40 130 L32 130 Z" fill="#1a1a1a"/>
    <path d="M60 72 L68 72 L68 130 L60 130 Z" fill="#1a1a1a"/>
    <path d="M40 72 L50 85 L60 72" fill="#1a1a1a"/>
    <!-- Vest buttons -->
    <circle cx="50" cy="98" r="2" fill="#d4af37"/>
    <circle cx="50" cy="113" r="2" fill="#d4af37"/>
    <!-- Bow tie -->
    <rect x="46" y="68" width="8" height="6" fill="#1a1a1a"/>
    <polygon points="42,71 46,68 46,74" fill="#1a1a1a"/>
    <polygon points="58,71 54,68 54,74" fill="#1a1a1a"/>
    <!-- Arms -->
    <rect x="22" y="75" width="10" height="35" fill="#ffffff"/>
    <rect x="68" y="75" width="10" height="35" fill="#ffffff"/>
    <ellipse cx="27" cy="113" rx="6" ry="5" fill="#ffcc80"/>
    <ellipse cx="73" cy="113" rx="6" ry="5" fill="#ffcc80"/>
  </g>
  <g id="head-top">
    <!-- Hair - slicked back -->
    <ellipse cx="50" cy="30" rx="20" ry="14" fill="#2d2d2d"/>
    <!-- Face -->
    <ellipse cx="50" cy="44" rx="18" ry="22" fill="#ffcc80"/>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="43" cy="42" rx="4" ry="3" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="57" cy="42" rx="4" ry="3" fill="#ffffff"/>
    <circle id="eye-left-pupil" class="pupil" cx="43" cy="42" r="1.5" fill="#2d2d2d"/>
    <circle id="eye-right-pupil" class="pupil" cx="57" cy="42" r="1.5" fill="#2d2d2d"/>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="42" cy="41" r="1" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="56" cy="41" r="1" fill="#fff" opacity="0"/>
    <!-- Eyebrows -->
    <path id="brow-left-border" d="M38 38 Q43 36 48 38" stroke="#ffcc80" stroke-width="2" fill="none"/>
    <path id="brow-left" d="M38 36 Q43 34 48 36" stroke="#2d2d2d" stroke-width="1.5" fill="none"/>
    <path id="brow-right-border" d="M52 38 Q57 36 62 38" stroke="#ffcc80" stroke-width="2" fill="none"/>
    <path id="brow-right" d="M52 36 Q57 34 62 36" stroke="#2d2d2d" stroke-width="1.5" fill="none"/>
    <!-- Nose -->
    <ellipse cx="50" cy="48" rx="2" ry="2.5" fill="#ffb74d"/>
  </g>
  <g id="head-bottom">
    <!-- Mouth closed - moved up -->
    <path id="mouth-closed" d="M45 55 Q50 58 55 55" stroke="#8d6e63" stroke-width="1.5" fill="none"/>
    <!-- Mouth open -->
    <ellipse id="mouth-open" cx="50" cy="56" rx="4" ry="3" fill="#5d4037" opacity="0"/>
  </g>
</svg>
