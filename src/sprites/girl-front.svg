<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Neck -->
    <rect x="44" y="68" width="12" height="12" fill="#fce4d4"/>
    <!-- Body/dress -->
    <ellipse cx="50" cy="110" rx="18" ry="35" fill="#7dd3dc"/>
    <!-- Arms -->
    <ellipse cx="30" cy="95" rx="6" ry="14" fill="#fce4d4"/>
    <ellipse cx="70" cy="95" rx="6" ry="14" fill="#fce4d4"/>
    <!-- Legs hint -->
    <ellipse cx="43" cy="142" rx="6" ry="10" fill="#fce4d4"/>
    <ellipse cx="57" cy="142" rx="6" ry="10" fill="#fce4d4"/>
  </g>
  <g id="head-top">
    <!-- Hair back -->
    <ellipse cx="50" cy="40" rx="24" ry="26" fill="#2d2d2d"/>
    <!-- Hair sides hanging down -->
    <path d="M26 40 Q22 60 28 85" stroke="#2d2d2d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M74 40 Q78 60 72 85" stroke="#2d2d2d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Face -->
    <ellipse cx="50" cy="45" rx="20" ry="22" fill="#fce4d4"/>
    <!-- Blush -->
    <ellipse cx="36" cy="52" rx="4" ry="2" fill="#ffb6b6" opacity="0.5"/>
    <ellipse cx="64" cy="52" rx="4" ry="2" fill="#ffb6b6" opacity="0.5"/>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="42" cy="44" rx="4" ry="3" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="58" cy="44" rx="4" ry="3" fill="#ffffff"/>
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="44" r="2" fill="#2d2d2d"/>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="44" r="2" fill="#2d2d2d"/>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="41" cy="43" r="1" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="57" cy="43" r="1" fill="#fff" opacity="0"/>
    <!-- Eyebrows -->
    <path id="brow-left-border" d="M37 40 Q42 38 47 40" stroke="#fce4d4" stroke-width="2" fill="none"/>
    <path id="brow-left" d="M37 38 Q42 36 47 38" stroke="#2d2d2d" stroke-width="1.5" fill="none"/>
    <path id="brow-right-border" d="M53 40 Q58 38 63 40" stroke="#fce4d4" stroke-width="2" fill="none"/>
    <path id="brow-right" d="M53 38 Q58 36 63 38" stroke="#2d2d2d" stroke-width="1.5" fill="none"/>
  </g>
  <g id="head-bottom">
    <!-- Mouth closed -->
    <path id="mouth-closed" d="M46 56 Q50 59 54 56" stroke="#d4a59a" stroke-width="1.5" fill="none"/>
    <!-- Mouth open -->
    <ellipse id="mouth-open" cx="50" cy="57" rx="4" ry="3" fill="#d4a59a" opacity="0"/>
  </g>
</svg>
