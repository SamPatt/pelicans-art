<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Body/dress -->
    <ellipse cx="50" cy="115" rx="18" ry="30" fill="#7dd3dc"/>
    <!-- Arms down -->
    <ellipse cx="32" cy="100" rx="5" ry="12" fill="#fce4d4"/>
    <ellipse cx="68" cy="100" rx="5" ry="12" fill="#fce4d4"/>
    <!-- Legs hint -->
    <ellipse cx="43" cy="142" rx="6" ry="10" fill="#fce4d4"/>
    <ellipse cx="57" cy="142" rx="6" ry="10" fill="#fce4d4"/>
  </g>
  <g id="head-top">
    <!-- Hair back -->
    <ellipse cx="50" cy="45" rx="26" ry="28" fill="#2d2d2d"/>
    <!-- Hair sides hanging down -->
    <path d="M24 45 Q20 70 28 95" stroke="#2d2d2d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M76 45 Q80 70 72 95" stroke="#2d2d2d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Face -->
    <ellipse cx="50" cy="50" rx="20" ry="22" fill="#fce4d4"/>
    <!-- Blush -->
    <ellipse cx="36" cy="56" rx="4" ry="2" fill="#ffb6b6" opacity="0.5"/>
    <ellipse cx="64" cy="56" rx="4" ry="2" fill="#ffb6b6" opacity="0.5"/>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="42" cy="48" rx="4" ry="3" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="58" cy="48" rx="4" ry="3" fill="#ffffff"/>
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="48" r="2" fill="#2d2d2d"/>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="48" r="2" fill="#2d2d2d"/>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="41" cy="47" r="1" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="57" cy="47" r="1" fill="#fff" opacity="0"/>
    <!-- Eyebrows -->
    <path id="brow-left-border" d="M37 44 Q42 42 47 44" stroke="#fce4d4" stroke-width="2" fill="none"/>
    <path id="brow-left" d="M37 42 Q42 40 47 42" stroke="#2d2d2d" stroke-width="1.5" fill="none"/>
    <path id="brow-right-border" d="M53 44 Q58 42 63 44" stroke="#fce4d4" stroke-width="2" fill="none"/>
    <path id="brow-right" d="M53 42 Q58 40 63 42" stroke="#2d2d2d" stroke-width="1.5" fill="none"/>
  </g>
  <g id="head-bottom">
    <!-- Mouth closed -->
    <path id="mouth-closed" d="M46 58 Q50 61 54 58" stroke="#d4a59a" stroke-width="1.5" fill="none"/>
    <!-- Mouth open -->
    <ellipse id="mouth-open" cx="50" cy="59" rx="4" ry="3" fill="#d4a59a" opacity="0"/>
  </g>
</svg>
