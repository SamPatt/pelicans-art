<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Body/dress - moved up to connect with head -->
    <ellipse cx="50" cy="95" rx="20" ry="40" fill="#7dd3dc"/>
    <!-- Arms -->
    <ellipse cx="28" cy="85" rx="6" ry="14" fill="#fce4d4"/>
    <ellipse cx="72" cy="85" rx="6" ry="14" fill="#fce4d4"/>
    <!-- Legs hint -->
    <ellipse cx="43" cy="132" rx="6" ry="10" fill="#fce4d4"/>
    <ellipse cx="57" cy="132" rx="6" ry="10" fill="#fce4d4"/>
  </g>
  <g id="head-top">
    <!-- Hair back -->
    <ellipse cx="50" cy="38" rx="24" ry="26" fill="#2d2d2d"/>
    <!-- Hair sides hanging down -->
    <path d="M26 38 Q22 55 28 80" stroke="#2d2d2d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M74 38 Q78 55 72 80" stroke="#2d2d2d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Face -->
    <ellipse cx="50" cy="42" rx="20" ry="22" fill="#fce4d4"/>
    <!-- Blush -->
    <ellipse cx="36" cy="48" rx="4" ry="2" fill="#ffb6b6" opacity="0.5"/>
    <ellipse cx="64" cy="48" rx="4" ry="2" fill="#ffb6b6" opacity="0.5"/>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="42" cy="42" rx="4" ry="3" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="58" cy="42" rx="4" ry="3" fill="#ffffff"/>
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="42" r="2" fill="#2d2d2d"/>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="42" r="2" fill="#2d2d2d"/>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="41" cy="41" r="1" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="57" cy="41" r="1" fill="#fff" opacity="0"/>
    <!-- Eyebrows -->
    <path id="brow-left-border" d="M37 38 Q42 36 47 38" stroke="#fce4d4" stroke-width="2" fill="none"/>
    <path id="brow-left" d="M37 36 Q42 34 47 36" stroke="#2d2d2d" stroke-width="1.5" fill="none"/>
    <path id="brow-right-border" d="M53 38 Q58 36 63 38" stroke="#fce4d4" stroke-width="2" fill="none"/>
    <path id="brow-right" d="M53 36 Q58 34 63 36" stroke="#2d2d2d" stroke-width="1.5" fill="none"/>
  </g>
  <g id="head-bottom">
    <!-- Mouth closed - moved up -->
    <path id="mouth-closed" d="M46 52 Q50 55 54 52" stroke="#d4a59a" stroke-width="1.5" fill="none"/>
    <!-- Mouth open -->
    <ellipse id="mouth-open" cx="50" cy="53" rx="4" ry="3" fill="#d4a59a" opacity="0"/>
  </g>
</svg>
