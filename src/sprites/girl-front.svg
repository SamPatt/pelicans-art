<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Feminine body shape - hourglass -->
    <path d="M35 65 Q30 80 33 95 Q30 110 38 130 L42 130 Q45 115 50 115 Q55 115 58 130 L62 130 Q70 110 67 95 Q70 80 65 65 Q58 60 50 60 Q42 60 35 65" fill="#7dd3dc"/>
    <!-- Chest hint -->
    <ellipse cx="43" cy="75" rx="6" ry="5" fill="#6bc5ce"/>
    <ellipse cx="57" cy="75" rx="6" ry="5" fill="#6bc5ce"/>
    <!-- Arms -->
    <ellipse cx="28" cy="80" rx="5" ry="12" fill="#fce4d4"/>
    <ellipse cx="72" cy="80" rx="5" ry="12" fill="#fce4d4"/>
    <!-- Hands -->
    <ellipse cx="28" cy="94" rx="4" ry="3" fill="#fce4d4"/>
    <ellipse cx="72" cy="94" rx="4" ry="3" fill="#fce4d4"/>
    <!-- Legs -->
    <ellipse cx="43" cy="138" rx="5" ry="10" fill="#fce4d4"/>
    <ellipse cx="57" cy="138" rx="5" ry="10" fill="#fce4d4"/>
  </g>
  <g id="head-top">
    <!-- Hair back -->
    <ellipse cx="50" cy="36" rx="22" ry="24" fill="#5c3a21"/>
    <!-- Hair sides - simple flowing -->
    <path d="M28 36 Q24 50 26 70 Q28 80 32 85" stroke="#5c3a21" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M72 36 Q76 50 74 70 Q72 80 68 85" stroke="#5c3a21" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Hair highlight -->
    <ellipse cx="44" cy="26" rx="6" ry="4" fill="#7a4f2e" opacity="0.5"/>
    <!-- Face -->
    <ellipse cx="50" cy="42" rx="16" ry="18" fill="#fce4d4"/>
    <!-- Blush -->
    <ellipse cx="38" cy="46" rx="3" ry="2" fill="#ffb6b6" opacity="0.5"/>
    <ellipse cx="62" cy="46" rx="3" ry="2" fill="#ffb6b6" opacity="0.5"/>
    <!-- Eyes - matching human emotion coords -->
    <ellipse id="eye-left-white" cx="42" cy="42" rx="4" ry="3" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="58" cy="42" rx="4" ry="3" fill="#ffffff"/>
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="42" r="2" fill="#4a3728"/>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="42" r="2" fill="#4a3728"/>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="41" cy="41" r="1" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="57" cy="41" r="1" fill="#fff" opacity="0"/>
    <!-- Eyelashes -->
    <path d="M38 40 L37 38" stroke="#5c3a21" stroke-width="1" fill="none"/>
    <path d="M46 40 L47 38" stroke="#5c3a21" stroke-width="1" fill="none"/>
    <path d="M54 40 L53 38" stroke="#5c3a21" stroke-width="1" fill="none"/>
    <path d="M62 40 L63 38" stroke="#5c3a21" stroke-width="1" fill="none"/>
    <!-- Eyebrows -->
    <path id="brow-left" d="M37 36 Q42 34 47 36" stroke="#4a3728" stroke-width="1" fill="none"/>
    <path id="brow-right" d="M53 36 Q58 34 63 36" stroke="#4a3728" stroke-width="1" fill="none"/>
    <!-- Small nose -->
    <ellipse cx="50" cy="48" rx="2" ry="2" fill="#ebd5c5"/>
  </g>
  <g id="head-bottom">
    <!-- Mouth - matching human coords -->
    <path id="mouth-closed" d="M46 52 Q50 55 54 52" stroke="#d4a59a" stroke-width="1.5" fill="none"/>
    <ellipse id="mouth-open" cx="50" cy="53" rx="4" ry="3" fill="#d4a59a" opacity="0"/>
  </g>
</svg>
