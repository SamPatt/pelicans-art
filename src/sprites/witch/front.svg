<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Body: dress, cane, legs -->
  <g id="body">
    <!-- Dress -->
    <path d="M30 65 L22 135 L78 135 L70 65 Z" fill="#1a1a1a" stroke="#111" stroke-width="0.5"/>
    <!-- Dress folds -->
    <path d="M35 80 Q40 85 38 100" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    <path d="M60 75 Q62 90 58 110" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- Shawl/collar -->
    <path d="M30 65 L38 58 L50 62 L62 58 L70 65 L60 70 L40 70 Z" fill="#2a1a2a" stroke="#1a1a1a" stroke-width="0.5"/>
    <!-- Buckle/brooch -->
    <circle cx="50" cy="65" r="2.5" fill="#8a7a2a" stroke="#5a4a1a" stroke-width="0.5"/>
    <!-- Boots peeking out -->
    <path d="M32 133 Q35 140 44 138 L42 133 Z" fill="#2a1a1a"/>
    <path d="M58 133 L56 138 Q65 140 68 133 Z" fill="#2a1a1a"/>
    <!-- Cane -->
    <line x1="80" y1="58" x2="82" y2="140" stroke="#4a3a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M77 56 Q77 50 82 50 Q87 50 87 56" fill="none" stroke="#4a3a1a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right arm holding cane -->
    <path d="M68 68 Q76 75 80 60" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="80" cy="58" r="2.5" fill="#8a9a78"/>
    <!-- Left arm -->
    <path d="M32 68 Q24 80 26 92" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="26" cy="92" r="2.5" fill="#8a9a78"/>
  </g>

  <!-- Head top: hat, hair, eyes, brows -->
  <g id="head-top">
    <!-- Head upper shape -->
    <path d="M35 42 Q35 22 50 22 Q65 22 65 42 Z" fill="#8a9a78"/>
    <!-- Stringy hair -->
    <path d="M35 30 Q32 40 30 55" fill="none" stroke="#555" stroke-width="1.5"/>
    <path d="M37 28 Q33 38 32 50" fill="none" stroke="#555" stroke-width="1"/>
    <path d="M65 30 Q68 40 70 55" fill="none" stroke="#555" stroke-width="1.5"/>
    <path d="M63 28 Q67 38 68 50" fill="none" stroke="#555" stroke-width="1"/>
    <!-- Witch hat brim -->
    <ellipse cx="50" cy="24" rx="22" ry="4" fill="#1a1a1a" stroke="#111" stroke-width="0.5"/>
    <!-- Witch hat cone -->
    <path d="M32 24 L50 -8 L68 24 Z" fill="#1a1a1a" stroke="#111" stroke-width="0.5"/>
    <!-- Hat band -->
    <rect x="34" y="20" width="32" height="4" rx="1" fill="#3a2a1a"/>
    <!-- Hat buckle -->
    <rect x="46" y="19" width="8" height="6" rx="1" fill="#8a7a2a" stroke="#5a4a1a" stroke-width="0.5"/>
    <!-- Eye whites -->
    <ellipse id="eye-left-white" cx="42" cy="36" rx="4" ry="3" fill="#e8e0d0"/>
    <ellipse id="eye-right-white" cx="58" cy="36" rx="4" ry="3" fill="#e8e0d0"/>
    <!-- Pupils -->
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="36" r="1.8" fill="#2a4a1a"/>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="36" r="1.8" fill="#2a4a1a"/>
    <!-- Brows (arched, sinister) -->
    <path id="brow-left" d="M36 31 Q42 28 48 32" fill="none" stroke="#4a4a3a" stroke-width="1.2" stroke-linecap="round"/>
    <path id="brow-right" d="M52 32 Q58 28 64 31" fill="none" stroke="#4a4a3a" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Wrinkles -->
    <path d="M38 33 Q40 32 43 33" fill="none" stroke="#6a7a58" stroke-width="0.3"/>
    <path d="M57 33 Q60 32 62 33" fill="none" stroke="#6a7a58" stroke-width="0.3"/>
  </g>

  <!-- Head bottom: jaw, nose, mouth -->
  <g id="head-bottom">
    <!-- Lower face -->
    <path d="M35 42 Q35 60 50 60 Q65 60 65 42 Z" fill="#8a9a78"/>
    <!-- Big hooked nose -->
    <path d="M49 38 L45 48 Q44 50 47 50 L52 49" fill="#7a8a68" stroke="#5a6a48" stroke-width="0.8"/>
    <!-- Wart on nose -->
    <circle cx="46" cy="46" r="1.2" fill="#6a7a58"/>
    <!-- Wart on chin -->
    <circle cx="52" cy="57" r="1" fill="#6a7a58"/>
    <!-- Mouth closed (slight grimace) -->
    <path id="mouth-closed" d="M43 53 Q47 51 50 53 Q53 51 57 53" fill="none" stroke="#3a3a2a" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Mouth open (hidden) -->
    <ellipse id="mouth-open" cx="50" cy="53" rx="5" ry="3" fill="#2a1a1a" opacity="0"/>
    <!-- Chin -->
    <path d="M46 56 Q50 62 54 56" fill="none" stroke="#6a7a58" stroke-width="0.4"/>
    <!-- Jowl lines -->
    <path d="M38 48 Q36 52 37 56" fill="none" stroke="#6a7a58" stroke-width="0.3"/>
    <path d="M62 48 Q64 52 63 56" fill="none" stroke="#6a7a58" stroke-width="0.3"/>
  </g>
</svg>
