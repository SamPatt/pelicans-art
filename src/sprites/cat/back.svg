<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Body (back view - no chest marking visible) -->
    <ellipse cx="50" cy="105" rx="25" ry="40" fill="#ff9800"/>
    <!-- Tail (curves toward viewer from behind) -->
    <path d="M25 110 Q5 90 10 70" stroke="#ff9800" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g id="head-top">
    <!-- Ears (back view - see inside) -->
    <polygon points="28,45 35,20 45,45" fill="#ff9800"/>
    <polygon points="30,43 35,25 43,43" fill="#ffcc80"/>
    <polygon points="72,45 65,20 55,45" fill="#ff9800"/>
    <polygon points="70,43 65,25 57,43" fill="#ffcc80"/>
    <!-- Head (back - all orange, no face) -->
    <ellipse cx="50" cy="55" rx="25" ry="22" fill="#ff9800"/>
    <!-- Back of head pattern/fur detail -->
    <path d="M35 45 Q50 38 65 45" stroke="#e65100" stroke-width="2" fill="none"/>
    <path d="M40 55 Q50 50 60 55" stroke="#e65100" stroke-width="1.5" fill="none"/>
  </g>
  <g id="head-bottom">
    <!-- Just the back of head continuing - no mouth needed for back view -->
    <ellipse cx="50" cy="68" rx="12" ry="8" fill="#ff9800"/>
    <!-- Hidden mouth elements for compatibility -->
    <ellipse cx="50" cy="68" rx="6" ry="4" fill="#ff9800" opacity="0" id="mouth-closed"/>
    <ellipse cx="50" cy="68" rx="6" ry="4" fill="#ff9800" opacity="0" id="mouth-open"/>
  </g>
</svg>
