<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Back panel -->
    <rect x="30" y="75" width="40" height="75" rx="5" fill="#78909c"/>
    <!-- Back vents/details -->
    <rect x="35" y="80" width="30" height="4" fill="#546e7a"/>
    <rect x="35" y="88" width="30" height="4" fill="#546e7a"/>
    <rect x="35" y="96" width="30" height="4" fill="#546e7a"/>
    <!-- Power pack -->
    <rect x="40" y="105" width="20" height="15" rx="2" fill="#263238"/>
    <circle cx="50" cy="112" r="4" fill="#4caf50"/>
    <!-- Legs -->
    <rect x="38" y="115" width="8" height="30" fill="#546e7a"/>
    <rect x="54" y="115" width="8" height="30" fill="#546e7a"/>
  </g>
  <g id="head-top">
    <!-- Side ear panels (visible from back) -->
    <rect x="8" y="45" width="12" height="25" rx="2" fill="#546e7a"/>
    <rect x="80" y="45" width="12" height="25" rx="2" fill="#546e7a"/>
    <!-- Back of head -->
    <rect x="25" y="25" width="50" height="50" rx="8" fill="#90a4ae"/>
    <!-- Antenna -->
    <rect x="45" y="15" width="10" height="15" fill="#546e7a"/>
    <circle cx="50" cy="12" r="5" fill="#f44336"/>
    <!-- Back panel details -->
    <rect x="32" y="32" width="36" height="36" rx="4" fill="#78909c"/>
    <rect x="38" y="38" width="24" height="6" fill="#546e7a"/>
    <rect x="38" y="48" width="24" height="6" fill="#546e7a"/>
    <rect x="38" y="58" width="24" height="6" fill="#546e7a"/>
  </g>
  <g id="head-bottom">
    <!-- Hidden mouth elements for compatibility -->
    <rect x="38" y="58" width="24" height="8" rx="2" fill="#78909c" opacity="0" id="mouth-closed"/>
    <rect x="38" y="58" width="24" height="12" rx="2" fill="#78909c" opacity="0" id="mouth-open"/>
  </g>
</svg>
