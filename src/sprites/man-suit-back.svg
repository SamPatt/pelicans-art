<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Suit jacket back -->
    <rect x="30" y="85" width="40" height="65" rx="3" fill="#1a237e"/>
    <!-- Shoulders -->
    <ellipse cx="30" cy="90" rx="8" ry="12" fill="#1a237e"/>
    <ellipse cx="70" cy="90" rx="8" ry="12" fill="#1a237e"/>
    <!-- Back seam -->
    <line x1="50" y1="85" x2="50" y2="150" stroke="#0d1442" stroke-width="1"/>
    <!-- Neck -->
    <rect x="44" y="75" width="12" height="12" fill="#ffcc80"/>
  </g>
  <g id="head-top">
    <!-- Hair (back of head) -->
    <ellipse cx="50" cy="50" rx="24" ry="26" fill="#3e2723"/>
    <!-- Ears -->
    <ellipse cx="28" cy="52" rx="5" ry="8" fill="#ffcc80"/>
    <ellipse cx="72" cy="52" rx="5" ry="8" fill="#ffcc80"/>
  </g>
  <g id="head-bottom">
    <!-- Hair continues -->
    <ellipse cx="50" cy="65" rx="20" ry="12" fill="#3e2723"/>
  </g>
</svg>
