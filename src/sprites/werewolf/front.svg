<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Body: coat, walker, legs -->
  <g id="body">
    <!-- Brown overcoat -->
    <path d="M28 65 L24 130 L76 130 L72 65 Z" fill="#6a5a3a" stroke="#4a3a1a" stroke-width="0.5"/>
    <!-- Coat lapels -->
    <path d="M40 65 L45 80 L50 65" fill="#5a4a2a" stroke="#4a3a1a" stroke-width="0.5"/>
    <path d="M60 65 L55 80 L50 65" fill="#5a4a2a" stroke="#4a3a1a" stroke-width="0.5"/>
    <!-- Shirt underneath -->
    <path d="M42 65 L42 90 L50 92 L58 90 L58 65 Z" fill="#8a8a7a"/>
    <!-- Coat pockets -->
    <rect x="30" y="95" width="10" height="8" rx="1" fill="none" stroke="#4a3a1a" stroke-width="0.5"/>
    <rect x="60" y="95" width="10" height="8" rx="1" fill="none" stroke="#4a3a1a" stroke-width="0.5"/>
    <!-- Trousers -->
    <rect x="34" y="128" width="13" height="14" rx="2" fill="#3a3a2a"/>
    <rect x="53" y="128" width="13" height="14" rx="2" fill="#3a3a2a"/>
    <!-- Slippers -->
    <path d="M32 140 Q35 146 48 144 L47 140 Z" fill="#5a3a2a"/>
    <path d="M53 140 L52 144 Q65 146 68 140 Z" fill="#5a3a2a"/>
    <!-- Walker frame -->
    <rect x="15" y="75" width="2" height="65" rx="1" fill="#888" stroke="#666" stroke-width="0.5"/>
    <rect x="83" y="75" width="2" height="65" rx="1" fill="#888" stroke="#666" stroke-width="0.5"/>
    <rect x="15" y="75" width="70" height="2" rx="1" fill="#888" stroke="#666" stroke-width="0.5"/>
    <!-- Walker crossbar -->
    <rect x="15" y="105" width="70" height="1.5" rx="0.5" fill="#888" stroke="#666" stroke-width="0.3"/>
    <!-- Walker feet (tennis balls) -->
    <circle cx="16" cy="142" r="3" fill="#c8d830" stroke="#a8b810" stroke-width="0.5"/>
    <circle cx="84" cy="142" r="3" fill="#c8d830" stroke="#a8b810" stroke-width="0.5"/>
    <!-- Arms gripping walker -->
    <path d="M30 68 Q22 78 16 76" fill="none" stroke="#6a5a3a" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 68 Q78 78 84 76" fill="none" stroke="#6a5a3a" stroke-width="5" stroke-linecap="round"/>
    <!-- Furry hands -->
    <circle cx="16" cy="76" r="3.5" fill="#7a6a4a"/>
    <circle cx="84" cy="76" r="3.5" fill="#7a6a4a"/>
    <!-- Claws on hands -->
    <path d="M13 74 L11 72" stroke="#3a3a2a" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M14 76 L12 75" stroke="#3a3a2a" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M87 74 L89 72" stroke="#3a3a2a" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M86 76 L88 75" stroke="#3a3a2a" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Head top: fur, ears, eyes, glasses, brows -->
  <g id="head-top">
    <!-- Head shape (furry) -->
    <path d="M32 42 Q32 14 50 12 Q68 14 68 42 Z" fill="#7a6a4a"/>
    <!-- Fur texture on head -->
    <path d="M35 18 L33 14 L37 18" fill="#7a6a4a" stroke="#5a4a2a" stroke-width="0.3"/>
    <path d="M45 14 L44 10 L47 14" fill="#7a6a4a" stroke="#5a4a2a" stroke-width="0.3"/>
    <path d="M55 14 L56 10 L53 14" fill="#7a6a4a" stroke="#5a4a2a" stroke-width="0.3"/>
    <path d="M65 18 L67 14 L63 18" fill="#7a6a4a" stroke="#5a4a2a" stroke-width="0.3"/>
    <!-- Pointed ears -->
    <path d="M30 30 L22 10 L36 26 Z" fill="#7a6a4a" stroke="#5a4a2a" stroke-width="0.5"/>
    <path d="M70 30 L78 10 L64 26 Z" fill="#7a6a4a" stroke="#5a4a2a" stroke-width="0.5"/>
    <!-- Inner ear -->
    <path d="M32 28 L26 14 L36 26 Z" fill="#9a7a5a"/>
    <path d="M68 28 L74 14 L64 26 Z" fill="#9a7a5a"/>
    <!-- Grey patches (elderly) -->
    <path d="M33 30 Q34 22 38 18" fill="none" stroke="#9a9a8a" stroke-width="2" stroke-linecap="round"/>
    <path d="M67 30 Q66 22 62 18" fill="none" stroke="#9a9a8a" stroke-width="2" stroke-linecap="round"/>
    <!-- Glasses frames -->
    <circle cx="42" cy="36" r="7" fill="none" stroke="#4a4a4a" stroke-width="1.2"/>
    <circle cx="58" cy="36" r="7" fill="none" stroke="#4a4a4a" stroke-width="1.2"/>
    <line x1="49" y1="36" x2="51" y2="36" stroke="#4a4a4a" stroke-width="1.2"/>
    <line x1="35" y1="35" x2="31" y2="33" stroke="#4a4a4a" stroke-width="1"/>
    <line x1="65" y1="35" x2="69" y2="33" stroke="#4a4a4a" stroke-width="1"/>
    <!-- Eye whites (behind glasses) -->
    <ellipse id="eye-left-white" cx="42" cy="36" rx="4" ry="2.5" fill="#e8dcc8"/>
    <ellipse id="eye-right-white" cx="58" cy="36" rx="4" ry="2.5" fill="#e8dcc8"/>
    <!-- Pupils (amber/yellow) -->
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="36" r="1.5" fill="#a88a10"/>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="36" r="1.5" fill="#a88a10"/>
    <!-- Brows (tired, drooping) -->
    <path id="brow-left" d="M35 28 Q42 27 48 30" fill="none" stroke="#5a4a2a" stroke-width="1.2" stroke-linecap="round"/>
    <path id="brow-right" d="M52 30 Q58 27 65 28" fill="none" stroke="#5a4a2a" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Head bottom: snout, mouth, chin -->
  <g id="head-bottom">
    <!-- Lower face / muzzle -->
    <path d="M32 42 Q32 60 50 62 Q68 60 68 42 Z" fill="#7a6a4a"/>
    <!-- Lighter muzzle area -->
    <path d="M38 44 Q38 56 50 58 Q62 56 62 44 Z" fill="#9a8a6a"/>
    <!-- Nose (canine) -->
    <ellipse cx="50" cy="46" rx="4" ry="3" fill="#3a2a1a"/>
    <!-- Nose highlight -->
    <ellipse cx="49" cy="45" rx="1.5" ry="1" fill="#5a4a3a"/>
    <!-- Mouth closed -->
    <path id="mouth-closed" d="M43 52 Q50 55 57 52" fill="none" stroke="#3a2a1a" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Mouth open (hidden) -->
    <ellipse id="mouth-open" cx="50" cy="53" rx="5" ry="3" fill="#5a2a1a" opacity="0"/>
    <!-- Jowl fur -->
    <path d="M34 50 Q32 54 33 58" fill="none" stroke="#5a4a2a" stroke-width="0.5"/>
    <path d="M66 50 Q68 54 67 58" fill="none" stroke="#5a4a2a" stroke-width="0.5"/>
    <!-- Chin fur tuft -->
    <path d="M46 58 L44 62 M50 59 L50 63 M54 58 L56 62" fill="none" stroke="#9a9a8a" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
