<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <rect x="32" y="88" width="36" height="62" fill="#1a237e"/>
    <polygon points="50,88 46,100 50,150 54,100" fill="#c62828"/>
    <polygon points="44,88 50,95 56,88" fill="#ffffff"/>
  </g>
  <g id="head-top">
    <!-- Hair back -->
    <ellipse cx="50" cy="35" rx="24" ry="18" fill="#ffb300"/>
    <!-- Face - single clean oval -->
    <ellipse cx="50" cy="52" rx="20" ry="26" fill="#ffcc80"/>
    <!-- Eyes - white part -->
    <ellipse cx="43" cy="48" rx="4" ry="3" fill="#ffffff"/>
    <ellipse cx="57" cy="48" rx="4" ry="3" fill="#ffffff"/>
    <!-- Pupils -->
    <circle class="pupil pupil-left" cx="43" cy="48" r="1.5" fill="#000000"/>
    <circle class="pupil pupil-right" cx="57" cy="48" r="1.5" fill="#000000"/>
    <!-- Eyebrows -->
    <path d="M37 43 Q43 40 49 44" stroke="#b38600" stroke-width="2" fill="none"/>
    <path d="M51 44 Q57 40 63 43" stroke="#b38600" stroke-width="2" fill="none"/>
    <!-- Nose -->
    <ellipse cx="50" cy="55" rx="3" ry="4" fill="#ffb74d"/>
    <!-- Hair swoop -->
    <path d="M30 38 Q38 22 55 25 Q70 28 74 42 Q62 34 50 32 Q38 30 30 38" fill="#ffb300"/>
  </g>
  <g id="head-bottom">
    <!-- Lower face connects to head-top - just chin area -->
    <ellipse cx="50" cy="72" rx="18" ry="10" fill="#ffcc80"/>
    <!-- Mouth closed -->
    <path d="M44 70 Q50 72 56 70" stroke="#8d6e63" stroke-width="1.5" fill="none" id="mouth-closed"/>
    <!-- Mouth open interior -->
    <ellipse cx="50" cy="71" rx="5" ry="2" fill="#5d4037" opacity="0" id="mouth-open"/>
  </g>
</svg>
