<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Body -->
    <ellipse cx="50" cy="105" rx="25" ry="40" fill="#ff9800"/>
    <!-- Chest -->
    <ellipse cx="50" cy="100" rx="15" ry="22" fill="#ffe0b2"/>
    <!-- Tail -->
    <path d="M75 110 Q95 90 90 70" stroke="#ff9800" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g id="head-top">
    <!-- Ears -->
    <polygon points="28,45 35,20 45,45" fill="#ff9800"/>
    <polygon points="32,42 36,28 42,42" fill="#ffcc80"/>
    <polygon points="72,45 65,20 55,45" fill="#ff9800"/>
    <polygon points="68,42 64,28 58,42" fill="#ffcc80"/>
    <!-- Head -->
    <ellipse cx="50" cy="55" rx="25" ry="22" fill="#ff9800"/>
    <!-- Inner face -->
    <ellipse cx="50" cy="58" rx="18" ry="15" fill="#ffe0b2"/>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="40" cy="52" rx="6" ry="7" fill="#fff176"/>
    <ellipse id="eye-right-white" cx="60" cy="52" rx="6" ry="7" fill="#fff176"/>
    <ellipse id="eye-left-pupil" class="pupil" cx="40" cy="52" rx="2" ry="5" fill="#000000"/>
    <ellipse id="eye-right-pupil" class="pupil" cx="60" cy="52" rx="2" ry="5" fill="#000000"/>
    <!-- Eye highlights (for excited/surprised) -->
    <circle id="eye-left-highlight" cx="38" cy="50" r="2" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="58" cy="50" r="2" fill="#fff" opacity="0"/>
    <!-- Nose -->
    <polygon points="50,62 46,58 54,58" fill="#ff7043"/>
    <!-- Eyebrows (forehead ridges for cat) -->
    <path id="brow-left" d="M30 44 Q40 42 48 44" stroke="#e65100" stroke-width="2" fill="none" opacity="0.7"/>
    <path id="brow-right" d="M52 44 Q60 42 70 44" stroke="#e65100" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  <g id="head-bottom">
    <!-- Muzzle -->
    <ellipse cx="50" cy="68" rx="12" ry="8" fill="#ffe0b2"/>
    <!-- Mouth closed -->
    <path id="mouth-closed" d="M50 65 L46 70 M50 65 L54 70" stroke="#5d4037" stroke-width="1.5" fill="none"/>
    <!-- Mouth open -->
    <ellipse id="mouth-open" cx="50" cy="68" rx="6" ry="4" fill="#f44336" opacity="0"/>
    <!-- Whiskers -->
    <line x1="25" y1="62" x2="38" y2="65" stroke="#5d4037" stroke-width="1"/>
    <line x1="25" y1="68" x2="38" y2="68" stroke="#5d4037" stroke-width="1"/>
    <line x1="62" y1="65" x2="75" y2="62" stroke="#5d4037" stroke-width="1"/>
    <line x1="62" y1="68" x2="75" y2="68" stroke="#5d4037" stroke-width="1"/>
  </g>
</svg>
