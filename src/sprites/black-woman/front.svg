<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" width="100" height="150" style="cursor: default;">
  <g id="body">
    <!-- Neck -->
    <rect x="46" y="60" width="8" height="10" fill="#5d4037" style="cursor: pointer;"></rect>
    <!-- Purple Top -->
    <path d="M30 70 Q50 65 70 70 L75 110 L25 110 Z" fill="#6a1b9a" style="cursor: pointer;"></path>
    <!-- Arms -->
    <rect x="20" y="70" width="10" height="35" rx="5" fill="#5d4037" style="cursor: pointer;"></rect>
    <rect x="70" y="70" width="10" height="35" rx="5" fill="#5d4037" style="cursor: pointer;"></rect>
    <!-- Pants -->
    <rect x="25" y="110" width="24" height="40" fill="#37474f" style="cursor: pointer;"></rect>
    <rect x="51" y="110" width="24" height="40" fill="#37474f" style="cursor: pointer;"></rect>
  </g>
  <g id="head-top">
    <!-- Afro Hair -->
    <circle cx="50" cy="35" r="22" fill="#1a1a1a" style="cursor: pointer;"></circle>
    <circle cx="32" cy="40" r="10" fill="#1a1a1a" style="cursor: pointer;"></circle>
    <circle cx="68" cy="40" r="10" fill="#1a1a1a" style="cursor: pointer;"></circle>
    <!-- Face -->
    <ellipse cx="50" cy="42" rx="17" ry="20" fill="#5d4037" style="cursor: pointer;" class=""></ellipse>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="43.2" cy="37.7" rx="4" ry="2.0482874999999994" fill="#ffffff" style="cursor: pointer;" opacity="1" class=""></ellipse>
    <ellipse id="eye-right-white" cx="57.2" cy="37.7" rx="4" ry="2.0482874999999994" fill="#ffffff" style="cursor: pointer;" opacity="1" class=""></ellipse>
    <circle id="eye-left-pupil" class="pupil" cx="43.2" cy="37.7" r="1.1664000000000003" fill="#1a1a1a" style="cursor: pointer;" opacity="1"></circle>
    <circle id="eye-right-pupil" class="pupil" cx="57.2" cy="37.7" r="1.1664000000000003" fill="#1a1a1a" style="cursor: pointer;" opacity="1"></circle>
    <!-- Brows -->
    <path id="brow-left" d="M38 36 Q43 34 48 36" stroke="#1a1a1a" stroke-width="1.5" fill="none" style="cursor: pointer;" transform="translate(0.1, -6.6) rotate(-12, 43, 35.333333333333336)" class=""></path>
    <path id="brow-right" d="M52 36 Q57 34 62 36" stroke="#1a1a1a" stroke-width="1.5" fill="none" style="cursor: pointer;" transform="translate(0.1, -6.6) rotate(12, 57, 35.333333333333336)" class=""></path>
    <!-- Nose -->
    <path d="M48 50 Q50 52 52 50" stroke="#4e342e" stroke-width="1" fill="none" style="cursor: pointer;"></path>
  </g>
  <g id="head-bottom">
    <!-- Mouth Alignment: Both at 50, 56 -->
    <path id="mouth-closed" d="M45 56 Q50 58 55 56" stroke="#3e2723" stroke-width="1.5" fill="none" style="cursor: pointer;" opacity="1" transform="translate(-0.2, -3.0) translate(50, 56.666666666666664) rotate(0) scale(0.9, -0.9) translate(-50, -56.666666666666664)" class=""></path>
    <ellipse id="mouth-open" cx="50.0" cy="59.2" rx="2" ry="3.12" fill="#3e2723" opacity="0" style="cursor: pointer;" class=""></ellipse>
    <!-- Chin -->
    <path d="M33 45 Q50 65 67 45" fill="none" style="cursor: pointer;"></path>
  </g>
<g id="x-eyes-group" opacity="0">
            <line x1="39.4" y1="38.4" x2="46.6" y2="45.6" stroke="#000" stroke-width="2" style="cursor: pointer;"></line>
            <line x1="46.6" y1="38.4" x2="39.4" y2="45.6" stroke="#000" stroke-width="2" style="cursor: pointer;"></line>
            <line x1="53.4" y1="38.4" x2="60.6" y2="45.6" stroke="#000" stroke-width="2" style="cursor: pointer;" class=""></line>
            <line x1="60.6" y1="38.4" x2="53.4" y2="45.6" stroke="#000" stroke-width="2" style="cursor: pointer;" class=""></line>
          </g></svg>