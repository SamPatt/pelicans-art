<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Classic grey alien - back view -->
  <g id="body">
    <!-- Thin grey body -->
    <ellipse cx="50" cy="110" rx="18" ry="35" fill="#9e9e9e"/>
    <!-- Back ridge/spine detail -->
    <line x1="50" y1="80" x2="50" y2="130" stroke="#757575" stroke-width="2"/>
    <!-- Arms (thin, long) -->
    <path d="M32 95 Q15 110 20 130" stroke="#9e9e9e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M68 95 Q85 110 80 130" stroke="#9e9e9e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Hands (three fingers) -->
    <circle cx="20" cy="132" r="4" fill="#bdbdbd"/>
    <circle cx="80" cy="132" r="4" fill="#bdbdbd"/>
    <!-- Legs -->
    <rect x="40" y="140" width="6" height="10" rx="2" fill="#9e9e9e"/>
    <rect x="54" y="140" width="6" height="10" rx="2" fill="#9e9e9e"/>
  </g>
  <g id="head-top">
    <!-- Big oval head from behind -->
    <ellipse cx="50" cy="45" rx="35" ry="40" fill="#bdbdbd"/>
    <!-- Head back detail -->
    <ellipse cx="50" cy="35" rx="15" ry="12" fill="#aeaeae" opacity="0.5"/>
  </g>
  <g id="head-bottom">
    <!-- No face visible from back -->
  </g>
</svg>
