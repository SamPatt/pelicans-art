<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Body: bandaged body in wheelchair -->
  <g id="body">
    <!-- Wheelchair back -->
    <rect x="25" y="60" width="50" height="3" rx="1" fill="#666" stroke="#444" stroke-width="0.5"/>
    <!-- Wheelchair back support -->
    <rect x="26" y="40" width="2" height="20" rx="1" fill="#666"/>
    <rect x="72" y="40" width="2" height="20" rx="1" fill="#666"/>
    <!-- Wheelchair seat -->
    <rect x="25" y="95" width="50" height="3" rx="1" fill="#666" stroke="#444" stroke-width="0.5"/>
    <!-- Bandaged torso -->
    <path d="M34 62 L32 95 L68 95 L66 62 Z" fill="#d8cdb8" stroke="#b8a888" stroke-width="0.5"/>
    <!-- Bandage wrap lines on torso -->
    <path d="M34 68 Q50 72 66 68" fill="none" stroke="#c8b898" stroke-width="1"/>
    <path d="M33 76 Q50 80 67 76" fill="none" stroke="#c8b898" stroke-width="1"/>
    <path d="M33 84 Q50 88 67 84" fill="none" stroke="#c8b898" stroke-width="1"/>
    <path d="M32 92 Q50 96 68 92" fill="none" stroke="#c8b898" stroke-width="1"/>
    <!-- Bandaged legs (on wheelchair) -->
    <rect x="36" y="95" width="10" height="18" rx="2" fill="#d8cdb8" stroke="#b8a888" stroke-width="0.5"/>
    <rect x="54" y="95" width="10" height="18" rx="2" fill="#d8cdb8" stroke="#b8a888" stroke-width="0.5"/>
    <!-- Leg bandage wraps -->
    <path d="M36 100 L46 98" fill="none" stroke="#c8b898" stroke-width="0.8"/>
    <path d="M36 106 L46 104" fill="none" stroke="#c8b898" stroke-width="0.8"/>
    <path d="M54 100 L64 98" fill="none" stroke="#c8b898" stroke-width="0.8"/>
    <path d="M54 106 L64 104" fill="none" stroke="#c8b898" stroke-width="0.8"/>
    <!-- Bandaged feet -->
    <ellipse cx="41" cy="114" rx="6" ry="3" fill="#d8cdb8" stroke="#b8a888" stroke-width="0.5"/>
    <ellipse cx="59" cy="114" rx="6" ry="3" fill="#d8cdb8" stroke="#b8a888" stroke-width="0.5"/>
    <!-- Arms -->
    <path d="M36 66 Q26 78 24 88" fill="none" stroke="#d8cdb8" stroke-width="6" stroke-linecap="round"/>
    <path d="M64 66 Q74 78 76 88" fill="none" stroke="#d8cdb8" stroke-width="6" stroke-linecap="round"/>
    <!-- Bandaged hands -->
    <circle cx="24" cy="88" r="3.5" fill="#d8cdb8" stroke="#b8a888" stroke-width="0.5"/>
    <circle cx="76" cy="88" r="3.5" fill="#d8cdb8" stroke="#b8a888" stroke-width="0.5"/>
    <!-- Hand bandage lines -->
    <path d="M22 86 L26 90" fill="none" stroke="#c8b898" stroke-width="0.5"/>
    <path d="M74 86 L78 90" fill="none" stroke="#c8b898" stroke-width="0.5"/>
    <!-- Wheelchair wheels -->
    <circle cx="22" cy="115" r="15" fill="none" stroke="#666" stroke-width="2"/>
    <circle cx="22" cy="115" r="2" fill="#666"/>
    <circle cx="78" cy="115" r="15" fill="none" stroke="#666" stroke-width="2"/>
    <circle cx="78" cy="115" r="2" fill="#666"/>
    <!-- Wheelchair spokes -->
    <line x1="22" y1="100" x2="22" y2="130" stroke="#888" stroke-width="0.5"/>
    <line x1="7" y1="115" x2="37" y2="115" stroke="#888" stroke-width="0.5"/>
    <line x1="78" y1="100" x2="78" y2="130" stroke="#888" stroke-width="0.5"/>
    <line x1="63" y1="115" x2="93" y2="115" stroke="#888" stroke-width="0.5"/>
    <!-- Wheelchair front casters -->
    <circle cx="35" cy="132" r="3" fill="none" stroke="#666" stroke-width="1.5"/>
    <circle cx="65" cy="132" r="3" fill="none" stroke="#666" stroke-width="1.5"/>
    <!-- Footrest -->
    <rect x="33" y="118" width="34" height="2" rx="1" fill="#666"/>
    <!-- Loose bandage trailing -->
    <path d="M66 65 Q72 58 78 62 Q82 68 76 72" fill="none" stroke="#d8cdb8" stroke-width="2" stroke-linecap="round"/>
    <path d="M34 90 Q28 94 22 90" fill="none" stroke="#d8cdb8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Head top: bandaged head, eyes peeking through -->
  <g id="head-top">
    <!-- Head shape (bandaged) -->
    <path d="M34 40 Q34 12 50 12 Q66 12 66 40 Z" fill="#d8cdb8"/>
    <!-- Bandage wraps on head -->
    <path d="M34 18 Q50 22 66 18" fill="none" stroke="#c8b898" stroke-width="1.5"/>
    <path d="M34 26 Q50 30 66 26" fill="none" stroke="#c8b898" stroke-width="1.5"/>
    <path d="M35 34 Q50 38 65 34" fill="none" stroke="#c8b898" stroke-width="1.5"/>
    <!-- Gap for eyes (darker skin underneath) -->
    <ellipse cx="42" cy="36" rx="6" ry="4" fill="#8a7a5a"/>
    <ellipse cx="58" cy="36" rx="6" ry="4" fill="#8a7a5a"/>
    <!-- Eye whites -->
    <ellipse id="eye-left-white" cx="42" cy="36" rx="4.5" ry="3" fill="#e8dcc8"/>
    <ellipse id="eye-right-white" cx="58" cy="36" rx="4.5" ry="3" fill="#e8dcc8"/>
    <!-- Pupils (ancient amber) -->
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="36" r="2" fill="#5a4a1a"/>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="36" r="2" fill="#5a4a1a"/>
    <!-- Brows (made of bandage folds) -->
    <path id="brow-left" d="M36 31 Q42 29 48 32" fill="none" stroke="#b8a888" stroke-width="1.5" stroke-linecap="round"/>
    <path id="brow-right" d="M52 32 Q58 29 64 31" fill="none" stroke="#b8a888" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Loose bandage end on top -->
    <path d="M60 14 Q68 8 72 14 Q74 20 68 22" fill="none" stroke="#d8cdb8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Head bottom: bandaged lower face, mouth gap -->
  <g id="head-bottom">
    <!-- Lower face (bandaged) -->
    <path d="M34 40 Q34 58 50 58 Q66 58 66 40 Z" fill="#d8cdb8"/>
    <!-- More bandage wraps -->
    <path d="M35 42 Q50 46 65 42" fill="none" stroke="#c8b898" stroke-width="1.2"/>
    <path d="M34 50 Q50 54 66 50" fill="none" stroke="#c8b898" stroke-width="1.2"/>
    <!-- Gap for mouth (darker underneath) -->
    <ellipse cx="50" cy="48" rx="8" ry="4" fill="#8a7a5a"/>
    <!-- Nose bump under bandage -->
    <path d="M48 42 Q50 40 52 42" fill="none" stroke="#c8b898" stroke-width="0.8"/>
    <!-- Mouth closed -->
    <path id="mouth-closed" d="M44 49 Q50 52 56 49" fill="none" stroke="#5a4a3a" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Mouth open (hidden) -->
    <ellipse id="mouth-open" cx="50" cy="50" rx="5" ry="3" fill="#3a2a1a" opacity="0"/>
  </g>
</svg>
