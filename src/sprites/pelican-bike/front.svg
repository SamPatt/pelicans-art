<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <defs>
    <linearGradient id="bike-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#ef5350"/><stop offset="1" stop-color="#a9152b"/>
    </linearGradient>
    <linearGradient id="bill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#ffbd35"/><stop offset="1" stop-color="#f17b16"/>
    </linearGradient>
  </defs>

  <!-- The bicycle remains rigid while the actor's body and bill animate. -->
  <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
    <g fill="#f7fbfd" stroke="#26343d" stroke-width="3">
      <circle cx="21" cy="125" r="18"/><circle cx="78" cy="125" r="18"/>
    </g>
    <g stroke="#93a4ad" stroke-width="0.8">
      <path d="M21 107v36M3 125h36M8 112l26 26M8 138l26-26"/>
      <path d="M78 107v36M60 125h36M65 112l26 26M65 138l26-26"/>
    </g>
    <g fill="none" stroke="url(#bike-frame)" stroke-width="4">
      <path d="M21 125 39 96l19 29H21l33-20 24 20"/>
      <path d="M54 105 50 91M78 125 70 88"/>
    </g>
    <path d="M64 88h14M70 88l8-4" fill="none" stroke="#26343d" stroke-width="3"/>
    <path d="M43 91H31" stroke="#26343d" stroke-width="4"/>
