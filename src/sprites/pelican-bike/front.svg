    <path d="M35 76c-8 6-7 19 2 25 7 5 15 2 19-5-10 1-15-5-21-20Z" fill="#75858d" stroke="#53636c" stroke-width="1.3"/>
    <path d="M54 75c4 2 8 5 13 13" fill="none" stroke="#f4a928" stroke-width="4"/>
    <path d="M67 88h7" stroke="#f4a928" stroke-width="4"/>
    <path d="M40 101c1 9 5 20 9 29M55 102c4 5 6 9 8 16" fill="none" stroke="#f4a928" stroke-width="4"/>
    <path d="M44 132h8M60 118h8" stroke="#f4a928" stroke-width="4"/>
    <path d="M27 86c-5 8-5 14-2 20" fill="none" stroke="#596a73" stroke-width="3"/>
  </g>

  <g id="head-top">
