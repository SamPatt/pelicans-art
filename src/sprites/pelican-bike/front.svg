    <ellipse id="eye-left-pupil" class="pupil" cx="60" cy="37" rx="2.1" ry="2.8" fill="#20282d"/>
    <circle cx="60.7" cy="35.8" r="0.7" fill="#fff"/>
    <ellipse id="eye-right-white" cx="50" cy="35" rx="1" ry="1" fill="#fff" opacity="0"/>
    <ellipse id="eye-right-pupil" class="pupil" cx="50" cy="35" rx="0.5" ry="0.5" fill="#20282d" opacity="0"/>
