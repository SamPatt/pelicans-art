  <g id="head-bottom">
    <path d="M62 42 91 46c5 1 6 5 1 7L62 56Z" fill="url(#bill)" stroke="#ad5b16" stroke-width="1.3"/>
    <path d="M62 53c6 13 20 14 30 0-11 3-20 1-30 0Z" fill="#f7a521" stroke="#ad5b16" stroke-width="1.2"/>
