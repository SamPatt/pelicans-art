<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <rect x="32" y="78" width="36" height="72" fill="#2196f3"/>
    <polygon points="50,78 46,90 50,150 54,90" fill="#1976d2"/>
  </g>
  <g id="head-top">
    <!-- Hair -->
    <ellipse cx="50" cy="32" rx="22" ry="16" fill="#5d4037"/>
    <!-- Face -->
    <ellipse cx="50" cy="50" rx="20" ry="24" fill="#ffcc80"/>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="43" cy="46" rx="4" ry="3" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="57" cy="46" rx="4" ry="3" fill="#ffffff"/>
    <circle id="eye-left-pupil" class="pupil" cx="43" cy="46" r="1.5" fill="#000000"/>
    <circle id="eye-right-pupil" class="pupil" cx="57" cy="46" r="1.5" fill="#000000"/>
    <!-- Eye highlights (for excited/surprised) -->
    <circle id="eye-left-highlight" cx="42" cy="45" r="1" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="56" cy="45" r="1" fill="#fff" opacity="0"/>
    <!-- Eyebrows -->
    <path id="brow-left-border" d="M37 42 Q43 40 49 42" stroke="#ffcc80" stroke-width="3" fill="none"/>
    <path id="brow-left" d="M37 40 Q43 38 49 40" stroke="#5d4037" stroke-width="2" fill="none"/>
    <path id="brow-right-border" d="M51 42 Q57 40 63 42" stroke="#ffcc80" stroke-width="3" fill="none"/>
    <path id="brow-right" d="M51 40 Q57 38 63 40" stroke="#5d4037" stroke-width="2" fill="none"/>
    <!-- Nose -->
    <ellipse cx="50" cy="53" rx="2.5" ry="3" fill="#ffb74d"/>
  </g>
  <g id="head-bottom">
    <ellipse cx="50" cy="70" rx="17" ry="9" fill="#ffcc80"/>
    <!-- Mouth closed -->
    <path id="mouth-closed" d="M44 67 Q50 70 56 67" stroke="#8d6e63" stroke-width="1.5" fill="none"/>
    <!-- Mouth open -->
    <ellipse id="mouth-open" cx="50" cy="68" rx="5" ry="3" fill="#5d4037" opacity="0"/>
  </g>
</svg>
