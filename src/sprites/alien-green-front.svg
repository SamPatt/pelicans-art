<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Green geometric alien from showcase -->
  <g id="body">
    <!-- Green body -->
    <ellipse cx="50" cy="110" rx="20" ry="35" fill="#81c784"/>
    <!-- Arms -->
    <path d="M30 100 Q15 115 20 135" stroke="#81c784" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M70 100 Q85 115 80 135" stroke="#81c784" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="20" cy="137" r="5" fill="#a5d6a7"/>
    <circle cx="80" cy="137" r="5" fill="#a5d6a7"/>
    <!-- Legs -->
    <rect x="40" y="140" width="7" height="10" rx="3" fill="#81c784"/>
    <rect x="53" y="140" width="7" height="10" rx="3" fill="#81c784"/>
  </g>
  <g id="head-top">
    <!-- Big round head -->
    <ellipse cx="50" cy="45" rx="28" ry="32" fill="#a5d6a7"/>
    <!-- Head shine -->
    <ellipse cx="40" cy="30" rx="10" ry="6" fill="#c8e6c9" opacity="0.6"/>
    <!-- Large almond eyes - black -->
    <ellipse cx="38" cy="42" rx="10" ry="14" fill="#000"/>
    <ellipse cx="62" cy="42" rx="10" ry="14" fill="#000"/>
    <!-- Pupils - light green glow -->
    <ellipse class="pupil pupil-left" cx="38" cy="44" rx="5" ry="7" fill="#e8f5e9"/>
    <ellipse class="pupil pupil-right" cx="62" cy="44" rx="5" ry="7" fill="#e8f5e9"/>
    <!-- Brows for expressions -->
    <path class="brow brow-left" d="M28 32 Q38 28 46 32" stroke="#81c784" stroke-width="2" fill="none"/>
    <path class="brow brow-right" d="M54 32 Q62 28 72 32" stroke="#81c784" stroke-width="2" fill="none"/>
    <!-- Eye highlights -->
    <ellipse class="highlight highlight-left" cx="34" cy="38" rx="2" ry="3" fill="#fff" opacity="0"/>
    <ellipse class="highlight highlight-right" cx="58" cy="38" rx="2" ry="3" fill="#fff" opacity="0"/>
  </g>
  <g id="head-bottom">
    <!-- Small mouth -->
    <ellipse id="mouth-closed" cx="50" cy="62" rx="3" ry="2" fill="#558b2f"/>
    <!-- Open mouth for speaking -->
    <ellipse id="mouth-open" cx="50" cy="62" rx="5" ry="4" fill="#33691e" opacity="0"/>
  </g>
</svg>
