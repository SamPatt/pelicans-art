<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Classic grey alien -->
  <g id="body">
    <!-- Thin grey body -->
    <ellipse cx="50" cy="110" rx="18" ry="35" fill="#9e9e9e"/>
    <!-- Chest glow -->
    <ellipse cx="50" cy="100" rx="8" ry="10" fill="#b2ff59" opacity="0.4"/>
    <!-- Arms (thin, long) -->
    <path d="M32 95 Q15 110 20 130" stroke="#9e9e9e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M68 95 Q85 110 80 130" stroke="#9e9e9e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Hands (three fingers) -->
    <circle cx="20" cy="132" r="4" fill="#bdbdbd"/>
    <circle cx="80" cy="132" r="4" fill="#bdbdbd"/>
    <!-- Legs -->
    <rect x="40" y="140" width="6" height="10" rx="2" fill="#9e9e9e"/>
    <rect x="54" y="140" width="6" height="10" rx="2" fill="#9e9e9e"/>
  </g>
  <g id="head-top">
    <!-- Big oval head -->
    <ellipse cx="50" cy="45" rx="35" ry="40" fill="#bdbdbd"/>
    <!-- Head shine -->
    <ellipse cx="40" cy="30" rx="12" ry="8" fill="#e0e0e0" opacity="0.5"/>
    <!-- Large almond eyes - black background -->
    <ellipse cx="35" cy="50" rx="12" ry="16" fill="#000"/>
    <ellipse cx="65" cy="50" rx="12" ry="16" fill="#000"/>
    <!-- Eye shine -->
    <ellipse cx="30" cy="45" rx="4" ry="5" fill="#333" opacity="0.5"/>
    <ellipse cx="60" cy="45" rx="4" ry="5" fill="#333" opacity="0.5"/>
    <!-- Pupils (for eye tracking) - green glow -->
    <ellipse class="pupil pupil-left" cx="35" cy="52" rx="5" ry="7" fill="#76ff03"/>
    <ellipse class="pupil pupil-right" cx="65" cy="52" rx="5" ry="7" fill="#76ff03"/>
    <!-- Brow area for expressions -->
    <path class="brow brow-left" d="M23 38 Q35 35 42 40" stroke="#9e9e9e" stroke-width="2" fill="none"/>
    <path class="brow brow-right" d="M58 40 Q65 35 77 38" stroke="#9e9e9e" stroke-width="2" fill="none"/>
    <!-- Eye highlights -->
    <ellipse class="highlight highlight-left" cx="30" cy="46" rx="2" ry="3" fill="#fff" opacity="0"/>
    <ellipse class="highlight highlight-right" cx="60" cy="46" rx="2" ry="3" fill="#fff" opacity="0"/>
  </g>
  <g id="head-bottom">
    <!-- Small slit mouth -->
    <path id="mouth-closed" d="M42 72 Q50 75 58 72" stroke="#757575" stroke-width="2" fill="none"/>
    <!-- Open mouth for speaking -->
    <ellipse id="mouth-open" cx="50" cy="73" rx="6" ry="4" fill="#424242" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.15s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Nose (just two small dots) -->
    <circle cx="47" cy="65" r="1" fill="#9e9e9e"/>
    <circle cx="53" cy="65" r="1" fill="#9e9e9e"/>
  </g>
</svg>
