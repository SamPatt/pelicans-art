<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <rect x="30" y="75" width="40" height="75" rx="5" fill="#78909c"/>
    <rect x="35" y="85" width="30" height="20" rx="3" fill="#263238"/>
    <circle cx="42" cy="95" r="4" fill="#4caf50"/>
    <circle cx="50" cy="95" r="4" fill="#ffeb3b"/>
    <circle cx="58" cy="95" r="4" fill="#f44336"/>
    <rect x="38" y="115" width="8" height="30" fill="#546e7a"/>
    <rect x="54" y="115" width="8" height="30" fill="#546e7a"/>
  </g>
  <g id="head-top">
    <rect x="8" y="45" width="12" height="25" rx="2" fill="#546e7a"/>
    <rect x="80" y="45" width="12" height="25" rx="2" fill="#546e7a"/>
    <rect x="25" y="25" width="50" height="50" rx="8" fill="#90a4ae"/>
    <rect x="45" y="15" width="10" height="15" fill="#546e7a"/>
    <circle cx="50" cy="12" r="5" fill="#f44336"/>
    <circle cx="38" cy="48" rx="8" ry="8" fill="#263238"/>
    <circle cx="62" cy="48" rx="8" ry="8" fill="#263238"/>
    <circle class="pupil pupil-left" cx="38" cy="48" r="4" fill="#03a9f4"/>
    <circle class="pupil pupil-right" cx="62" cy="48" r="4" fill="#03a9f4"/>
  </g>
  <g id="head-bottom">
    <rect x="38" y="58" width="24" height="8" rx="2" fill="#263238" id="mouth-closed"/>
    <rect x="38" y="58" width="24" height="12" rx="2" fill="#263238" opacity="0" id="mouth-open">
      <animate attributeName="opacity" values="0;1;0" dur="0.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="60" width="4" height="4" fill="#4caf50" opacity="0" class="mouth-light"/>
    <rect x="48" y="60" width="4" height="4" fill="#4caf50" opacity="0" class="mouth-light"/>
    <rect x="56" y="60" width="4" height="4" fill="#4caf50" opacity="0" class="mouth-light"/>
  </g>
</svg>
