<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" style="cursor: default;">
  <g id="body">
    <!-- White shirt -->
    <rect x="32" y="72" width="36" height="78" fill="#ffffff" style="cursor: pointer;"></rect>
    <!-- Black vest -->
    <path d="M32 72 L40 72 L40 130 L32 130 Z" fill="#1a1a1a" style="cursor: pointer;"></path>
    <path d="M60 72 L68 72 L68 130 L60 130 Z" fill="#1a1a1a" style="cursor: pointer;"></path>
    <path d="M40 72 L50 85 L60 72" fill="#1a1a1a" style="cursor: pointer;"></path>
    <!-- Vest buttons -->
    <circle cx="50" cy="98" r="2" fill="#d4af37" style="cursor: pointer;"></circle>
    <circle cx="50" cy="113" r="2" fill="#d4af37" style="cursor: pointer;"></circle>
    <!-- Bow tie -->
    <rect x="46" y="68" width="8" height="6" fill="#1a1a1a" style="cursor: pointer;"></rect>
    <polygon points="42,71 46,68 46,74" fill="#1a1a1a" style="cursor: pointer;"></polygon>
    <polygon points="58,71 54,68 54,74" fill="#1a1a1a" style="cursor: pointer;"></polygon>
    <!-- Arms -->
    <rect x="22" y="75" width="10" height="35" fill="#ffffff" style="cursor: pointer;"></rect>
    <rect x="68" y="75" width="10" height="35" fill="#ffffff" style="cursor: pointer;"></rect>
    <ellipse cx="27" cy="113" rx="6" ry="5" fill="#ffcc80" style="cursor: pointer;"></ellipse>
    <ellipse cx="73" cy="113" rx="6" ry="5" fill="#ffcc80" style="cursor: pointer;"></ellipse>
  </g>
  <g id="head-top">
    <!-- Hair - slicked back -->
    <ellipse cx="49.9" cy="33.0" rx="20" ry="14" fill="#2d2d2d" style="cursor: pointer;" class=""></ellipse>
    <!-- Face -->
    <ellipse cx="49.9" cy="47.0" rx="18" ry="22" fill="#ffcc80" style="cursor: pointer;" class=""></ellipse>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="42.9" cy="45.0" rx="4" ry="5" fill="#ffffff" style="cursor: pointer;" class=""></ellipse>
    <ellipse id="eye-right-white" cx="56.9" cy="45.0" rx="4" ry="5" fill="#ffffff" style="cursor: pointer;" class=""></ellipse>
    <circle id="eye-left-pupil" class="pupil" cx="42.9" cy="45.0" r="2" fill="#2d2d2d" style="cursor: pointer;"></circle>
    <circle id="eye-right-pupil" class="pupil" cx="56.9" cy="45.0" r="2" fill="#2d2d2d" style="cursor: pointer;"></circle>
    <!-- Eyebrows -->
    <path id="brow-left" d="M37 34 Q43 31 49 34" stroke="#2d2d2d" stroke-width="1.5" fill="none" style="cursor: pointer;" class="" transform="translate(-0.1, 3.0)"></path>
    <path id="brow-right" d="M51 34 Q57 31 63 34" stroke="#2d2d2d" stroke-width="1.5" fill="none" style="cursor: pointer;" class="" transform="translate(-0.1, 3.0)"></path>
    <!-- Nose -->
    <ellipse cx="49.9" cy="51.0" rx="2" ry="2.5" fill="#ffb74d" style="cursor: pointer;" class=""></ellipse>
  </g>
  <g id="head-bottom">
    <!-- Mouth closed - confident smirk -->
    <path id="mouth-closed" d="M44 56 Q50 60 56 56" stroke="#5d4037" stroke-width="2" fill="none" style="cursor: pointer;" class="" transform="translate(-0.1, 0.6)" opacity="1"></path>
    <!-- Mouth open -->
    <ellipse id="mouth-open" cx="49.9" cy="59.0" rx="4" ry="3" fill="#5d4037" opacity="0" style="cursor: pointer;" class=""></ellipse>
  </g>
</svg>