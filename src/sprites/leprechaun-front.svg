<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Green coat -->
    <rect x="35" y="70" width="30" height="50" rx="3" fill="#2e7d32"/>
    <!-- Coat tails -->
    <rect x="35" y="110" width="12" height="20" rx="2" fill="#2e7d32"/>
    <rect x="53" y="110" width="12" height="20" rx="2" fill="#2e7d32"/>
    <!-- Gold buttons -->
    <circle cx="50" cy="80" r="2" fill="#ffd700"/>
    <circle cx="50" cy="90" r="2" fill="#ffd700"/>
    <circle cx="50" cy="100" r="2" fill="#ffd700"/>
    <!-- White shirt peek -->
    <rect x="45" y="68" width="10" height="8" fill="#ffffff"/>
    <!-- Arms -->
    <rect x="25" y="72" width="10" height="30" rx="3" fill="#2e7d32"/>
    <rect x="65" y="72" width="10" height="30" rx="3" fill="#2e7d32"/>
    <!-- Hands -->
    <ellipse cx="30" cy="105" rx="5" ry="4" fill="#ffcc80"/>
    <ellipse cx="70" cy="105" rx="5" ry="4" fill="#ffcc80"/>
    <!-- Legs -->
    <rect x="38" y="120" width="8" height="20" fill="#1a1a1a"/>
    <rect x="54" y="120" width="8" height="20" fill="#1a1a1a"/>
    <!-- Shoes with buckles -->
    <ellipse cx="42" cy="142" rx="8" ry="4" fill="#1a1a1a"/>
    <ellipse cx="58" cy="142" rx="8" ry="4" fill="#1a1a1a"/>
    <rect x="39" y="139" width="6" height="4" fill="#ffd700"/>
    <rect x="55" y="139" width="6" height="4" fill="#ffd700"/>
  </g>
  <g id="head-top">
    <!-- Big green hat -->
    <ellipse cx="50" cy="35" rx="28" ry="8" fill="#1b5e20"/>
    <rect x="32" y="10" width="36" height="25" rx="3" fill="#2e7d32"/>
    <!-- Hat band with buckle -->
    <rect x="32" y="28" width="36" height="6" fill="#1a1a1a"/>
    <rect x="45" y="27" width="10" height="8" fill="#ffd700"/>
    <!-- Orange hair/sideburns -->
    <ellipse cx="30" cy="50" rx="6" ry="12" fill="#ff6f00"/>
    <ellipse cx="70" cy="50" rx="6" ry="12" fill="#ff6f00"/>
    <!-- Face -->
    <ellipse cx="50" cy="48" rx="18" ry="18" fill="#ffcc80"/>
    <!-- Rosy cheeks -->
    <ellipse cx="36" cy="52" rx="4" ry="3" fill="#ff8a80" opacity="0.6"/>
    <ellipse cx="64" cy="52" rx="4" ry="3" fill="#ff8a80" opacity="0.6"/>
    <!-- Bushy orange eyebrows -->
    <path id="brow-left" d="M35 40 Q42 36 48 40" stroke="#ff6f00" stroke-width="3" fill="none"/>
    <path id="brow-right" d="M52 40 Q58 36 65 40" stroke="#ff6f00" stroke-width="3" fill="none"/>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="42" cy="46" rx="5" ry="4" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="58" cy="46" rx="5" ry="4" fill="#ffffff"/>
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="46" r="2" fill="#2e7d32"/>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="46" r="2" fill="#2e7d32"/>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="41" cy="45" r="1" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="57" cy="45" r="1" fill="#fff" opacity="0"/>
    <!-- Big nose -->
    <ellipse cx="50" cy="54" rx="4" ry="5" fill="#ffb74d"/>
  </g>
  <g id="head-bottom">
    <!-- Orange beard -->
    <path d="M35 58 Q50 75 65 58" fill="#ff6f00"/>
    <path d="M38 62 Q50 78 62 62" fill="#e65100"/>
    <!-- Mouth closed (hidden in beard) -->
    <path id="mouth-closed" d="M45 60 Q50 63 55 60" stroke="#8d6e63" stroke-width="1.5" fill="none"/>
    <!-- Mouth open -->
    <ellipse id="mouth-open" cx="50" cy="61" rx="4" ry="3" fill="#5d4037" opacity="0"/>
  </g>
</svg>
