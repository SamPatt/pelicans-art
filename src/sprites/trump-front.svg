<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Suit -->
    <rect x="30" y="75" width="40" height="75" rx="3" fill="#1a237e"/>
    <!-- Red tie -->
    <polygon points="50,75 46,85 50,150 54,85" fill="#c62828"/>
    <!-- White collar -->
    <polygon points="42,75 50,82 58,75" fill="#ffffff"/>
    <!-- Shoulders -->
    <rect x="20" y="75" width="15" height="20" rx="3" fill="#1a237e"/>
    <rect x="65" y="75" width="15" height="20" rx="3" fill="#1a237e"/>
  </g>
  <g id="head-top">
    <!-- Hair back layer -->
    <ellipse cx="50" cy="28" rx="26" ry="18" fill="#ffb300"/>
    <!-- Face -->
    <ellipse cx="50" cy="45" rx="22" ry="28" fill="#ffcc80"/>
    <!-- Eyes - white part -->
    <ellipse id="eye-left-white" cx="42" cy="42" rx="4" ry="3" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="58" cy="42" rx="4" ry="3" fill="#ffffff"/>
    <!-- Pupils -->
    <circle class="pupil pupil-left" id="eye-left-pupil" cx="42" cy="42" r="1.5" fill="#4a6fa5"/>
    <circle class="pupil pupil-right" id="eye-right-pupil" cx="58" cy="42" r="1.5" fill="#4a6fa5"/>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="41" cy="41" r="0.8" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="57" cy="41" r="0.8" fill="#fff" opacity="0"/>
    <!-- Eyebrows - thick and expressive -->
    <path id="brow-left-border" d="M36 38 Q42 35 48 38" stroke="#ffcc80" stroke-width="3" fill="none"/>
    <path id="brow-left" d="M36 36 Q42 33 48 36" stroke="#b38600" stroke-width="2.5" fill="none"/>
    <path id="brow-right-border" d="M52 38 Q58 35 64 38" stroke="#ffcc80" stroke-width="3" fill="none"/>
    <path id="brow-right" d="M52 36 Q58 33 64 36" stroke="#b38600" stroke-width="2.5" fill="none"/>
    <!-- Nose -->
    <ellipse cx="50" cy="48" rx="3" ry="4" fill="#ffb74d"/>
    <!-- Hair swoop on top -->
    <path d="M28 32 Q40 15 55 18 Q72 22 76 38 Q65 28 50 26 Q35 24 28 32" fill="#ffb300"/>
  </g>
  <g id="head-bottom">
    <!-- Chin area -->
    <ellipse cx="50" cy="62" rx="18" ry="12" fill="#ffcc80"/>
    <!-- Mouth closed - positioned to match emotion system -->
    <path id="mouth-closed" d="M46 52 Q50 55 54 52" stroke="#d4a59a" stroke-width="1.5" fill="none"/>
    <!-- Mouth open for speaking -->
    <ellipse id="mouth-open" cx="50" cy="53" rx="5" ry="3" fill="#5d4037" opacity="0"/>
  </g>
</svg>
