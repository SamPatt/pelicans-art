<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <rect x="32" y="78" width="36" height="72" fill="#2196f3"/>
    <polygon points="50,78 46,90 50,150 54,90" fill="#1976d2"/>
  </g>
  <g id="head-top">
    <!-- Hair -->
    <ellipse cx="50" cy="32" rx="22" ry="16" fill="#5d4037"/>
    <!-- Face -->
    <ellipse cx="50" cy="50" rx="20" ry="24" fill="#ffcc80"/>
    <!-- Eyes -->
    <ellipse cx="43" cy="46" rx="4" ry="3" fill="#ffffff"/>
    <ellipse cx="57" cy="46" rx="4" ry="3" fill="#ffffff"/>
    <circle class="pupil pupil-left" cx="43" cy="46" r="1.5" fill="#000000"/>
    <circle class="pupil pupil-right" cx="57" cy="46" r="1.5" fill="#000000"/>
    <!-- Eyebrows -->
    <path d="M38 42 Q43 40 48 43" stroke="#5d4037" stroke-width="2" fill="none"/>
    <path d="M52 43 Q57 40 62 42" stroke="#5d4037" stroke-width="2" fill="none"/>
    <!-- Nose -->
    <ellipse cx="50" cy="53" rx="2.5" ry="3" fill="#ffb74d"/>
  </g>
  <g id="head-bottom">
    <ellipse cx="50" cy="70" rx="17" ry="9" fill="#ffcc80"/>
    <path d="M44 67 Q50 70 56 67" stroke="#8d6e63" stroke-width="1.5" fill="none" id="mouth-closed"/>
    <ellipse cx="50" cy="68" rx="5" ry="2" fill="#5d4037" opacity="0" id="mouth-open"/>
  </g>
</svg>
