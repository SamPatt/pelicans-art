<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Body -->
    <ellipse cx="50" cy="110" rx="28" ry="35" fill="#f5f5f5"/>
    <!-- Belly -->
    <ellipse cx="50" cy="115" rx="20" ry="28" fill="#ffffff"/>
    <!-- Wings (folded) -->
    <ellipse cx="25" cy="105" rx="10" ry="25" fill="#e0e0e0"/>
    <ellipse cx="75" cy="105" rx="10" ry="25" fill="#e0e0e0"/>
    <!-- Wing tips (darker) -->
    <ellipse cx="22" cy="125" rx="6" ry="10" fill="#424242"/>
    <ellipse cx="78" cy="125" rx="6" ry="10" fill="#424242"/>
    <!-- Feet -->
    <ellipse cx="40" cy="145" rx="8" ry="4" fill="#ffb300"/>
    <ellipse cx="60" cy="145" rx="8" ry="4" fill="#ffb300"/>
  </g>
  <g id="head-top">
    <!-- Neck -->
    <ellipse cx="50" cy="75" rx="12" ry="18" fill="#f5f5f5"/>
    <!-- Head -->
    <ellipse cx="50" cy="45" rx="18" ry="16" fill="#f5f5f5"/>
    <!-- Head crest/tuft -->
    <path d="M45 30 Q50 22 55 30" stroke="#e0e0e0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="42" cy="42" rx="5" ry="6" fill="#ffffff"/>
    <ellipse id="eye-right-white" cx="58" cy="42" rx="5" ry="6" fill="#ffffff"/>
    <ellipse id="eye-left-pupil" class="pupil" cx="42" cy="42" rx="2" ry="3" fill="#000000"/>
    <ellipse id="eye-right-pupil" class="pupil" cx="58" cy="42" rx="2" ry="3" fill="#000000"/>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="40" cy="40" r="1.5" fill="#fff" opacity="0"/>
    <circle id="eye-right-highlight" cx="56" cy="40" r="1.5" fill="#fff" opacity="0"/>
    <!-- Eyebrows -->
    <path id="brow-left" d="M34 36 Q42 34 48 36" stroke="#9e9e9e" stroke-width="2" fill="none" opacity="0.7"/>
    <path id="brow-right" d="M52 36 Q58 34 66 36" stroke="#9e9e9e" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  <g id="head-bottom">
    <!-- Upper bill -->
    <path d="M32 48 Q50 44 68 48 L65 55 Q50 52 35 55 Z" fill="#ffb300"/>
    <!-- Bill ridge -->
    <path d="M50 44 L50 55" stroke="#ff8f00" stroke-width="1" opacity="0.5"/>
    <!-- Lower bill with pouch -->
    <path d="M35 55 Q30 70 50 78 Q70 70 65 55" fill="#ffcc80"/>
    <!-- Pouch texture lines -->
    <path d="M38 60 Q50 72 62 60" stroke="#ffb300" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M40 65 Q50 75 60 65" stroke="#ffb300" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- Bill tip/hook -->
    <ellipse cx="50" cy="78" rx="4" ry="2" fill="#ff8f00"/>
    <!-- Mouth closed (line on pouch) -->
    <path id="mouth-closed" d="M38 56 Q50 54 62 56" stroke="#e65100" stroke-width="1.5" fill="none"/>
    <!-- Mouth open (expanded pouch) -->
    <ellipse id="mouth-open" cx="50" cy="68" rx="10" ry="8" fill="#f44336" opacity="0"/>
  </g>
</svg>
