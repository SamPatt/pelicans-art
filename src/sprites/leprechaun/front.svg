<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" style="cursor: default;">
  <g id="body">
    <!-- Green coat - moved up to connect with head -->
    <rect x="35" y="62" width="30" height="50" rx="3" fill="#2e7d32" style="cursor: pointer;"></rect>
    <!-- Coat tails -->
    <rect x="35" y="102" width="12" height="20" rx="2" fill="#2e7d32" style="cursor: pointer;"></rect>
    <rect x="53" y="102" width="12" height="20" rx="2" fill="#2e7d32" style="cursor: pointer;"></rect>
    <!-- Gold buttons -->
    <circle cx="50" cy="72" r="2" fill="#ffd700" style="cursor: pointer;"></circle>
    <circle cx="50" cy="82" r="2" fill="#ffd700" style="cursor: pointer;"></circle>
    <circle cx="50" cy="92" r="2" fill="#ffd700" style="cursor: pointer;"></circle>
    <!-- White shirt peek -->
    <rect x="45" y="60" width="10" height="8" fill="#ffffff" style="cursor: pointer;"></rect>
    <!-- Arms -->
    <rect x="25" y="64" width="10" height="30" rx="3" fill="#2e7d32" style="cursor: pointer;"></rect>
    <rect x="65" y="64" width="10" height="30" rx="3" fill="#2e7d32" style="cursor: pointer;"></rect>
    <!-- Hands -->
    <ellipse cx="30" cy="97" rx="5" ry="4" fill="#ffcc80" style="cursor: pointer;"></ellipse>
    <ellipse cx="70" cy="97" rx="5" ry="4" fill="#ffcc80" style="cursor: pointer;"></ellipse>
    <!-- Legs -->
    <rect x="38" y="112" width="8" height="20" fill="#1a1a1a" style="cursor: pointer;"></rect>
    <rect x="54" y="112" width="8" height="20" fill="#1a1a1a" style="cursor: pointer;"></rect>
    <!-- Shoes with buckles -->
    <ellipse cx="42" cy="134" rx="8" ry="4" fill="#1a1a1a" style="cursor: pointer;"></ellipse>
    <ellipse cx="58" cy="134" rx="8" ry="4" fill="#1a1a1a" style="cursor: pointer;"></ellipse>
    <rect x="39" y="131" width="6" height="4" fill="#ffd700" style="cursor: pointer;"></rect>
    <rect x="55" y="131" width="6" height="4" fill="#ffd700" style="cursor: pointer;"></rect>
  </g>
  <g id="head-top"><ellipse cx="50" cy="42" rx="18" ry="16" fill="#ffcc80" style="cursor: pointer;" class=""></ellipse>
    <!-- Big green hat -->
    <ellipse cx="50.0" cy="25.0" rx="28" ry="8" fill="#1b5e20" style="cursor: pointer;" class=""></ellipse>
    <rect x="32.0" y="2.4" width="36" height="23" rx="3" fill="#2e7d32" style="cursor: pointer;" class=""></rect>
    <!-- Hat band with buckle -->
    <rect x="32.2" y="20.7" width="36" height="5" fill="#1a1a1a" style="cursor: pointer;" class=""></rect>
    <rect x="45.4" y="19.5" width="10" height="7" fill="#ffd700" style="cursor: pointer;" class=""></rect>
    <!-- Orange hair/sideburns -->
    
    
    <!-- Face -->
    
    <!-- Rosy cheeks -->
    <ellipse cx="36" cy="46" rx="4" ry="3" fill="#ff8a80" opacity="0.6" style="cursor: pointer;"></ellipse>
    <ellipse cx="64" cy="46" rx="4" ry="3" fill="#ff8a80" opacity="0.6" style="cursor: pointer;"></ellipse>
    <!-- Bushy orange eyebrows -->
    <path id="brow-left" d="M37 36 Q42 34 47 36" stroke="#ff6f00" stroke-width="3" fill="none" style="cursor: pointer;"></path>
    <path id="brow-right" d="M53 36 Q58 34 63 36" stroke="#ff6f00" stroke-width="3" fill="none" style="cursor: pointer;"></path>
    <!-- Eyes -->
    <ellipse id="eye-left-white" cx="42" cy="42" rx="4" ry="3" fill="#ffffff" style="cursor: pointer;"></ellipse>
    <ellipse id="eye-right-white" cx="58" cy="42" rx="4" ry="3" fill="#ffffff" style="cursor: pointer;"></ellipse>
    <circle id="eye-left-pupil" class="pupil" cx="42" cy="42" r="2" fill="#2e7d32" style="cursor: pointer;"></circle>
    <circle id="eye-right-pupil" class="pupil" cx="58" cy="42" r="2" fill="#2e7d32" style="cursor: pointer;"></circle>
    <!-- Eye highlights -->
    <circle id="eye-left-highlight" cx="41" cy="41" r="1" fill="#fff" opacity="0" style="cursor: pointer;"></circle>
    <circle id="eye-right-highlight" cx="57" cy="41" r="1" fill="#fff" opacity="0" style="cursor: pointer;"></circle>
    <!-- Big nose -->
    <ellipse cx="50" cy="48" rx="4" ry="4" fill="#ffb74d" style="cursor: pointer;"></ellipse>
  <ellipse cx="70" cy="42" rx="6" ry="10" fill="#ff6f00" style="cursor: pointer;" class=""></ellipse><ellipse cx="30" cy="42" rx="6" ry="10" fill="#ff6f00" style="cursor: pointer;" class=""></ellipse></g>
  <g id="head-bottom">
    <!-- Orange beard -->
    <path d="M35 52 Q50 68 65 52" fill="#ff6f00" style="cursor: pointer;"></path>
    <path d="M38 55 Q50 70 62 55" fill="#e65100" style="cursor: pointer;"></path>
    <!-- Mouth -->
    <path id="mouth-closed" d="M46 52 Q50 55 54 52" stroke="#8d6e63" stroke-width="1.5" fill="none" style="cursor: pointer;"></path>
    <ellipse id="mouth-open" cx="50" cy="53" rx="4" ry="3" fill="#5d4037" opacity="0" style="cursor: pointer;"></ellipse>
  </g>
</svg>