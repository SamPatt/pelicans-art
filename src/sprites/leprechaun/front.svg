<svg data-meta='{"name":"Leprechaun","type":"human","description":"A mischievous Irish leprechaun","tags":["fantasy","irish","mythology","magical"],"voice":{"id":"marius","pitch":0.3,"speed":1,"volume":1.3},"defaultVariant":"front","colors":{"skin":"#ffe4c4","hair":"#ff4500","primary":"#228b22","secondary":"#ffd700","accent":"#000000"},"animation":{"blinkInterval":3,"blinkDuration":130,"idleMovement":true,"eyeTracking":true}}' xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" style="cursor: default;">
