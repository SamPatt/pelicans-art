<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <g id="body">
    <!-- Body/dress back -->
    <ellipse cx="50" cy="115" rx="18" ry="30" fill="#7dd3dc"/>
    <!-- Arms down -->
    <ellipse cx="32" cy="100" rx="5" ry="12" fill="#fce4d4"/>
    <ellipse cx="68" cy="100" rx="5" ry="12" fill="#fce4d4"/>
    <!-- Legs hint -->
    <ellipse cx="43" cy="142" rx="6" ry="10" fill="#fce4d4"/>
    <ellipse cx="57" cy="142" rx="6" ry="10" fill="#fce4d4"/>
  </g>
  <g id="head-top">
    <!-- Hair back (full coverage) -->
    <ellipse cx="50" cy="45" rx="24" ry="26" fill="#2d2d2d"/>
    <!-- Hair flowing down back -->
    <path d="M26 45 Q22 70 30 100" stroke="#2d2d2d" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M74 45 Q78 70 70 100" stroke="#2d2d2d" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Hair detail lines -->
    <path d="M40 50 Q45 70 42 90" stroke="#1a1a1a" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M60 50 Q55 70 58 90" stroke="#1a1a1a" stroke-width="1" fill="none" opacity="0.3"/>
  </g>
  <g id="head-bottom">
    <!-- Hidden mouth for compatibility -->
    <path id="mouth-closed" d="M46 58 Q50 61 54 58" stroke="#2d2d2d" stroke-width="1.5" fill="none" opacity="0"/>
    <ellipse id="mouth-open" cx="50" cy="59" rx="4" ry="3" fill="#2d2d2d" opacity="0"/>
  </g>
</svg>
