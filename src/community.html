<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src * data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src *; media-src * blob: data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>The Pouch &#8212; pelicans.art</title>
  <link rel="stylesheet" href="pelicans-theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--plumage-white);
      color: var(--wing-gray);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
    }

    /* Page header */
    .page-header {
      margin-bottom: var(--space-6);
    }

    .page-header h2 {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      color: var(--wing-dark);
      font-weight: 600;
    }

    .page-header p {
      color: var(--wing-gray);
      margin-top: var(--space-1);
    }

    /* Category tabs */
    .category-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
      flex-wrap: wrap;
    }

    .category-tab {
      padding: 6px 18px;
      background: var(--plumage-cream);
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      color: var(--wing-gray);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      transition: all var(--duration-fast) var(--ease-standard);
    }

    .category-tab:hover {
      background: var(--sand-warm);
      color: var(--wing-dark);
    }

    .category-tab.active {
      background: var(--pouch-orange);
      color: #fff;
    }

    /* Asset grid */
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--space-5);
      margin-bottom: var(--space-6);
    }

    .asset-card {
      background: var(--plumage-cream);
      border: 1px solid var(--sand-warm);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: all 200ms var(--ease-bounce);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .asset-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 20px rgba(245,166,35,0.12);
      border-color: var(--sand-warm);
    }

    .asset-card.selected {
      border-color: var(--pouch-orange);
      box-shadow: 0 0 0 2px var(--pouch-orange), var(--shadow-glow);
    }

    .asset-card-preview {
      width: 100%;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--ocean-foam);
    }

    .asset-card-preview svg,
    .asset-card-preview img {
      max-width: 100%;
      max-height: 100%;
      transition: transform 300ms var(--ease-bounce);
    }

    .asset-card:hover .asset-card-preview svg,
    .asset-card:hover .asset-card-preview img {
      transform: translateY(-4px);
    }

    .asset-card-icon {
      font-size: 2.5em;
      color: var(--sand-warm);
    }

    .asset-card-name {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 500;
      color: var(--wing-dark);
      padding: var(--space-3) var(--space-3) 0;
      text-align: center;
      word-break: break-word;
    }

    .asset-card-meta {
      font-size: var(--text-xs);
      color: var(--ocean-blue);
      padding: 2px var(--space-3) var(--space-3);
      text-align: center;
    }

    .asset-card-category {
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      margin: 0 auto var(--space-2);
      display: inline-block;
    }

    /* Category-specific tag colors */
    .asset-card-category[data-cat="characters"] { background: #E8F4F9; color: #1B6B96; }
    .asset-card-category[data-cat="props"] { background: #FFF3E0; color: #E8871E; }
    .asset-card-category[data-cat="backgrounds"] { background: #EDE6D6; color: #8B7355; }
    .asset-card-category[data-cat="skits"],
    .asset-card-category[data-cat="scripts"] { background: #FCE4EC; color: #C62828; }
    .asset-card-category[data-cat="published"],
    .asset-card-category[data-cat="Skits"] { background: #FCE4EC; color: #C62828; }
    .asset-card-category[data-cat="voices"] { background: #F3E5F5; color: #7B1FA2; }

    .card-play-overlay {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--pouch-orange), var(--pouch-deep));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--duration-fast);
      box-shadow: 0 2px 8px rgba(245,166,35,0.3);
      z-index: 2;
    }

    .card-play-overlay:hover {
      box-shadow: 0 4px 12px rgba(245,166,35,0.5);
      transform: scale(1.1);
    }

    .card-play-overlay::after {
      content: '';
      display: block;
      width: 0; height: 0;
      border-style: solid;
      border-width: 6px 0 6px 10px;
      border-color: transparent transparent transparent #fff;
      margin-left: 2px;
    }

    /* Detail panel */
    .detail-panel {
      display: none;
      background: var(--plumage-cream);
      border: 1px solid var(--sand-warm);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      margin-bottom: var(--space-6);
      box-shadow: var(--shadow-md);
    }

    .detail-panel.visible { display: block; }

    .detail-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
    }

    .detail-header h2 {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      color: var(--wing-dark);
      flex: 1;
    }

    .detail-close {
      background: none;
      border: 1px solid var(--sand-warm);
      border-radius: var(--radius-sm);
      color: var(--wing-gray);
      padding: 6px 14px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      transition: all var(--duration-fast);
    }

    .detail-close:hover {
      border-color: var(--mouth-red);
      color: var(--mouth-red);
    }

    .detail-header-play {
      background: linear-gradient(135deg, var(--pouch-orange), var(--pouch-deep));
      color: #fff;
      border: none;
      border-radius: var(--radius-full);
      padding: 6px 16px;
      cursor: pointer;
      font-size: var(--text-sm);
      font-family: var(--font-body);
      font-weight: 600;
      transition: all var(--duration-fast);
      box-shadow: 0 2px 8px rgba(245,166,35,0.3);
    }

    .detail-header-play:hover {
      filter: brightness(1.08);
      box-shadow: 0 4px 12px rgba(245,166,35,0.4);
    }

    .detail-preview {
      background: var(--ocean-foam);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      max-height: 400px;
      overflow: auto;
    }

    .detail-preview svg { max-width: 100%; max-height: 360px; }
    .detail-preview img { max-width: 100%; max-height: 360px; }

    .detail-info {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      font-size: var(--text-sm);
      margin-bottom: var(--space-5);
    }

    .detail-label { color: var(--sand-warm); font-weight: 600; }
    .detail-value { color: var(--wing-dark); }

    .detail-actions {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .detail-btn {
      padding: 8px 18px;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      transition: all var(--duration-fast);
    }

    .btn-download {
      background: linear-gradient(135deg, var(--ocean-blue), var(--ocean-deep));
      color: #fff;
      box-shadow: 0 2px 6px rgba(45,142,196,0.2);
    }
    .btn-download:hover { filter: brightness(1.1); }

    .btn-copy-link {
      background: var(--plumage-cream);
      color: var(--wing-dark);
      border: 1px solid var(--sand-warm);
    }
    .btn-copy-link:hover { background: var(--sand-pale); }

    .btn-play {
      background: linear-gradient(135deg, var(--pouch-orange), var(--pouch-deep));
      color: #fff;
    }
    .btn-play:hover { filter: brightness(1.1); }

    /* Variant tabs */
    .variant-tabs {
      display: flex;
      gap: var(--space-1);
      margin-bottom: var(--space-3);
    }

    .variant-tab {
      padding: 5px 14px;
      background: var(--plumage-cream);
      border: 1px solid var(--sand-warm);
      border-radius: var(--radius-full);
      color: var(--wing-gray);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      transition: all var(--duration-fast);
    }

    .variant-tab:hover { border-color: var(--ocean-blue); color: var(--wing-dark); }

    .variant-tab.active {
      background: var(--ocean-blue);
      border-color: var(--ocean-blue);
      color: #fff;
    }

    .variant-tab.unavailable {
      color: var(--sand-warm);
      cursor: default;
      background: var(--plumage-white);
    }

    /* Skit detail */
    .skit-summary {
      background: var(--ocean-foam);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      font-size: var(--text-sm);
      line-height: 1.6;
      color: var(--wing-dark);
    }

    .skit-summary strong { color: var(--ocean-deep); }

    /* Script list */
    .script-list {
      background: var(--plumage-cream);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      margin-bottom: var(--space-4);
      max-height: 400px;
      overflow-y: auto;
    }

    .script-list h4 {
      margin: 0 0 var(--space-2) 0;
      font-family: var(--font-display);
      color: var(--wing-dark);
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .script-line {
      background: var(--plumage-white);
      border-left: 3px solid var(--sand-warm);
      padding: 6px 10px;
      margin-bottom: 4px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: var(--text-sm);
      line-height: 1.4;
      color: var(--wing-dark);
    }

    .script-line.say { border-left-color: var(--ocean-blue); }
    .script-line.emote { border-left-color: var(--pouch-orange); }
    .script-line.shot { border-left-color: var(--mouth-red); }
    .script-line.stage { border-left-color: var(--ocean-deep); }
    .script-line.prop { border-left-color: var(--bill-yellow); }

    .script-line strong { color: var(--ocean-blue); }
    .script-line.emote strong { color: var(--pouch-deep); }
    .script-line.shot strong { color: var(--mouth-red); }

    .script-line .offset-badge {
      background: var(--ocean-blue);
      color: #fff;
      padding: 1px 5px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      margin-left: 6px;
    }

    /* Loading & empty */
    .loading, .empty-state {
      text-align: center;
      padding: var(--space-12);
      color: var(--sand-warm);
      font-family: var(--font-display);
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--plumage-cream);
      border-top-color: var(--pouch-orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .load-more {
      display: block;
      margin: 0 auto var(--space-6);
    }

    /* Published player embed */
    .published-player {
      position: relative;
      width: 100%;
      background: var(--player-bg);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: var(--space-4);
    }

    .published-player canvas { width: 100%; display: block; }

    .player-controls {
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: var(--player-surface);
      align-items: center;
    }

    .player-controls button {
      background: var(--player-border);
      border: none;
      color: var(--player-text);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
    }

    .player-controls button:hover { background: var(--ocean-deep); }

    .player-timeline {
      flex: 1;
      height: 4px;
      background: var(--player-border);
      border-radius: 2px;
      cursor: pointer;
    }

    .player-timeline-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--pouch-orange), var(--pouch-deep));
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s;
    }

    /* Voice player */
    .voice-player { margin-bottom: var(--space-4); }
    .voice-player audio { width: 100%; }

    @media (max-width: 768px) {
      .nav-studio-link {
        display: none;
      }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container { padding: var(--space-4); }
      .asset-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-3); }
    }
  </style>
</head>
<body>

<nav class="pelicans-nav">
  <a href="./" class="pelicans-nav-logo">pelicans<span>.art</span></a>
  <ul class="pelicans-nav-links">
    <li class="nav-studio-link"><a href="sprite-editor.html">Studio</a></li>
    <li><a href="./">Watch</a></li>
    <li><a href="community.html" class="active">The <span style="color:var(--pouch-orange)">Pouch</span></a></li>
    <li><button class="theme-toggle" id="themeToggle"><span class="theme-toggle-icon" id="themeIcon">&#127754;</span> <span id="themeLabel">Ocean</span></button></li>
  </ul>
</nav>

<div class="container">
  <div class="page-header">
    <h2>The <span style="color:var(--pouch-orange)">Pouch</span></h2>
    <p>Browse characters, backgrounds, and props shared by the flock.</p>
  </div>

  <div class="category-tabs" id="category-tabs">
    <button class="category-tab active" data-type="all">All</button>
    <button class="category-tab" data-type="characters">Characters</button>
    <button class="category-tab" data-type="props">Props</button>
    <button class="category-tab" data-type="backgrounds">Backgrounds</button>
    <button class="category-tab" data-type="skits">Scripts</button>
    <button class="category-tab" data-type="published">Skits</button>
    <button class="category-tab" data-type="voices">Voices</button>
  </div>

  <div class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <h2 id="detail-title">Asset</h2>
      <button class="detail-close" id="detail-close-btn">Close</button>
    </div>
    <div id="detail-content"></div>
  </div>

  <div id="asset-list">
    <div class="loading" id="loading-indicator">Loading</div>
    <div class="asset-grid" id="asset-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">Nothing in the pouch yet!</div>
    <button class="btn btn-ocean load-more" id="load-more-btn" style="display:none;">Load More</button>
  </div>
</div>

<!-- FOOTER -->
<footer class="pelicans-footer">
  <svg class="pelicans-footer-wave" viewBox="0 0 1200 30" preserveAspectRatio="none">
    <path d="M0 15 Q150 0 300 15 T600 15 T900 15 T1200 15 L1200 30 L0 30Z" fill="var(--water-dark)"/>
  </svg>
  <div class="pelicans-footer-logo">pelicans<span>.art</span></div>
  <div class="pelicans-footer-tagline">Stuff it in the pouch.</div>
</footer>

<script src="vendor/dompurify/purify.min.js"></script>
<script src="js/svg-sanitizer.js"></script>
<script src="js/share-catalog.js"></script>
<script src="js/community.js"></script>

</body>
</html>
