<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community — pelicans.art</title>
  <link rel="stylesheet" href="pelicans-theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--plumage-white);
      color: var(--wing-gray);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
    }

    /* Page header */
    .page-header {
      margin-bottom: var(--space-6);
    }

    .page-header h2 {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      color: var(--wing-dark);
      font-weight: 600;
    }

    .page-header p {
      color: var(--wing-gray);
      margin-top: var(--space-1);
    }

    /* Category tabs */
    .category-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
      flex-wrap: wrap;
    }

    .category-tab {
      padding: 6px 18px;
      background: var(--plumage-cream);
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      color: var(--wing-gray);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      transition: all var(--duration-fast) var(--ease-standard);
    }

    .category-tab:hover {
      background: var(--sand-warm);
      color: var(--wing-dark);
    }

    .category-tab.active {
      background: var(--pouch-orange);
      color: #fff;
    }

    /* Asset grid */
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--space-5);
      margin-bottom: var(--space-6);
    }

    .asset-card {
      background: var(--plumage-cream);
      border: 1px solid var(--sand-warm);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: all 200ms var(--ease-bounce);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .asset-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 20px rgba(245,166,35,0.12);
      border-color: var(--sand-warm);
    }

    .asset-card.selected {
      border-color: var(--pouch-orange);
      box-shadow: 0 0 0 2px var(--pouch-orange), var(--shadow-glow);
    }

    .asset-card-preview {
      width: 100%;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--ocean-foam);
    }

    .asset-card-preview svg,
    .asset-card-preview img {
      max-width: 100%;
      max-height: 100%;
      transition: transform 300ms var(--ease-bounce);
    }

    .asset-card:hover .asset-card-preview svg,
    .asset-card:hover .asset-card-preview img {
      transform: translateY(-4px);
    }

    .asset-card-icon {
      font-size: 2.5em;
      color: var(--sand-warm);
    }

    .asset-card-name {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 500;
      color: var(--wing-dark);
      padding: var(--space-3) var(--space-3) 0;
      text-align: center;
      word-break: break-word;
    }

    .asset-card-meta {
      font-size: var(--text-xs);
      color: var(--ocean-blue);
      padding: 2px var(--space-3) var(--space-3);
      text-align: center;
    }

    .asset-card-category {
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      margin: 0 auto var(--space-2);
      display: inline-block;
    }

    /* Category-specific tag colors */
    .asset-card-category[data-cat="characters"] { background: #E8F4F9; color: #1B6B96; }
    .asset-card-category[data-cat="props"] { background: #FFF3E0; color: #E8871E; }
    .asset-card-category[data-cat="backgrounds"] { background: #EDE6D6; color: #8B7355; }
    .asset-card-category[data-cat="skits"],
    .asset-card-category[data-cat="scripts"] { background: #FCE4EC; color: #C62828; }
    .asset-card-category[data-cat="published"],
    .asset-card-category[data-cat="Skits"] { background: #FCE4EC; color: #C62828; }
    .asset-card-category[data-cat="voices"] { background: #F3E5F5; color: #7B1FA2; }

    .card-play-overlay {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--pouch-orange), var(--pouch-deep));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--duration-fast);
      box-shadow: 0 2px 8px rgba(245,166,35,0.3);
      z-index: 2;
    }

    .card-play-overlay:hover {
      box-shadow: 0 4px 12px rgba(245,166,35,0.5);
      transform: scale(1.1);
    }

    .card-play-overlay::after {
      content: '';
      display: block;
      width: 0; height: 0;
      border-style: solid;
      border-width: 6px 0 6px 10px;
      border-color: transparent transparent transparent #fff;
      margin-left: 2px;
    }

    /* Detail panel */
    .detail-panel {
      display: none;
      background: var(--plumage-cream);
      border: 1px solid var(--sand-warm);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      margin-bottom: var(--space-6);
      box-shadow: var(--shadow-md);
    }

    .detail-panel.visible { display: block; }

    .detail-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
    }

    .detail-header h2 {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      color: var(--wing-dark);
      flex: 1;
    }

    .detail-close {
      background: none;
      border: 1px solid var(--sand-warm);
      border-radius: var(--radius-sm);
      color: var(--wing-gray);
      padding: 6px 14px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      transition: all var(--duration-fast);
    }

    .detail-close:hover {
      border-color: var(--mouth-red);
      color: var(--mouth-red);
    }

    .detail-header-play {
      background: linear-gradient(135deg, var(--pouch-orange), var(--pouch-deep));
      color: #fff;
      border: none;
      border-radius: var(--radius-full);
      padding: 6px 16px;
      cursor: pointer;
      font-size: var(--text-sm);
      font-family: var(--font-body);
      font-weight: 600;
      transition: all var(--duration-fast);
      box-shadow: 0 2px 8px rgba(245,166,35,0.3);
    }

    .detail-header-play:hover {
      filter: brightness(1.08);
      box-shadow: 0 4px 12px rgba(245,166,35,0.4);
    }

    .detail-preview {
      background: var(--ocean-foam);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      max-height: 400px;
      overflow: auto;
    }

    .detail-preview svg { max-width: 100%; max-height: 360px; }
    .detail-preview img { max-width: 100%; max-height: 360px; }

    .detail-info {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      font-size: var(--text-sm);
      margin-bottom: var(--space-5);
    }

    .detail-label { color: var(--sand-warm); font-weight: 600; }
    .detail-value { color: var(--wing-dark); }

    .detail-actions {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .detail-btn {
      padding: 8px 18px;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      transition: all var(--duration-fast);
    }

    .btn-download {
      background: linear-gradient(135deg, var(--ocean-blue), var(--ocean-deep));
      color: #fff;
      box-shadow: 0 2px 6px rgba(45,142,196,0.2);
    }
    .btn-download:hover { filter: brightness(1.1); }

    .btn-copy-link {
      background: var(--plumage-cream);
      color: var(--wing-dark);
      border: 1px solid var(--sand-warm);
    }
    .btn-copy-link:hover { background: var(--sand-pale); }

    .btn-play {
      background: linear-gradient(135deg, var(--pouch-orange), var(--pouch-deep));
      color: #fff;
    }
    .btn-play:hover { filter: brightness(1.1); }

    /* Variant tabs */
    .variant-tabs {
      display: flex;
      gap: var(--space-1);
      margin-bottom: var(--space-3);
    }

    .variant-tab {
      padding: 5px 14px;
      background: var(--plumage-cream);
      border: 1px solid var(--sand-warm);
      border-radius: var(--radius-full);
      color: var(--wing-gray);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      transition: all var(--duration-fast);
    }

    .variant-tab:hover { border-color: var(--ocean-blue); color: var(--wing-dark); }

    .variant-tab.active {
      background: var(--ocean-blue);
      border-color: var(--ocean-blue);
      color: #fff;
    }

    .variant-tab.unavailable {
      color: var(--sand-warm);
      cursor: default;
      background: var(--plumage-white);
    }

    /* Skit detail */
    .skit-summary {
      background: var(--ocean-foam);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      font-size: var(--text-sm);
      line-height: 1.6;
      color: var(--wing-dark);
    }

    .skit-summary strong { color: var(--ocean-deep); }

    /* Script list */
    .script-list {
      background: var(--plumage-cream);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      margin-bottom: var(--space-4);
      max-height: 400px;
      overflow-y: auto;
    }

    .script-list h4 {
      margin: 0 0 var(--space-2) 0;
      font-family: var(--font-display);
      color: var(--wing-dark);
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .script-line {
      background: var(--plumage-white);
      border-left: 3px solid var(--sand-warm);
      padding: 6px 10px;
      margin-bottom: 4px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: var(--text-sm);
      line-height: 1.4;
      color: var(--wing-dark);
    }

    .script-line.say { border-left-color: var(--ocean-blue); }
    .script-line.emote { border-left-color: var(--pouch-orange); }
    .script-line.shot { border-left-color: var(--mouth-red); }
    .script-line.stage { border-left-color: var(--ocean-deep); }
    .script-line.prop { border-left-color: var(--bill-yellow); }

    .script-line strong { color: var(--ocean-blue); }
    .script-line.emote strong { color: var(--pouch-deep); }
    .script-line.shot strong { color: var(--mouth-red); }

    .script-line .offset-badge {
      background: var(--ocean-blue);
      color: #fff;
      padding: 1px 5px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      margin-left: 6px;
    }

    /* Loading & empty */
    .loading, .empty-state {
      text-align: center;
      padding: var(--space-12);
      color: var(--sand-warm);
      font-family: var(--font-display);
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--plumage-cream);
      border-top-color: var(--pouch-orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .load-more {
      display: block;
      margin: 0 auto var(--space-6);
    }

    /* Published player embed */
    .published-player {
      position: relative;
      width: 100%;
      background: var(--player-bg);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: var(--space-4);
    }

    .published-player canvas { width: 100%; display: block; }

    .player-controls {
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: var(--player-surface);
      align-items: center;
    }

    .player-controls button {
      background: var(--player-border);
      border: none;
      color: var(--player-text);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
    }

    .player-controls button:hover { background: var(--ocean-deep); }

    .player-timeline {
      flex: 1;
      height: 4px;
      background: var(--player-border);
      border-radius: 2px;
      cursor: pointer;
    }

    .player-timeline-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--pouch-orange), var(--pouch-deep));
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s;
    }

    /* Voice player */
    .voice-player { margin-bottom: var(--space-4); }
    .voice-player audio { width: 100%; }

    /* Responsive */
    @media (max-width: 600px) {
      .container { padding: var(--space-4); }
      .asset-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-3); }
      .pelicans-nav { padding: 0 var(--space-4); flex-wrap: wrap; gap: var(--space-2); height: auto; padding-top: var(--space-3); padding-bottom: var(--space-3); }
    }
  </style>
</head>
<body>

<nav class="pelicans-nav">
  <a href="/" class="pelicans-nav-logo">pelicans<span>.art</span></a>
  <ul class="pelicans-nav-links">
    <li><a href="/sprite-editor.html">Create</a></li>
    <li><a href="/">Watch</a></li>
    <li><a href="/community.html" class="active">Community</a></li>
    <li><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><span class="theme-toggle-icon" id="themeIcon">&#127754;</span> <span id="themeLabel">Ocean</span></button></li>
  </ul>
</nav>

<div class="container">
  <div class="page-header">
    <h2>Community</h2>
    <p>Browse characters, backgrounds, and props shared by the flock.</p>
  </div>

  <div class="category-tabs" id="category-tabs">
    <button class="category-tab active" data-type="all" onclick="switchCategory('all')">All</button>
    <button class="category-tab" data-type="characters" onclick="switchCategory('characters')">Characters</button>
    <button class="category-tab" data-type="props" onclick="switchCategory('props')">Props</button>
    <button class="category-tab" data-type="backgrounds" onclick="switchCategory('backgrounds')">Backgrounds</button>
    <button class="category-tab" data-type="skits" onclick="switchCategory('skits')">Scripts</button>
    <button class="category-tab" data-type="published" onclick="switchCategory('published')">Skits</button>
    <button class="category-tab" data-type="voices" onclick="switchCategory('voices')">Voices</button>
  </div>

  <div class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <h2 id="detail-title">Asset</h2>
      <button class="detail-close" onclick="closeDetail()">Close</button>
    </div>
    <div id="detail-content"></div>
  </div>

  <div id="asset-list">
    <div class="loading" id="loading-indicator">Loading</div>
    <div class="asset-grid" id="asset-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">Nothing in the pouch yet!</div>
    <button class="btn btn-ocean load-more" id="load-more-btn" style="display:none;" onclick="loadMore()">Load More</button>
  </div>
</div>

<!-- FOOTER -->
<footer class="pelicans-footer">
  <svg class="pelicans-footer-wave" viewBox="0 0 1200 30" preserveAspectRatio="none">
    <path d="M0 15 Q150 0 300 15 T600 15 T900 15 T1200 15 L1200 30 L0 30Z" fill="var(--water-dark)"/>
  </svg>
  <div class="pelicans-footer-logo">pelicans<span>.art</span></div>
  <div class="pelicans-footer-tagline">Stuff it in the pouch.</div>
</footer>

<script>
  const API_URL = 'https://pelicans-community.sam-cloudflare-d20.workers.dev/api/community';

  let currentCategory = 'all';
  let currentCursor = null;
  let currentItems = [];
  let selectedSlug = null;

  const CATEGORY_ICONS = {
    characters: '\u{1F9D1}',
    props: '\u{1F381}',
    backgrounds: '\u{1F3DE}',
    skits: '\u{1F4DD}',
    published: '\u{1F3AC}',
    voices: '\u{1F3A4}',
  };

  const VISUAL_CATEGORIES = ['characters', 'props', 'backgrounds'];

  function previewFile(category, slug) {
    switch (category) {
      case 'characters': return `${API_URL}/characters/${slug}/front.svg`;
      case 'props': return `${API_URL}/props/${slug}/prop.svg`;
      case 'backgrounds': return `${API_URL}/backgrounds/${slug}/landscape.svg`;
      default: return null;
    }
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    const id = params.get('id');

    if (type && ['all', 'characters', 'props', 'backgrounds', 'skits', 'published', 'voices'].includes(type)) {
      currentCategory = type;
      document.querySelectorAll('.category-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.type === type);
      });
    }

    await loadCategory();

    if (id) {
      openDetail(id);
    }
  }

  function switchCategory(category) {
    currentCategory = category;
    currentCursor = null;
    currentItems = [];
    selectedSlug = null;
    closeDetail();

    document.querySelectorAll('.category-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.type === category);
    });

    const url = new URL(window.location);
    url.searchParams.set('type', category);
    url.searchParams.delete('id');
    history.replaceState(null, '', url);

    loadCategory();
  }

  async function loadAllCategories() {
    const grid = document.getElementById('asset-grid');
    const loading = document.getElementById('loading-indicator');
    const empty = document.getElementById('empty-state');
    const loadMoreBtn = document.getElementById('load-more-btn');

    grid.innerHTML = '';
    loading.style.display = '';
    empty.style.display = 'none';
    loadMoreBtn.style.display = 'none';
    currentItems = [];
    currentCursor = null;

    const categories = ['characters', 'props', 'backgrounds', 'skits', 'published', 'voices'];

    try {
      const results = await Promise.all(
        categories.map(cat =>
          fetch(`${API_URL}/${cat}?limit=8`)
            .then(r => r.json())
            .then(data => data.items.map(item => ({ ...item, _category: cat })))
            .catch(() => [])
        )
      );

      loading.style.display = 'none';

      const combined = results.flat();
      for (let i = combined.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [combined[i], combined[j]] = [combined[j], combined[i]];
      }

      currentItems = combined;

      if (combined.length === 0) {
        empty.style.display = '';
        return;
      }

      renderCards(combined);
    } catch (e) {
      loading.style.display = 'none';
      empty.style.display = '';
      empty.textContent = 'Failed to load assets: ' + e.message;
    }
  }

  async function loadCategory() {
    if (currentCategory === 'all') return loadAllCategories();
    const grid = document.getElementById('asset-grid');
    const loading = document.getElementById('loading-indicator');
    const empty = document.getElementById('empty-state');
    const loadMoreBtn = document.getElementById('load-more-btn');

    grid.innerHTML = '';
    loading.style.display = '';
    empty.style.display = 'none';
    loadMoreBtn.style.display = 'none';
    currentItems = [];
    currentCursor = null;

    try {
      const resp = await fetch(`${API_URL}/${currentCategory}?limit=50`);
      const data = await resp.json();

      loading.style.display = 'none';
      currentItems = data.items;
      currentCursor = data.cursor;

      if (data.items.length === 0) {
        empty.style.display = '';
        return;
      }

      renderCards(data.items);

      if (data.hasMore && data.cursor) {
        loadMoreBtn.style.display = '';
      }
    } catch (e) {
      loading.style.display = 'none';
      empty.style.display = '';
      empty.textContent = 'Failed to load assets: ' + e.message;
    }
  }

  async function loadMore() {
    if (!currentCursor) return;
    const loadMoreBtn = document.getElementById('load-more-btn');
    loadMoreBtn.textContent = 'Loading...';
    loadMoreBtn.disabled = true;

    try {
      const resp = await fetch(`${API_URL}/${currentCategory}?limit=50&cursor=${encodeURIComponent(currentCursor)}`);
      const data = await resp.json();
      currentItems = currentItems.concat(data.items);
      currentCursor = data.cursor;
      renderCards(data.items, true);

      if (data.hasMore && data.cursor) {
        loadMoreBtn.style.display = '';
      } else {
        loadMoreBtn.style.display = 'none';
      }
    } catch (e) {
      console.error('Load more failed:', e);
    } finally {
      loadMoreBtn.textContent = 'Load More';
      loadMoreBtn.disabled = false;
    }
  }

  function renderCards(items, append = false) {
    const grid = document.getElementById('asset-grid');
    if (!append) grid.innerHTML = '';

    for (const item of items) {
      const card = document.createElement('div');
      card.className = 'asset-card';
      if (item.slug === selectedSlug) card.classList.add('selected');
      card.onclick = () => openDetail(item.slug);

      const preview = document.createElement('div');
      preview.className = 'asset-card-preview';

      const itemCat = item._category || currentCategory;
      const url = previewFile(itemCat, item.slug);
      if (url) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = item.name;
        img.loading = 'lazy';
        preview.appendChild(img);
      } else {
        const icon = document.createElement('div');
        icon.className = 'asset-card-icon';
        icon.textContent = CATEGORY_ICONS[itemCat] || '\u{1F4E6}';
        preview.appendChild(icon);
      }

      const name = document.createElement('div');
      name.className = 'asset-card-name';
      name.textContent = item.name;

      const meta = document.createElement('div');
      meta.className = 'asset-card-meta';
      meta.textContent = item.username;

      card.appendChild(preview);
      card.appendChild(name);
      card.appendChild(meta);

      if (itemCat === 'published') {
        const playOverlay = document.createElement('div');
        playOverlay.className = 'card-play-overlay';
        playOverlay.title = 'Play skit';
        playOverlay.onclick = (e) => {
          e.stopPropagation();
          const dataUrl = `${API_URL}/published/${item.slug}/data.json`;
          window.open(`/player?url=${encodeURIComponent(dataUrl)}`, '_blank');
        };
        card.appendChild(playOverlay);
      }

      if (currentCategory === 'all' && item._category) {
        const CATEGORY_LABELS = { skits: 'Scripts', published: 'Skits' };
        const badge = document.createElement('div');
        badge.className = 'asset-card-category';
        badge.dataset.cat = item._category;
        badge.textContent = CATEGORY_LABELS[item._category] || item._category;
        card.appendChild(badge);
      }

      grid.appendChild(card);
    }
  }

  async function openDetail(slug) {
    selectedSlug = slug;
    const panel = document.getElementById('detail-panel');
    const title = document.getElementById('detail-title');
    const content = document.getElementById('detail-content');

    const matchedItem = currentItems.find(it => it.slug === slug);
    const detailCategory = matchedItem?._category || currentCategory;

    const url = new URL(window.location);
    url.searchParams.set('type', detailCategory);
    url.searchParams.set('id', slug);
    history.replaceState(null, '', url);

    document.querySelectorAll('.asset-card').forEach((c, i) => {
      c.classList.toggle('selected', currentItems[i]?.slug === slug);
    });

    panel.classList.add('visible');
    title.textContent = 'Loading...';
    content.innerHTML = '<div class="loading">Loading</div>';

    const header = document.querySelector('.detail-header');
    const oldPlayBtn = header.querySelector('.detail-header-play');
    if (oldPlayBtn) oldPlayBtn.remove();

    try {
      const metaResp = await fetch(`${API_URL}/${detailCategory}/${slug}`);
      if (!metaResp.ok) throw new Error('Asset not found');
      const meta = await metaResp.json();

      title.textContent = meta.name || slug;

      if (detailCategory === 'published') {
        const playBtn = document.createElement('button');
        playBtn.className = 'detail-header-play';
        playBtn.innerHTML = '&#9654; Play';
        const dataUrl = `${API_URL}/published/${slug}/data.json`;
        playBtn.onclick = () => window.open(`/player?url=${encodeURIComponent(dataUrl)}`, '_blank');
        header.insertBefore(playBtn, header.querySelector('.detail-close'));
      }

      switch (detailCategory) {
        case 'characters': await renderCharacterDetail(content, slug, meta); break;
        case 'props': await renderPropDetail(content, slug, meta); break;
        case 'backgrounds': await renderBackgroundDetail(content, slug, meta); break;
        case 'skits': await renderSkitDetail(content, slug, meta); break;
        case 'published': await renderPublishedDetail(content, slug, meta); break;
        case 'voices': await renderVoiceDetail(content, slug, meta); break;
      }
    } catch (e) {
      content.innerHTML = `<div class="empty-state">Error: ${e.message}</div>`;
    }
  }

  function closeDetail() {
    document.getElementById('detail-panel').classList.remove('visible');
    selectedSlug = null;
    document.querySelectorAll('.asset-card').forEach(c => c.classList.remove('selected'));

    const url = new URL(window.location);
    url.searchParams.delete('id');
    history.replaceState(null, '', url);
  }

  async function renderCharacterDetail(container, slug, meta) {
    const variants = [];
    const frontResp = await fetch(`${API_URL}/characters/${slug}/front.svg`);
    if (frontResp.ok) variants.push({ name: 'front', label: 'Front', svg: await frontResp.text() });
    const backResp = await fetch(`${API_URL}/characters/${slug}/back.svg`);
    if (backResp.ok) variants.push({ name: 'back', label: 'Back', svg: await backResp.text() });

    let tabsHtml = '';
    if (variants.length > 1) {
      tabsHtml = '<div class="variant-tabs" id="char-variant-tabs">';
      variants.forEach((v, i) => {
        tabsHtml += `<button class="variant-tab${i === 0 ? ' active' : ''}" onclick="switchCharVariant('${v.name}')">${v.label}</button>`;
      });
      tabsHtml += '</div>';
    }

    let html = tabsHtml;
    html += '<div class="detail-preview" id="char-preview"></div>';
    html += renderMetaTable(meta);
    html += '<div class="detail-actions">';
    variants.forEach(v => {
      html += `<button class="detail-btn btn-download" onclick="downloadFile('characters', '${slug}', '${v.name}.svg')">Download ${v.label}</button>`;
    });
    html += `<button class="detail-btn btn-download" onclick="downloadFile('characters', '${slug}', 'meta.json')">Download Meta</button>`;
    html += `<button class="detail-btn btn-copy-link" onclick="copyAssetLink()">Copy Link</button>`;
    html += '</div>';
    container.innerHTML = html;

    window._charVariants = {};
    variants.forEach(v => { window._charVariants[v.name] = v.svg; });
    if (variants.length > 0) {
      document.getElementById('char-preview').innerHTML = variants[0].svg;
    }
  }

  function switchCharVariant(name) {
    const svg = window._charVariants?.[name];
    if (svg) document.getElementById('char-preview').innerHTML = svg;
    document.querySelectorAll('#char-variant-tabs .variant-tab').forEach(t => {
      t.classList.toggle('active', t.textContent.toLowerCase() === name);
    });
  }

  async function renderPropDetail(container, slug, meta) {
    let html = '<div class="detail-preview" id="prop-preview"></div>';
    html += renderMetaTable(meta);
    html += `<div class="detail-actions">
      <button class="detail-btn btn-download" onclick="downloadFile('props', '${slug}', 'prop.svg')">Download SVG</button>
      <button class="detail-btn btn-download" onclick="downloadFile('props', '${slug}', 'meta.json')">Download Meta</button>
      <button class="detail-btn btn-copy-link" onclick="copyAssetLink()">Copy Link</button>
    </div>`;
    container.innerHTML = html;

    try {
      const resp = await fetch(`${API_URL}/props/${slug}/prop.svg`);
      if (resp.ok) {
        document.getElementById('prop-preview').innerHTML = await resp.text();
      }
    } catch (e) {}
  }

  async function renderBackgroundDetail(container, slug, meta) {
    const orientations = [];
    const landResp = await fetch(`${API_URL}/backgrounds/${slug}/landscape.svg`);
    if (landResp.ok) orientations.push({ name: 'landscape', label: 'Landscape', svg: await landResp.text() });
    const portResp = await fetch(`${API_URL}/backgrounds/${slug}/portrait.svg`);
    if (portResp.ok) orientations.push({ name: 'portrait', label: 'Portrait', svg: await portResp.text() });

    let tabsHtml = '';
    if (orientations.length > 1) {
      tabsHtml = '<div class="variant-tabs" id="bg-variant-tabs">';
      orientations.forEach((o, i) => {
        tabsHtml += `<button class="variant-tab${i === 0 ? ' active' : ''}" onclick="switchBgVariant('${o.name}')">${o.label}</button>`;
      });
      tabsHtml += '</div>';
    }

    let html = tabsHtml;
    html += '<div class="detail-preview" id="bg-preview"></div>';
    html += renderMetaTable(meta);
    html += '<div class="detail-actions">';
    orientations.forEach(o => {
      html += `<button class="detail-btn btn-download" onclick="downloadFile('backgrounds', '${slug}', '${o.name}.svg')">Download ${o.label}</button>`;
    });
    html += `<button class="detail-btn btn-copy-link" onclick="copyAssetLink()">Copy Link</button>`;
    html += '</div>';
    container.innerHTML = html;

    window._bgVariants = {};
    orientations.forEach(o => { window._bgVariants[o.name] = o.svg; });
    if (orientations.length > 0) {
      document.getElementById('bg-preview').innerHTML = orientations[0].svg;
    }
  }

  function switchBgVariant(name) {
    const svg = window._bgVariants?.[name];
    if (svg) document.getElementById('bg-preview').innerHTML = svg;
    document.querySelectorAll('#bg-variant-tabs .variant-tab').forEach(t => {
      t.classList.toggle('active', t.textContent.toLowerCase() === name);
    });
  }

  async function renderSkitDetail(container, slug, meta) {
    let html = '';
    try {
      const resp = await fetch(`${API_URL}/skits/${slug}/data.json`);
      if (resp.ok) {
        const skit = await resp.json();
        const castNames = skit.cast ? Object.keys(skit.cast).join(', ') : 'none';
        const scriptLen = skit.script ? skit.script.length : 0;
        const dialogueCount = skit.script ? skit.script.filter(a => a.do === 'say').length : 0;

        html += `<div class="skit-summary">
          <strong>Title:</strong> ${skit.meta?.title || 'Untitled'}<br>
          ${skit.meta?.description ? `<strong>Description:</strong> ${skit.meta.description}<br>` : ''}
          <strong>Background:</strong> ${skit.stage?.background || 'none'}<br>
          <strong>Cast:</strong> ${castNames}<br>
          <strong>Script:</strong> ${scriptLen} actions (${dialogueCount} lines of dialogue)
        </div>`;
        html += renderScriptActions(skit.script);
      }
    } catch (e) {}

    html += renderMetaTable(meta);
    html += `<div class="detail-actions">
      <button class="detail-btn btn-download" onclick="downloadFile('skits', '${slug}', '${slug}.json')">Download JSON</button>
      <button class="detail-btn btn-copy-link" onclick="copyAssetLink()">Copy Link</button>
    </div>`;
    container.innerHTML = html;
  }

  async function renderPublishedDetail(container, slug, meta) {
    let html = '';
    try {
      const resp = await fetch(`${API_URL}/published/${slug}/data.json`);
      if (resp.ok) {
        const pub = await resp.json();
        const castNames = pub.cast ? Object.keys(pub.cast).join(', ') : 'none';
        const scriptLen = pub.script ? pub.script.length : 0;
        const dialogueCount = pub.script ? pub.script.filter(a => a.do === 'say').length : 0;
        const audioCount = pub.assets?.audio ? Object.keys(pub.assets.audio).length : 0;
        const spriteCount = pub.assets?.sprites ? Object.keys(pub.assets.sprites).length : 0;

        html += `<div class="skit-summary">
          <strong>Title:</strong> ${pub.meta?.title || 'Untitled'}<br>
          ${pub.meta?.description ? `<strong>Description:</strong> ${pub.meta.description}<br>` : ''}
          <strong>Background:</strong> ${pub.stage?.background || 'none'}<br>
          <strong>Cast:</strong> ${castNames}<br>
          <strong>Script:</strong> ${scriptLen} actions (${dialogueCount} lines)<br>
          <strong>Assets:</strong> ${spriteCount} sprites, ${audioCount} audio clips
        </div>`;

        const bgName = pub.stage?.background;
        if (bgName && pub.assets?.backgrounds?.[bgName]) {
          html += `<div class="detail-preview"><img src="${pub.assets.backgrounds[bgName]}" alt="Background"></div>`;
        }

        html += renderScriptActions(pub.script);
      }
    } catch (e) {}

    html += renderMetaTable(meta);
    html += `<div class="detail-actions">
      <button class="detail-btn btn-download" onclick="downloadFile('published', '${slug}', '${slug}.json')">Download Bundle</button>
      <button class="detail-btn btn-copy-link" onclick="copyAssetLink()">Copy Link</button>
    </div>`;
    container.innerHTML = html;
  }

  async function renderVoiceDetail(container, slug, meta) {
    let html = '';

    const isSafetensors = meta.contentType === 'application/octet-stream' ||
                          (meta.key && meta.key.endsWith('.safetensors'));
    const fileExt = isSafetensors ? 'safetensors' : 'wav';
    const fileUrl = `${API_URL}/voices/${slug}/${slug}.${fileExt}`;

    if (isSafetensors) {
      html += `<div class="voice-player" style="padding:20px;text-align:center;color:var(--wing-gray);">
        <p>This is a processed voice model (safetensors format).</p>
        <p>Import it into the sprite editor to use it.</p>
      </div>`;
    } else {
      html += `<div class="voice-player">
        <audio controls src="${fileUrl}" preload="none" style="width:100%;"></audio>
      </div>`;
    }
    html += renderMetaTable(meta);
    html += `<div class="detail-actions">
      <button class="detail-btn btn-download" onclick="downloadFile('voices', '${slug}', '${slug}.${fileExt}')">Download ${fileExt.toUpperCase()}</button>
      <button class="detail-btn btn-copy-link" onclick="copyAssetLink()">Copy Link</button>
    </div>`;
    container.innerHTML = html;
  }

  function renderMetaTable(meta) {
    const date = meta.uploadedAt ? new Date(meta.uploadedAt).toLocaleDateString() : 'unknown';
    const sizeKB = meta.size ? (meta.size / 1024).toFixed(1) + ' KB' : 'unknown';
    return `<div class="detail-info">
      <span class="detail-label">Uploaded by</span><span class="detail-value">${meta.username || 'unknown'}</span>
      <span class="detail-label">Date</span><span class="detail-value">${date}</span>
      <span class="detail-label">Size</span><span class="detail-value">${sizeKB}</span>
      <span class="detail-label">Category</span><span class="detail-value">${meta.category || currentCategory}</span>
    </div>`;
  }

  function renderScriptActions(script) {
    if (!script || !script.length) return '';
    let html = '<div class="script-list"><h4>Script</h4>';
    script.forEach(action => {
      let content = '';
      let cssClass = '';
      switch (action.do) {
        case 'say':
          content = `<strong>${action.who}:</strong> "${action.line}"`;
          cssClass = 'say';
          break;
        case 'emote':
          content = `${action.who} \u2192 ${action.emotion}`;
          cssClass = 'emote';
          break;
        case 'shot':
          content = `\u{1F4F7} ${action.type}${action.who ? ` (${action.who})` : ''}`;
          cssClass = 'shot';
          break;
        case 'enter':
          content = `\u2197 ${action.who} enters from ${action.from}`;
          cssClass = 'stage';
          break;
        case 'exit':
          content = `\u2198 ${action.who} exits to ${action.to}`;
          cssClass = 'stage';
          break;
        case 'move':
          content = `\u2192 ${action.who} moves to ${action.to}`;
          cssClass = 'stage';
          break;
        case 'pause':
          content = `\u23F8 pause ${action.duration}s`;
          cssClass = 'stage';
          break;
        case 'look':
          content = `\u{1F441} ${action.who} looks ${action.at}`;
          cssClass = 'stage';
          break;
        case 'spawn':
          content = `\u{1F381} spawn ${action.what}${action.who ? ` held by ${action.who}` : (action.at ? ` at (${action.at[0]}, ${action.at[1]})` : '')}`;
          cssClass = 'prop';
          break;
        case 'despawn':
          content = `\u{1F381} despawn ${action.what}`;
          cssClass = 'prop';
          break;
        case 'prop-move':
          content = `\u{1F381} ${action.what} moves to (${action.to?.[0] || '?'}, ${action.to?.[1] || '?'})`;
          cssClass = 'prop';
          break;
        case 'prop-hold':
          content = `\u{1F381} ${action.who} holds ${action.what}`;
          cssClass = 'prop';
          break;
        case 'prop-drop':
          content = `\u{1F381} ${action.who || 'drop'} ${action.what}${action.at ? ` at (${action.at[0]}, ${action.at[1]})` : ''}`;
          cssClass = 'prop';
          break;
        case 'prop-rotate':
          content = `\u{1F381} rotate ${action.what} to ${action.angle}\u00B0`;
          cssClass = 'prop';
          break;
        case 'prop-scale':
          content = `\u{1F381} scale ${action.what} to ${action.scale}x`;
          cssClass = 'prop';
          break;
        case 'prop-animate':
          content = `\u{1F381} animate ${action.what}: ${action.animation}`;
          cssClass = 'prop';
          break;
        default:
          content = JSON.stringify(action);
      }
      if (action.offset < 0) {
        content += ` <span class="offset-badge">[${action.offset}s]</span>`;
      }
      html += `<div class="script-line ${cssClass}">${content}</div>`;
    });
    html += '</div>';
    return html;
  }

  function copyAssetLink() {
    const link = window.location.href;
    navigator.clipboard.writeText(link).then(() => {
      const btns = document.querySelectorAll('.btn-copy-link');
      btns.forEach(b => { b.textContent = 'Copied!'; });
      setTimeout(() => { btns.forEach(b => { b.textContent = 'Copy Link'; }); }, 2000);
    }).catch(() => {
      const tmp = document.createElement('input');
      tmp.value = link;
      document.body.appendChild(tmp);
      tmp.select();
      document.execCommand('copy');
      document.body.removeChild(tmp);
    });
  }

  async function downloadFile(category, slug, filename) {
    const url = `${API_URL}/${category}/${slug}/${filename}`;
    try {
      const resp = await fetch(url);
      if (!resp.ok) {
        alert('File not found');
        return;
      }
      const blob = await resp.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    } catch (e) {
      alert('Download failed: ' + e.message);
    }
  }

  init();

  // --- Theme toggle ---
  function applyTheme(theme) {
    if (theme === 'ocean') {
      document.documentElement.dataset.theme = 'ocean';
      document.getElementById('themeIcon').innerHTML = '&#9728;';
      document.getElementById('themeLabel').textContent = 'Beach';
    } else {
      delete document.documentElement.dataset.theme;
      document.getElementById('themeIcon').innerHTML = '&#127754;';
      document.getElementById('themeLabel').textContent = 'Ocean';
    }
  }
  function toggleTheme() {
    const current = document.documentElement.dataset.theme === 'ocean' ? 'ocean' : 'beach';
    const next = current === 'ocean' ? 'beach' : 'ocean';
    localStorage.setItem('pelicans-theme', next);
    applyTheme(next);
  }
  (function initTheme() {
    const saved = localStorage.getItem('pelicans-theme');
    if (saved) { applyTheme(saved); return; }
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) { applyTheme('ocean'); }
  })();
</script>
