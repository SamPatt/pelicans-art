<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" role="img" aria-labelledby="title desc">
  <title id="title">The pelican emcee</title>
  <desc id="desc">A slightly disheveled white pelican with a huge golden bill, coral bow tie, and a microphone held out for the next performer.</desc>
  <metadata>Model: GPT-6 Astra. Original artwork by Sam Patt with Codex, authored directly as SVG. No generation API used. Permitted use: see ASSET-LICENSE.md.</metadata>
  <g stroke="#163d43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Big webbed feet, planted like a nervous first-time host. -->
    <path d="m120 353-5 35-31 15 15 2 13 9 12-9 23-2-17-16 5-31" fill="#efad39"/>
    <path d="m165 353 8 35 31 12-13 4-10 10-12-8-24 1 14-20-8-30" fill="#efad39"/>
    <!-- Pear-shaped dinner-jacket body. -->
    <path d="M111 177c-26 29-53 72-48 124 3 37 32 66 77 66 54 0 71-32 64-75-4-33-31-70-32-100Z" fill="#fffdf0"/>
    <path d="M85 230c-19 34-20 75 0 99 13 15 26 17 42 17-18-14-25-34-24-55" fill="#d2e5df" stroke="none"/>
    <path d="M92 249c-15 23-11 56 4 71m-2-47c-4 20 1 37 10 45" fill="none" stroke="#8aada6" stroke-width="3"/>
    <!-- Curved neck and untidy crown. -->
    <path d="M111 230c17-31 14-54 3-72-14-23-18-51-7-73l-13-8 22 1-2-18 17 15 12-19 5 20c33-2 54 19 52 46-1 19-21 33-32 50-12 19-12 37 1 56" fill="#fffdf0"/>
    <path d="M156 170c-10 23-10 38 0 56" fill="none" stroke="#b6d2c9" stroke-width="8"/>
