    <ellipse cx="144" cy="113" rx="12" ry="18" fill="#fff"/>
    <ellipse cx="171" cy="112" rx="11" ry="16" fill="#fff"/>
    <ellipse cx="148" cy="116" rx="4" ry="7" fill="#163d43" stroke="none"/>
    <ellipse cx="175" cy="115" rx="4" ry="6" fill="#163d43" stroke="none"/>
    <path d="m133 87 16-3m15 1 13 4" fill="none" stroke-width="3"/>
    <path d="M141 136c24 3 81-1 133-9-13 22-56 59-93 57-20-1-34-18-40-48Z" fill="#efad39"/>
    <path d="M139 128c35-4 83-8 138-5 5 1 6 7 1 9-48 7-88 11-135 8Z" fill="#ffda6b"/>
    <path d="M157 151c8 14 17 20 29 21" fill="none" stroke="#cd812c" stroke-width="3"/>
