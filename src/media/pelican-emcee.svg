      <path d="M234 217h11m-11 7h11m-11 7h11" stroke="#88b5b5" stroke-width="2"/>
      <path d="M240 292c1 24 25 16 27 40 1 15-10 22-21 23" fill="none" stroke-width="3"/>
    </g>
    <path d="m224 268 13-7c7-3 12 5 5 9l-12 8" fill="#fffdf0"/>
