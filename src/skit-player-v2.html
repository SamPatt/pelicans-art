<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Improv Theater v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: system-ui, sans-serif;
      color: #eee;
      padding: 10px;
    }
    
    h1 { color: #e94560; font-size: 18px; margin-bottom: 10px; }
    
    /* Portrait viewport - 9:16 aspect ratio */
    #viewport {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 16;
      max-height: 85vh;
      background: #000;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    @media (max-width: 500px) {
      body { padding: 5px; }
      h1 { font-size: 14px; margin-bottom: 5px; }
      #viewport { max-width: 100%; border-radius: 0; max-height: 75vh; }
    }
    
    /* Stage in world coordinates */
    #stage {
      position: absolute;
      width: 100%;
      height: 100%;
      transition: transform 0.6s ease-out;
      will-change: transform;
    }
    
    #background {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Characters positioned by world x-coordinate */
    .character {
      position: absolute;
      bottom: 12%;
      height: 40%;
      width: auto;
      transition: left 1s ease-in-out, opacity 0.3s;
      transform: translateX(-50%);
    }
    
    .character svg {
      height: 100%;
      width: auto;
    }
    
    .character.flipped {
      transform: translateX(-50%) scaleX(-1);
    }
    
    .character.offscreen { opacity: 0; pointer-events: none; }
    
    /* Head rotation when speaking - transform from chin area */
    .character svg #head-top,
    .character svg #head-bottom {
      transition: transform 0.05s ease-out;
      transform-origin: 50% 55px;
    }
    
    /* Left-side character tilts head left when speaking */
    .character.pos-left.speaking svg #head-top,
    .character.pos-left.speaking svg #head-bottom {
      transform: rotate(-8deg);
    }
    
    /* Right-side character tilts head right when speaking */
    .character.pos-right.speaking svg #head-top,
    .character.pos-right.speaking svg #head-bottom {
      transform: rotate(8deg);
    }
    
    /* Mouth animation for lip sync - smooth scaling */
    .character svg #mouth-open {
      transition: ry 0.05s ease-out, rx 0.05s ease-out, opacity 0.15s ease-out;
    }
    .character svg #mouth-closed {
      transition: opacity 0.25s ease-in, d 0.2s ease-out;
    }
    
    /* Eye direction via pupil transform */
    .character svg .pupil { transition: transform 0.15s ease-out; }
    .character.look-left svg .pupil { transform: translateX(-1.5px); }
    .character.look-right svg .pupil { transform: translateX(1.5px); }
    .character.look-up svg .pupil { transform: translateY(-1.5px); }
    .character.look-down svg .pupil { transform: translateY(1.5px); }
    
    /* Character facing direction */
    .character.facing-left { transform: translateX(-50%) scaleX(-1); }
    .character.facing-right { transform: translateX(-50%) scaleX(1); }
    
    /* SVG emotion transitions - specific elements only */
    .character svg #eye-left-white,
    .character svg #eye-right-white,
    .character svg #eye-left-pupil,
    .character svg #eye-right-pupil,
    .character svg #brow-left,
    .character svg #brow-right,
    .character svg #mouth-closed,
    .character svg #eye-left-highlight,
    .character svg #eye-right-highlight {
      transition: all 0.25s ease-out;
    }
    
    /* Mouth open/closed should NOT transition - instant for lip sync */
    .character svg #mouth-open {
      transition: none !important;
    }
    
    /* Captions */
    #caption {
      position: absolute;
      bottom: 5%;
      left: 5%;
      right: 5%;
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
    }
    #caption.visible { opacity: 1; }
    
    /* Controls */
    #controls {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 400px;
    }
    
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      background: #4a4a6a;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #5a5a8a; }
    button.active { background: #e94560; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #status {
      margin-top: 10px;
      color: #888;
      font-size: 12px;
    }
    
    #debug {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>

    // === STATE ===
    const characters = {};
    const camera = { x: 50, y: 50, zoom: 1, follow: null };

    // === SHOT PRESETS ===
    const shotPresets = {
      'wide': { zoom: 1, y: 50, frameBoth: true },
      'two-shot': { zoom: 1.4, y: 60, frameBoth: true },
      'closeup': { zoom: 2.2 },
      'extreme-closeup': { zoom: 3 },
      'medium': { zoom: 1.6 }
    };
    
    // === CAMERA SYSTEM ===
    let cameraAnimation = null;
    
    function clampCamera() {
      const marginX = 50 / camera.zoom;
      const marginY = 50 / camera.zoom;
      camera.x = Math.max(marginX, Math.min(100 - marginX, camera.x));
      camera.y = Math.max(marginY, Math.min(100 - marginY, camera.y));
    }
    
    function updateCamera() {
      const stage = document.getElementById('stage');
      clampCamera();
      const tx = 50 - camera.x;
      const ty = 50 - camera.y;
      stage.style.transformOrigin = `${camera.x}% ${camera.y}%`;
      stage.style.transform = `translate(${tx}%, ${ty}%) scale(${camera.zoom})`;
    }
    
    function animateCameraTo(targetX, targetY, duration = 1000) {
      if (cameraAnimation) cancelAnimationFrame(cameraAnimation);
      const startX = camera.x, startY = camera.y;
      const startTime = performance.now();
      
      function tick(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        camera.x = startX + (targetX - startX) * ease;
        camera.y = startY + (targetY - startY) * ease;
        updateCamera();
        if (t < 1) cameraAnimation = requestAnimationFrame(tick);
      }
      cameraAnimation = requestAnimationFrame(tick);
    }
    
    function shot(type, who = null, hardCut = true) {
      const preset = shotPresets[type];
      if (!preset) return;
      
      const stage = document.getElementById('stage');
      if (cameraAnimation) { cancelAnimationFrame(cameraAnimation); cameraAnimation = null; }
      
      if (hardCut) stage.style.transition = 'none';
      
      camera.zoom = preset.zoom;
      
      if (preset.frameBoth) {
        const chars = Object.values(characters);
        if (chars.length) {
          camera.x = chars.reduce((sum, c) => sum + c.x, 0) / chars.length;
          camera.y = preset.y || 50;
        }
        camera.follow = null;
      } else if (who && characters[who]) {
        camera.x = characters[who].x;
        camera.y = characters[who].y;
        camera.follow = who;
      }
      
      updateCamera();
      
      if (hardCut) {
        stage.offsetHeight; // force reflow
        stage.style.transition = 'transform 0.6s ease-out';
      }
    }
    
    function followCharacter(name) {
      if (!characters[name]) return;
      camera.follow = name;
      animateCameraTo(characters[name].x, characters[name].y, 600);

    async function loadSprite(spriteName, view = 'front') {
      const spritePath = `sprites/${spriteName}-${view}.svg`;
      const response = await fetch(spritePath);
      const svgText = await response.text();
      return svgText;
    }
    
    async function createCharacter(name, config) {
      const stage = document.getElementById('stage');
      const el = document.createElement('div');
      el.className = 'character' + (config.startOffscreen ? ' offscreen' : '');
      el.id = `char-${name}`;
      el.dataset.sprite = config.sprite;
      el.dataset.voice = config.voice;
      el.style.left = `${config.x}%`;
      
      // Add position class for head rotation direction
      el.classList.add(config.x < 50 ? 'pos-left' : 'pos-right');
      
      // Apply scale if specified
      if (config.scale) {
        el.style.height = `${40 * config.scale}%`;
      }
      
      // Load sprite as inline SVG
      const svgText = await loadSprite(config.sprite, 'front');
      el.innerHTML = svgText;
      
      stage.appendChild(el);
      
      characters[name] = {
        x: config.x,
        y: 67, // character center
        sprite: config.sprite,
        voice: config.voice,
        scale: config.scale || 1,
        el: el
      };
    }
    
    async function setCharacterView(name, view) {
      const char = characters[name];
      if (!char) return;
      const svgText = await loadSprite(char.sprite, view);

    function setEyeDirection(charName, direction) {
      const char = characters[charName];
      if (!char || !char.el) return;
      
      char.el.classList.remove('look-left', 'look-right', 'look-up', 'look-down');
      if (['left', 'right', 'up', 'down'].includes(direction)) {
        char.el.classList.add(`look-${direction}`);
      }
    }
    
    function setFacing(charName, direction) {
      const char = characters[charName];
      if (!char || !char.el) return;
      
      char.el.classList.remove('facing-left', 'facing-right');
      if (direction === 'left') char.el.classList.add('facing-left');
      if (direction === 'right') char.el.classList.add('facing-right');
    }
    
    function getAmplitude() {
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      return sum / dataArray.length;
    }
    
    function moveCharacter(name, toX, duration = 1) {

      char.el.style.transition = `left ${duration}s ease-in-out, opacity 0.3s`;
      char.x = toX;
      char.el.style.left = `${toX}%`;
      
      // Update position class for head rotation direction
      char.el.classList.remove('pos-left', 'pos-right');
      char.el.classList.add(toX < 50 ? 'pos-left' : 'pos-right');
      
      if (camera.follow === name) {
        animateCameraTo(toX, char.y, duration * 1000);
      }
    }

      // Start offscreen

      char.el.style.left = from === 'left' ? '-20%' : '120%';
      char.el.classList.remove('offscreen');
      char.el.offsetHeight; // reflow
      
      // Animate in
      char.el.style.transition = 'left 1s ease-out, opacity 0.3s';
      char.x = toX;
      char.el.style.left = `${toX}%`;
    }

    // === AUDIO SYSTEM ===
    const AUDIO_CACHE_NAME = 'skit-audio-cache-v2';
    
    async function openAudioCache() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(AUDIO_CACHE_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (e) => {
          e.target.result.createObjectStore('audio', { keyPath: 'key' });
        };
      });
    }
    
    async function getCachedAudio(key) {
      try {
        const db = await openAudioCache();
        return new Promise((resolve) => {
          const tx = db.transaction('audio', 'readonly');
          const request = tx.objectStore('audio').get(key);
          request.onsuccess = () => resolve(request.result?.blob);
          request.onerror = () => resolve(null);
        });
      } catch { return null; }
    }
    
    async function setCachedAudio(key, blob) {
      try {
        const db = await openAudioCache();
        const tx = db.transaction('audio', 'readwrite');
        tx.objectStore('audio').put({ key, blob, ts: Date.now() });
      } catch (e) { console.warn('Cache write failed:', e); }
    }
    
    async function generateAudio(text, voice) {
      const cacheKey = `${voice}:${text}`;
      const cached = await getCachedAudio(cacheKey);
      if (cached) return cached;
      
      const formData = new FormData();
      formData.append('text', text);
      formData.append('voice_url', voice);
      const res = await fetch('/tts/tts', { method: 'POST', body: formData });
      if (!res.ok) throw new Error('TTS failed');
      const blob = await res.blob();
      await setCachedAudio(cacheKey, blob);
      return blob;
    }

    // === PLAYBACK ===
    async function loadSkit(name) {
      const skit = skits[name];
      if (!skit) return;
      
      currentSkit = skit;
      triggeredBeats = new Set();
      audioCache.clear();
      
      // Clear stage
      const stage = document.getElementById('stage');
      stage.querySelectorAll('.character').forEach(el => el.remove());
      Object.keys(characters).forEach(k => delete characters[k]);
      
      // Set background
      document.getElementById('background').src = `backgrounds/${skit.stage.background}.svg`;
      
      // Create characters
      for (const [name, config] of Object.entries(skit.cast)) {
        await createCharacter(name, config);
      }
      
      // Reset camera
      camera.x = 50; camera.y = 50; camera.zoom = 1; camera.follow = null;
      updateCamera();
      
      // Set initial eye directions - characters look at each other
      const charNames = Object.keys(characters);
      if (charNames.length >= 2) {
        const [char1, char2] = charNames;
        const char1LooksRight = characters[char2].x > characters[char1].x;
        setEyeDirection(char1, char1LooksRight ? 'right' : 'left');
        setEyeDirection(char2, char1LooksRight ? 'left' : 'right');
      }
      
      // Generate audio
      document.getElementById('status').textContent = 'Generating audio...';
      document.getElementById('playBtn').disabled = true;
      
      const sayActions = skit.script.filter(b => b.do === 'say');
      for (let i = 0; i < sayActions.length; i++) {
        const beat = sayActions[i];
        const char = characters[beat.who];
        document.getElementById('status').textContent = `Loading audio ${i+1}/${sayActions.length}...`;
        
        try {
          const blob = await generateAudio(beat.line, char.voice);
          const audio = new Audio(URL.createObjectURL(blob));
          const source = audioContext.createMediaElementSource(audio);
          source.connect(analyser);
          audioCache.set(`${beat.t}-${beat.who}`, { audio, beat, charName: beat.who });
        } catch (e) {
          console.error('TTS error:', e);
        }
      }
      
      document.getElementById('status').textContent = 'Ready!';
      document.getElementById('playBtn').disabled = false;
    }
    
    function togglePlay() {
      if (isPlaying) stop();
      else play();
    }
    
    function play() {
      if (audioContext.state === 'suspended') audioContext.resume();
      isPlaying = true;
      startTime = performance.now();
      triggeredBeats = new Set();
      document.getElementById('playBtn').textContent = '⏸ Pause';
      animate();
    }
    
    function stop() {
      isPlaying = false;
      currentSpeaker = null;
      peakAmp = 50;
      openDuration = 0;
      if (animationId) cancelAnimationFrame(animationId);
      document.getElementById('playBtn').textContent = '▶ Play';
      document.getElementById('caption').classList.remove('visible');
      Object.values(characters).forEach(c => {
        c.el.classList.remove('speaking', 'look-left', 'look-right', 'look-up', 'look-down');
        // Reset mouth state
        const mouthOpen = c.el.querySelector('#mouth-open');
        const mouthClosed = c.el.querySelector('#mouth-closed');
        if (mouthOpen) { mouthOpen.setAttribute('opacity', '0'); mouthOpen.setAttribute('ry', '3'); }
        if (mouthClosed) mouthClosed.setAttribute('opacity', '1');
      });
      audioCache.forEach(({ audio }) => { audio.pause(); audio.currentTime = 0; });
    }
    
    let currentSpeaker = null;
    let peakAmp = 50;
    let openDuration = 0;
    
    function animate() {
      if (!isPlaying) return;
      
      const elapsed = (performance.now() - startTime) / 1000;
      
      if (elapsed > currentSkit.meta.duration) {
        stop();
        return;
      }
      
      // Process beats
      currentSkit.script.forEach(beat => {
        const key = `${beat.t}-${beat.do}-${beat.who || ''}`;
        if (elapsed >= beat.t && !triggeredBeats.has(key)) {
          triggeredBeats.add(key);
          processBeat(beat);
        }
      });
      
      // Lip sync based on audio amplitude - dynamic mouth scaling
      if (currentSpeaker && characters[currentSpeaker]) {
        const rawAmp = getAmplitude();
        if (rawAmp > peakAmp) peakAmp = rawAmp;
        peakAmp = Math.max(30, peakAmp * 0.995);
        const normalizedAmp = rawAmp / peakAmp; // 0 to 1
        
        const charEl = characters[currentSpeaker].el;
        const mouthOpen = charEl.querySelector('#mouth-open');
        const mouthClosed = charEl.querySelector('#mouth-closed');
        
        if (mouthOpen && mouthClosed) {
          // Threshold for any mouth movement
          const threshold = 0.15;
          
          if (normalizedAmp > threshold) {
            openDuration++;
            
            // Scale mouth opening based on amplitude (min 1, max 4 for ry)
            const mouthScale = 1 + (normalizedAmp - threshold) * 4;
            const mouthRy = Math.min(4, Math.max(1, mouthScale));
            const mouthRx = 3 + (normalizedAmp - threshold) * 2; // width also scales slightly
            
            mouthOpen.setAttribute('ry', mouthRy.toFixed(1));
            mouthOpen.setAttribute('rx', mouthRx.toFixed(1));
            mouthOpen.setAttribute('opacity', '1');
            mouthClosed.setAttribute('opacity', '0');
            
            // Head tilt when speaking
            charEl.classList.add('speaking');
          } else {
            openDuration = 0;
            mouthOpen.setAttribute('opacity', '0');
            mouthClosed.setAttribute('opacity', '1');
            charEl.classList.remove('speaking');
          }
        }
      }
      
      animationId = requestAnimationFrame(animate);
    }
    
    function processBeat(beat) {
      switch (beat.do) {
        case 'shot':
          shot(beat.type, beat.who);
          break;
          
        case 'say':
          const cached = audioCache.get(`${beat.t}-${beat.who}`);
          if (cached) {
            // Show caption
            document.getElementById('caption').textContent = beat.line;
            document.getElementById('caption').classList.add('visible');
            
            // Stop previous speaker animation
            if (currentSpeaker && characters[currentSpeaker]) {
              characters[currentSpeaker].el.classList.remove('speaking');
            }
            
            // Set up eye contact - speaker looks at other character
            const charNames = Object.keys(characters);
            const otherChar = charNames.find(n => n !== beat.who);
            if (otherChar) {
              // Determine relative positions for eye direction
              const speakerX = characters[beat.who].x;
              const otherX = characters[otherChar].x;
              const speakerLooksRight = otherX > speakerX;
              const otherLooksRight = speakerX > otherX;
              
              setEyeDirection(beat.who, speakerLooksRight ? 'right' : 'left');
              setEyeDirection(otherChar, otherLooksRight ? 'right' : 'left');
            }
            
            // Start speaking
            currentSpeaker = beat.who;
            peakAmp = 50; // Reset peak for new speaker
            openDuration = 0;
            
            cached.audio.onended = () => {
              const charEl = characters[beat.who]?.el;
              if (charEl) {
                charEl.classList.remove('speaking');
                const mouthOpen = charEl.querySelector('#mouth-open');
                const mouthClosed = charEl.querySelector('#mouth-closed');
                // Smoothly close mouth - ry first, then opacity
                if (mouthOpen) {
                  mouthOpen.setAttribute('ry', '1');
                  mouthOpen.setAttribute('rx', '2');
                  // Delay the opacity fade to allow size transition
                  setTimeout(() => {
                    mouthOpen.setAttribute('opacity', '0');
                    if (mouthClosed) mouthClosed.setAttribute('opacity', '1');
                  }, 100);
                }
              }
              document.getElementById('caption').classList.remove('visible');
              currentSpeaker = null;
            };
            
            cached.audio.play();
          }
          break;
          
        case 'emote':
          setEmotion(beat.who, beat.emotion);
          break;
          
        case 'move':
          moveCharacter(beat.who, beat.to, beat.duration || 1);
          break;
          
        case 'enter':
          enterCharacter(beat.who, beat.from, beat.to);
          break;
          
        case 'exit':
          exitCharacter(beat.who, beat.to);
          break;
          
        case 'follow':
          if (beat.who) followCharacter(beat.who);
          else camera.follow = null;
          break;
          
        case 'look':
          // Handle look directions
          let lookDir = beat.at;
          if (beat.at === 'audience') {
            // Look away from center (toward camera)
            lookDir = characters[beat.who].x < 50 ? 'left' : 'right';
          } else if (beat.at === 'other') {
            // Look at other character
            const charNames = Object.keys(characters);
            const other = charNames.find(n => n !== beat.who);
            if (other) {
              lookDir = characters[other].x > characters[beat.who].x ? 'right' : 'left';
            }
          }
          setEyeDirection(beat.who, lookDir);
          break;
          
        case 'turn':
          setCharacterView(beat.who, beat.to);
          break;
          
        case 'face':
          setFacing(beat.who, beat.dir);
          break;
      }
    }
    
    // === INIT ===
    async function init() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.connect(audioContext.destination);
      
      await loadSkit('luckyCharms');
    }
    
    init();
