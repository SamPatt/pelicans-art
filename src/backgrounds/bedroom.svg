<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Bedroom background -->
  <!-- Wall - lighter pink/cream -->
  <rect width="800" height="450" fill="#f0e6e0"/>
  
  <!-- Floor -->
  <rect y="350" width="800" height="100" fill="#c9b896"/>
  
  <!-- Bed frame -->
  <rect x="250" y="200" width="450" height="180" rx="10" fill="#5c4033"/>
  
  <!-- Mattress -->
  <rect x="260" y="180" width="430" height="160" rx="8" fill="#ffffff"/>
  
  <!-- Yellow pillow -->
  <ellipse cx="340" cy="220" rx="60" ry="35" fill="#f7e066"/>
  <ellipse cx="340" cy="220" rx="50" ry="28" fill="#fff8a8"/>
  
  <!-- Blanket/comforter -->
  <rect x="260" y="250" width="430" height="90" rx="5" fill="#a8d8ea"/>
  <path d="M260 280 Q400 260 540 280 Q600 290 690 275" stroke="#8bc4d6" stroke-width="2" fill="none"/>
  
  <!-- Bunny plushie on pillow -->
  <g transform="translate(400, 200)">
    <!-- Body -->
    <ellipse cx="0" cy="15" rx="15" ry="12" fill="#f5f5f5"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="12" fill="#f5f5f5"/>
    <!-- Ears -->
    <ellipse cx="-6" cy="-18" rx="4" ry="12" fill="#f5f5f5"/>
    <ellipse cx="6" cy="-18" rx="4" ry="12" fill="#f5f5f5"/>
    <ellipse cx="-6" cy="-18" rx="2" ry="8" fill="#ffccd5"/>
    <ellipse cx="6" cy="-18" rx="2" ry="8" fill="#ffccd5"/>
    <!-- Face -->
    <circle cx="-4" cy="-2" r="2" fill="#2d2d2d"/>
    <circle cx="4" cy="-2" r="2" fill="#2d2d2d"/>
    <ellipse cx="0" cy="3" rx="2" ry="1.5" fill="#ffb6c1"/>
  </g>
  
  <!-- Nightstand -->
  <rect x="150" y="260" width="80" height="100" fill="#6b5344"/>
  <rect x="155" y="290" width="70" height="30" rx="3" fill="#5c4033"/>
  <circle cx="190" cy="305" r="4" fill="#d4af37"/>
  
  <!-- Lamp on nightstand -->
  <rect x="180" y="230" width="20" height="35" fill="#d4af37"/>
  <path d="M165 230 L215 230 L200 200 L180 200 Z" fill="#fff8dc"/>
  
  <!-- Window hint -->
  <rect x="50" y="80" width="120" height="150" rx="5" fill="#87ceeb" opacity="0.5"/>
  <line x1="110" y1="80" x2="110" y2="230" stroke="#ffffff" stroke-width="4"/>
  <line x1="50" y1="155" x2="170" y2="155" stroke="#ffffff" stroke-width="4"/>
</svg>
