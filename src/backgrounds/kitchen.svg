<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Kitchen background -->
  <!-- Wall -->
  <rect width="800" height="450" fill="#f5f0e6"/>
  
  <!-- Floor - tile pattern -->
  <rect y="320" width="800" height="130" fill="#d4c8b8"/>
  <g fill="#c4b8a8" opacity="0.5">
    <rect x="0" y="320" width="100" height="65"/>
    <rect x="200" y="320" width="100" height="65"/>
    <rect x="400" y="320" width="100" height="65"/>
    <rect x="600" y="320" width="100" height="65"/>
    <rect x="100" y="385" width="100" height="65"/>
    <rect x="300" y="385" width="100" height="65"/>
    <rect x="500" y="385" width="100" height="65"/>
    <rect x="700" y="385" width="100" height="65"/>
  </g>
  
  <!-- Counter -->
  <rect x="0" y="200" width="350" height="120" fill="#8b7355"/>
  <rect x="0" y="195" width="350" height="10" fill="#6b5344"/>
  
  <!-- Cabinets above -->
  <rect x="20" y="50" width="120" height="100" fill="#d4a574"/>
  <rect x="25" y="55" width="50" height="90" fill="#c49464"/>
  <rect x="85" y="55" width="50" height="90" fill="#c49464"/>
  <circle cx="70" cy="100" r="4" fill="#d4af37"/>
  <circle cx="110" cy="100" r="4" fill="#d4af37"/>
  
  <rect x="160" y="50" width="120" height="100" fill="#d4a574"/>
  <rect x="165" y="55" width="50" height="90" fill="#c49464"/>
  <rect x="225" y="55" width="50" height="90" fill="#c49464"/>
  <circle cx="210" cy="100" r="4" fill="#d4af37"/>
  <circle cx="250" cy="100" r="4" fill="#d4af37"/>
  
  <!-- Stove/range -->
  <rect x="400" y="200" width="200" height="120" fill="#4a4a4a"/>
  <rect x="400" y="195" width="200" height="10" fill="#333"/>
  <!-- Burners -->
  <circle cx="450" cy="250" r="25" fill="#222" stroke="#555" stroke-width="2"/>
  <circle cx="450" cy="250" r="15" fill="#333"/>
  <circle cx="550" cy="250" r="25" fill="#222" stroke="#555" stroke-width="2"/>
  <circle cx="550" cy="250" r="15" fill="#333"/>
  <!-- Oven door -->
  <rect x="420" y="280" width="160" height="35" fill="#333" rx="2"/>
  <rect x="430" y="285" width="140" height="25" fill="#1a1a1a" rx="2"/>
  
  <!-- Fridge on right -->
  <rect x="650" y="80" width="130" height="240" fill="#e8e8e8"/>
  <rect x="655" y="85" width="120" height="120" fill="#d8d8d8"/>
  <rect x="655" y="210" width="120" height="105" fill="#d8d8d8"/>
  <rect x="760" y="130" width="10" height="30" fill="#c0c0c0"/>
  <rect x="760" y="250" width="10" height="30" fill="#c0c0c0"/>
  
  <!-- Window -->
  <rect x="500" y="40" width="120" height="100" fill="#87ceeb"/>
  <rect x="500" y="40" width="120" height="100" fill="none" stroke="#fff" stroke-width="8"/>
  <line x1="560" y1="40" x2="560" y2="140" stroke="#fff" stroke-width="4"/>
  <line x1="500" y1="90" x2="620" y2="90" stroke="#fff" stroke-width="4"/>
  
  <!-- Fruit bowl on counter -->
  <ellipse cx="150" cy="190" rx="40" ry="15" fill="#8b7355"/>
  <ellipse cx="150" cy="185" rx="35" ry="20" fill="#deb887"/>
  <circle cx="140" cy="175" r="12" fill="#ff6347"/>
  <circle cx="160" cy="178" r="10" fill="#ffd700"/>
  <ellipse cx="150" cy="170" rx="8" ry="5" fill="#9acd32"/>
</svg>
