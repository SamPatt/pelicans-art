  <line x1="175" y1="175" x2="185" y2="180" stroke="#3a3a32" stroke-width="0.5"/>
  <line x1="210" y1="185" x2="220" y2="190" stroke="#3a3a32" stroke-width="0.5"/>
  <line x1="190" y1="200" x2="200" y2="195" stroke="#3a3a32" stroke-width="0.5"/>
  <line x1="195" y1="210" x2="210" y2="215" stroke="#3a3a32" stroke-width="0.5"/>

  <!-- Iron fence posts left -->
  <rect x="30" y="150" width="2" height="20" fill="#2a2a2a"/>
  <rect x="45" y="150" width="2" height="20" fill="#2a2a2a"/>
  <line x1="25" y1="155" x2="55" y2="155" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="25" y1="163" x2="55" y2="163" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Fence spikes -->
  <polygon points="29,150 31,146 33,150" fill="#2a2a2a"/>
  <polygon points="44,150 46,146 48,150" fill="#2a2a2a"/>

  <!-- Iron fence posts right -->
  <rect x="355" y="150" width="2" height="20" fill="#2a2a2a"/>
  <rect x="370" y="150" width="2" height="20" fill="#2a2a2a"/>
  <line x1="350" y1="155" x2="380" y2="155" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="350" y1="163" x2="380" y2="163" stroke="#2a2a2a" stroke-width="1"/>
  <polygon points="354,150 356,146 358,150" fill="#2a2a2a"/>
  <polygon points="369,150 371,146 373,150" fill="#2a2a2a"/>

  <!-- Gravestones left -->
  <rect x="20" y="170" width="12" height="16" rx="4" fill="#4a4a4a"/>
  <line x1="26" y1="173" x2="26" y2="176" stroke="#3a3a3a" stroke-width="0.8"/>
  <line x1="23" y1="175" x2="29" y2="175" stroke="#3a3a3a" stroke-width="0.8"/>

  <rect x="42" y="173" width="10" height="14" rx="3" fill="#505050"/>

  <!-- Gravestones right -->
  <rect x="350" y="172" width="11" height="15" rx="4" fill="#4a4a4a"/>
  <rect x="370" y="170" width="12" height="16" rx="4" fill="#505050"/>
  <line x1="376" y1="173" x2="376" y2="176" stroke="#3a3a3a" stroke-width="0.8"/>
  <line x1="373" y1="175" x2="379" y2="175" stroke="#3a3a3a" stroke-width="0.8"/>

  <!-- Sparse dead grass tufts -->
  <g opacity="0.5">
    <path d="M10 185 Q12 178 14 185" fill="none" stroke="#4a4a32" stroke-width="0.8"/>
    <path d="M70 190 Q72 183 74 190" fill="none" stroke="#4a4a32" stroke-width="0.8"/>
    <path d="M130 188 Q132 181 134 188" fill="none" stroke="#4a4a32" stroke-width="0.8"/>
    <path d="M270 188 Q272 181 274 188" fill="none" stroke="#4a4a32" stroke-width="0.8"/>
    <path d="M330 192 Q332 185 334 192" fill="none" stroke="#4a4a32" stroke-width="0.8"/>
    <path d="M390 187 Q392 180 394 187" fill="none" stroke="#4a4a32" stroke-width="0.8"/>
  </g>

  <!-- Fog at ground level -->
  <ellipse cx="100" cy="200" rx="80" ry="12" fill="#6a6a6a" opacity="0.15"/>
  <ellipse cx="300" cy="195" rx="70" ry="10" fill="#6a6a6a" opacity="0.12"/>
  <ellipse cx="200" cy="210" rx="100" ry="8" fill="#6a6a6a" opacity="0.1"/>

  <!-- Bats in sky -->
  <g transform="translate(50, 15)" opacity="0.6">
    <path d="M-4 0 Q-2 -3 0 0 Q2 -3 4 0" fill="#2a2a2a" stroke="none"/>
  </g>
  <g transform="translate(340, 10)" opacity="0.5">
    <path d="M-3 0 Q-1.5 -2.5 0 0 Q1.5 -2.5 3 0" fill="#2a2a2a" stroke="none"/>
  </g>
  <g transform="translate(280, 8)" opacity="0.4">
    <path d="M-2.5 0 Q-1.2 -2 0 0 Q1.2 -2 2.5 0" fill="#2a2a2a" stroke="none"/>
  </g>
</svg>