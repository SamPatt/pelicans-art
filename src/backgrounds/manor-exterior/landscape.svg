<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <!-- Overcast sky -->
  <rect x="0" y="0" width="400" height="225" fill="#4a4e54"/>
  <!-- Sky gradient - darker at top -->
  <rect x="0" y="0" width="400" height="80" fill="#3d4147" opacity="0.6"/>
  <!-- Storm clouds -->
  <ellipse cx="60" cy="25" rx="70" ry="25" fill="#555a60" opacity="0.8"/>
  <ellipse cx="180" cy="18" rx="90" ry="22" fill="#5a5f65" opacity="0.7"/>
  <ellipse cx="320" cy="30" rx="80" ry="28" fill="#525860" opacity="0.8"/>
  <ellipse cx="400" cy="15" rx="60" ry="20" fill="#585d63" opacity="0.6"/>

  <!-- Distant dead trees left -->
  <line x1="15" y1="90" x2="15" y2="130" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="15" y1="100" x2="8" y2="90" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="15" y1="105" x2="22" y2="92" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Distant dead trees right -->
  <line x1="385" y1="85" x2="385" y2="130" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="385" y1="95" x2="378" y2="83" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="385" y1="100" x2="393" y2="87" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Manor building - main body -->
  <rect x="80" y="55" width="240" height="110" fill="#5c5c5c"/>
  <!-- Stone texture lines -->
  <g opacity="0.3">
    <line x1="80" y1="75" x2="320" y2="75" stroke="#4a4a4a" stroke-width="0.5"/>
    <line x1="80" y1="95" x2="320" y2="95" stroke="#4a4a4a" stroke-width="0.5"/>
    <line x1="80" y1="115" x2="320" y2="115" stroke="#4a4a4a" stroke-width="0.5"/>
    <line x1="80" y1="135" x2="320" y2="135" stroke="#4a4a4a" stroke-width="0.5"/>
    <line x1="80" y1="155" x2="320" y2="155" stroke="#4a4a4a" stroke-width="0.5"/>
    <line x1="140" y1="55" x2="140" y2="165" stroke="#4a4a4a" stroke-width="0.3"/>
    <line x1="200" y1="55" x2="200" y2="165" stroke="#4a4a4a" stroke-width="0.3"/>
    <line x1="260" y1="55" x2="260" y2="165" stroke="#4a4a4a" stroke-width="0.3"/>
  </g>

  <!-- Roof - main -->
  <polygon points="70,55 200,15 330,55" fill="#3d3d3d"/>
  <line x1="70" y1="55" x2="330" y2="55" stroke="#333" stroke-width="1"/>

  <!-- Left tower -->
  <rect x="60" y="30" width="40" height="135" fill="#505050"/>
  <polygon points="55,30 80,0 105,30" fill="#3a3a3a"/>
  <!-- Tower window -->
  <rect x="72" y="50" width="16" height="22" rx="8" fill="#2a2a3a"/>
  <line x1="80" y1="50" x2="80" y2="72" stroke="#444" stroke-width="1"/>
  <line x1="72" y1="61" x2="88" y2="61" stroke="#444" stroke-width="1"/>
  <!-- Eerie window glow -->
  <rect x="73" y="51" width="14" height="20" rx="7" fill="#4a6a4a" opacity="0.2"/>
  <!-- Left gargoyle -->
  <g transform="translate(55, 28)">
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#484848"/>
    <circle cx="-2" cy="-1" r="1" fill="#6a6a4a"/>
    <circle cx="2" cy="-1" r="1" fill="#6a6a4a"/>
    <path d="M-3 2 Q0 5 3 2" fill="none" stroke="#3a3a3a" stroke-width="0.8"/>
  </g>

  <!-- Right tower -->
  <rect x="300" y="30" width="40" height="135" fill="#505050"/>
  <polygon points="295,30 320,0 345,30" fill="#3a3a3a"/>
  <!-- Tower window -->
  <rect x="312" y="50" width="16" height="22" rx="8" fill="#2a2a3a"/>
  <line x1="320" y1="50" x2="320" y2="72" stroke="#444" stroke-width="1"/>
  <line x1="312" y1="61" x2="328" y2="61" stroke="#444" stroke-width="1"/>
  <rect x="313" y="51" width="14" height="20" rx="7" fill="#4a6a4a" opacity="0.2"/>
  <!-- Right gargoyle -->
  <g transform="translate(345, 28)">
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#484848"/>
    <circle cx="-2" cy="-1" r="1" fill="#6a6a4a"/>
    <circle cx="2" cy="-1" r="1" fill="#6a6a4a"/>
    <path d="M-3 2 Q0 5 3 2" fill="none" stroke="#3a3a3a" stroke-width="0.8"/>
  </g>

  <!-- Upper windows row -->
  <rect x="120" y="65" width="22" height="28" rx="11" fill="#2a2a3a"/>
  <line x1="131" y1="65" x2="131" y2="93" stroke="#444" stroke-width="0.8"/>
  <line x1="120" y1="79" x2="142" y2="79" stroke="#444" stroke-width="0.8"/>
  <rect x="121" y="66" width="20" height="26" rx="10" fill="#3a4a5a" opacity="0.15"/>

  <rect x="189" y="65" width="22" height="28" rx="11" fill="#2a2a3a"/>
  <line x1="200" y1="65" x2="200" y2="93" stroke="#444" stroke-width="0.8"/>
  <line x1="189" y1="79" x2="211" y2="79" stroke="#444" stroke-width="0.8"/>
  <rect x="190" y="66" width="20" height="26" rx="10" fill="#3a4a5a" opacity="0.15"/>

  <rect x="258" y="65" width="22" height="28" rx="11" fill="#2a2a3a"/>
  <line x1="269" y1="65" x2="269" y2="93" stroke="#444" stroke-width="0.8"/>
  <line x1="258" y1="79" x2="280" y2="79" stroke="#444" stroke-width="0.8"/>
  <rect x="259" y="66" width="20" height="26" rx="10" fill="#3a4a5a" opacity="0.15"/>

