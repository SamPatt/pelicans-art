  <rect x="105" y="110" width="20" height="30" fill="#2a2a3a"/>
  <line x1="115" y1="110" x2="115" y2="140" stroke="#444" stroke-width="0.8"/>
  <rect x="106" y="111" width="18" height="28" fill="#4a5a4a" opacity="0.12"/>

  <rect x="275" y="110" width="20" height="30" fill="#2a2a3a"/>
  <line x1="285" y1="110" x2="285" y2="140" stroke="#444" stroke-width="0.8"/>
  <rect x="276" y="111" width="18" height="28" fill="#4a5a4a" opacity="0.12"/>

  <!-- Main entrance -->
  <rect x="175" y="105" width="50" height="60" fill="#2a2020"/>
  <path d="M175 105 Q200 85 225 105" fill="#3d3d3d"/>
  <!-- Door -->
  <rect x="185" y="120" width="30" height="45" rx="2" fill="#1a1210"/>
  <line x1="200" y1="120" x2="200" y2="165" stroke="#2a2020" stroke-width="1"/>
  <!-- Door knocker -->
  <circle cx="193" cy="142" r="2" fill="#8a7a4a"/>
  <circle cx="207" cy="142" r="2" fill="#8a7a4a"/>

  <!-- Monster Manor sign -->
  <rect x="155" y="96" width="90" height="14" rx="2" fill="#4a4038"/>
  <rect x="157" y="97" width="86" height="12" rx="1" fill="#5a5040"/>
  <!-- Sign text approximation using small shapes -->
  <text x="200" y="107" text-anchor="middle" font-family="serif" font-size="8" font-weight="bold" fill="#c8b888" letter-spacing="0.5">MONSTER MANOR</text>

  <!-- Ivy on left wall -->
  <g opacity="0.7">
    <circle cx="85" cy="70" r="4" fill="#2a4a2a"/>
    <circle cx="90" cy="78" r="5" fill="#1a3a1a"/>
    <circle cx="83" cy="85" r="4" fill="#2a4a2a"/>
    <circle cx="88" cy="93" r="5" fill="#1a3a1a"/>
    <circle cx="82" cy="100" r="4" fill="#2a4a2a"/>
    <circle cx="87" cy="108" r="3" fill="#1a3a1a"/>
    <circle cx="95" cy="72" r="3" fill="#1a3a1a"/>
    <circle cx="98" cy="82" r="4" fill="#2a4a2a"/>
  </g>

  <!-- Ivy on right wall -->
  <g opacity="0.7">
    <circle cx="315" cy="68" r="4" fill="#2a4a2a"/>
    <circle cx="310" cy="76" r="5" fill="#1a3a1a"/>
    <circle cx="317" cy="84" r="4" fill="#2a4a2a"/>
    <circle cx="312" cy="92" r="5" fill="#1a3a1a"/>
    <circle cx="318" cy="100" r="4" fill="#2a4a2a"/>
    <circle cx="305" cy="80" r="3" fill="#1a3a1a"/>
    <circle cx="302" cy="88" r="4" fill="#2a4a2a"/>
  </g>

  <!-- Ivy over entrance -->
  <g opacity="0.6">
    <circle cx="170" cy="100" r="4" fill="#2a4a2a"/>
    <circle cx="165" cy="108" r="3" fill="#1a3a1a"/>
    <circle cx="230" cy="100" r="4" fill="#2a4a2a"/>
    <circle cx="235" cy="108" r="3" fill="#1a3a1a"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="165" width="400" height="60" fill="#3a3a32"/>

  <!-- Cracked stone path -->
  <path d="M160 165 L155 225" stroke="#4a4a42" stroke-width="0.5" fill="none"/>
  <path d="M240 165 L245 225" stroke="#4a4a42" stroke-width="0.5" fill="none"/>
  <rect x="155" y="165" width="90" height="60" fill="#4e4e46" opacity="0.5"/>
