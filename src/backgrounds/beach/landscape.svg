<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" width="100" height="150">
  <!-- Sky gradient background -->
  <defs style="cursor: pointer;">
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%" style="cursor: pointer;">
      <stop offset="0%" style="stop-color: rgb(135, 206, 235); cursor: pointer;"></stop>
      <stop offset="100%" style="stop-color: rgb(224, 244, 255); cursor: pointer;"></stop>
    </linearGradient>
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%" style="cursor: pointer;">
      <stop offset="0%" style="stop-color: rgb(30, 144, 255); cursor: pointer;"></stop>
      <stop offset="100%" style="stop-color: rgb(77, 184, 232); cursor: pointer;"></stop>
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect x="0" y="0" width="400" height="225" fill="url(#sky)" style="cursor: pointer;"></rect>
  
  <!-- Sun -->
  
  
  <!-- Clouds -->
  <g fill="#FFFFFF">
    <ellipse cx="80" cy="40" rx="25" ry="12" style="cursor: pointer;"></ellipse>
    <ellipse cx="100" cy="35" rx="20" ry="10" style="cursor: pointer;"></ellipse>
    <ellipse cx="60" cy="38" rx="18" ry="9" style="cursor: pointer;"></ellipse>
    
    <ellipse cx="200" cy="55" rx="22" ry="10" style="cursor: pointer;"></ellipse>
    <ellipse cx="220" cy="50" rx="18" ry="9" style="cursor: pointer;"></ellipse>
    <ellipse cx="185" cy="52" rx="15" ry="8" style="cursor: pointer;"></ellipse>
  </g>
  
  <!-- Ocean - background -->
  <rect x="0" y="100" width="400" height="60" fill="url(#ocean)" style="cursor: pointer;"></rect>
  
  <!-- Ocean waves -->
  <path d="M0 120 Q20 115 40 120 T80 120 T120 120 T160 120 T200 120 T240 120 T280 120 T320 120 T360 120 T400 120 V160 H0 Z" fill="#3BA3D0" style="cursor: pointer;"></path>
  <path d="M0 135 Q25 130 50 135 T100 135 T150 135 T200 135 T250 135 T300 135 T350 135 T400 135 V160 H0 Z" fill="#4DBCE8" style="cursor: pointer;"></path>
  
  <!-- Sand - foreground -->
  <rect x="0" y="155" width="400" height="70" fill="#F4D58D" style="cursor: pointer;"></rect>
  
  <!-- Wet sand near water -->
  <rect x="0" y="155" width="400" height="12" fill="#D4B577" style="cursor: pointer;"></rect>
  
  <!-- Beach details - small shells/pebbles -->
  <circle cx="50" cy="190" r="3" fill="#E8C87D" style="cursor: pointer;"></circle>
  <circle cx="150" cy="200" r="2" fill="#DEB887" style="cursor: pointer;"></circle>
  <circle cx="280" cy="195" r="2.5" fill="#E8C87D" style="cursor: pointer;"></circle>
  <circle cx="350" cy="185" r="2" fill="#DEB887" style="cursor: pointer;"></circle>
  
  <!-- Palm tree left -->
  <rect x="25" y="130" width="8" height="65" fill="#8B4513" style="cursor: pointer;"></rect>
  <path d="M29 130 Q10 110 -5 125" stroke="#228B22" stroke-width="8" fill="none" stroke-linecap="round" style="cursor: pointer;"></path>
  <path d="M29 130 Q50 105 70 120" stroke="#228B22" stroke-width="8" fill="none" stroke-linecap="round" style="cursor: pointer;"></path>
  <path d="M29 130 Q25 100 15 95" stroke="#2E8B2E" stroke-width="7" fill="none" stroke-linecap="round" style="cursor: pointer;"></path>
  <path d="M29 130 Q40 100 55 100" stroke="#2E8B2E" stroke-width="7" fill="none" stroke-linecap="round" style="cursor: pointer;"></path>
  
  <!-- Beach umbrella right -->
  <rect x="330" y="165" width="4" height="50" fill="#DEB887" style="cursor: pointer;"></rect>
  <path d="M290 165 Q332 140 374 165 Z" fill="#FF6B6B" style="cursor: pointer;"></path>
  <path d="M300 165 Q332 145 364 165" stroke="#FFFFFF" stroke-width="3" fill="none" style="cursor: pointer;"></path>
  
  <!-- Distant sailboat -->
  <polygon points="255,105 255,90 265,100" fill="#FFFFFF" style="cursor: pointer;"></polygon>
  <rect x="253" y="105" width="15" height="5" fill="#4A90A4" style="cursor: pointer;"></rect>
</svg>