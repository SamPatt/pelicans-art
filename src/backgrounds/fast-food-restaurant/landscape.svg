<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <!-- Background wall -->
  <rect x="0" y="0" width="400" height="160" fill="#FFF5E6"/>
  
  <!-- Decorative stripe on wall -->
  <rect x="0" y="40" width="400" height="15" fill="#E63946"/>
  <rect x="0" y="55" width="400" height="8" fill="#FFD166"/>
  
  <!-- Menu board -->
  <rect x="120" y="10" width="160" height="70" fill="#2B2D42" rx="3"/>
  <rect x="130" y="18" width="60" height="10" fill="#FFD166"/>
  <rect x="130" y="32" width="45" height="8" fill="#FFFFFF" opacity="0.7"/>
  <rect x="130" y="44" width="50" height="8" fill="#FFFFFF" opacity="0.7"/>
  <rect x="130" y="56" width="40" height="8" fill="#FFFFFF" opacity="0.7"/>
  <rect x="200" y="18" width="60" height="10" fill="#FFD166"/>
  <rect x="200" y="32" width="45" height="8" fill="#FFFFFF" opacity="0.7"/>
  <rect x="200" y="44" width="50" height="8" fill="#FFFFFF" opacity="0.7"/>
  <rect x="200" y="56" width="40" height="8" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Counter -->
  <rect x="0" y="130" width="400" height="40" fill="#8D6E63"/>
  <rect x="0" y="125" width="400" height="10" fill="#A1887F"/>
  
  <!-- Counter front panel -->
  <rect x="0" y="135" width="400" height="35" fill="#6D4C41"/>
  <rect x="30" y="140" width="80" height="25" fill="#5D4037" rx="2"/>
  <rect x="290" y="140" width="80" height="25" fill="#5D4037" rx="2"/>
  
  <!-- Cash register -->
  <rect x="320" y="95" width="50" height="35" fill="#4A4A4A" rx="3"/>
  <rect x="325" y="100" width="40" height="15" fill="#7CB342"/>
  <rect x="325" y="118" width="40" height="8" fill="#616161"/>
  
  <!-- Drink dispenser -->
  <rect x="30" y="85" width="60" height="45" fill="#B0BEC5" rx="2"/>
  <rect x="38" y="92" width="12" height="25" fill="#E63946"/>
  <rect x="54" y="92" width="12" height="25" fill="#FFD166"/>
  <rect x="70" y="92" width="12" height="25" fill="#4FC3F7"/>
  <rect x="35" y="120" width="50" height="8" fill="#78909C"/>
  
  <!-- Fry warmer -->
  <rect x="220" y="90" width="55" height="40" fill="#FF8A65" rx="2"/>
  <rect x="225" y="95" width="45" height="25" fill="#FFCC80"/>
  <line x1="230" y1="100" x2="230" y2="115" stroke="#FFB74D" stroke-width="3"/>
  <line x1="240" y1="100" x2="240" y2="115" stroke="#FFB74D" stroke-width="3"/>
  <line x1="250" y1="100" x2="250" y2="115" stroke="#FFB74D" stroke-width="3"/>
  <line x1="260" y1="100" x2="260" y2="115" stroke="#FFB74D" stroke-width="3"/>
  
  <!-- Heat lamp glow -->
  <ellipse cx="247" cy="88" rx="30" ry="8" fill="#FFAB40" opacity="0.3"/>
  
  <!-- Floor -->
  <rect x="0" y="170" width="400" height="55" fill="#FFCCBC"/>
  
  <!-- Floor tiles pattern -->
  <rect x="0" y="170" width="50" height="55" fill="#FFE0B2"/>
  <rect x="100" y="170" width="50" height="55" fill="#FFE0B2"/>
  <rect x="200" y="170" width="50" height="55" fill="#FFE0B2"/>
  <rect x="300" y="170" width="50" height="55" fill="#FFE0B2"/>
  
  <!-- Ceiling lights -->
  <rect x="80" y="0" width="8" height="12" fill="#90A4AE"/>
  <ellipse cx="84" cy="14" rx="12" ry="6" fill="#FFF9C4"/>
  <rect x="200" y="0" width="8" height="12" fill="#90A4AE"/>
  <ellipse cx="204" cy="14" rx="12" ry="6" fill="#FFF9C4"/>
  <rect x="320" y="0" width="8" height="12" fill="#90A4AE"/>
  <ellipse cx="324" cy="14" rx="12" ry="6" fill="#FFF9C4"/>
</svg>