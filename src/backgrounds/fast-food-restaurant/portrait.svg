<svg viewBox="0 0 225 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - wall -->
  <rect x="0" y="0" width="225" height="400" fill="#FFF5E6"/>
  
  <!-- Tile pattern on wall -->
  <rect x="0" y="0" width="225" height="180" fill="#FFE4C4"/>
  <line x1="0" y1="45" x2="225" y2="45" stroke="#FFDAB3" stroke-width="2"/>
  <line x1="0" y1="90" x2="225" y2="90" stroke="#FFDAB3" stroke-width="2"/>
  <line x1="0" y1="135" x2="225" y2="135" stroke="#FFDAB3" stroke-width="2"/>
  
  <!-- Menu board -->
  <rect x="50" y="20" width="125" height="80" fill="#2C1810" rx="3"/>
  <rect x="55" y="25" width="115" height="70" fill="#1A0F0A"/>
  <!-- Menu items -->
  <rect x="60" y="30" width="50" height="8" fill="#FF6B35" rx="2"/>
  <rect x="60" y="42" width="35" height="5" fill="#FFD93D" rx="1"/>
  <rect x="60" y="50" width="40" height="5" fill="#FFD93D" rx="1"/>
  <rect x="60" y="58" width="30" height="5" fill="#FFD93D" rx="1"/>
  <rect x="115" y="30" width="50" height="8" fill="#FF6B35" rx="2"/>
  <rect x="115" y="42" width="38" height="5" fill="#FFD93D" rx="1"/>
  <rect x="115" y="50" width="45" height="5" fill="#FFD93D" rx="1"/>
  <rect x="115" y="58" width="32" height="5" fill="#FFD93D" rx="1"/>
  <!-- Combo pictures -->
  <circle cx="75" cy="78" r="12" fill="#E74C3C"/>
  <circle cx="140" cy="78" r="12" fill="#F39C12"/>
  
  <!-- Hanging lights -->
  <line x1="60" y1="0" x2="60" y2="115" stroke="#333" stroke-width="2"/>
  <circle cx="60" cy="120" r="12" fill="#FFE066"/>
  <ellipse cx="60" cy="120" rx="8" ry="10" fill="#FFF9DB"/>
  
  <line x1="165" y1="0" x2="165" y2="115" stroke="#333" stroke-width="2"/>
  <circle cx="165" cy="120" r="12" fill="#FFE066"/>
  <ellipse cx="165" cy="120" rx="8" ry="10" fill="#FFF9DB"/>
  
  <!-- Counter -->
  <rect x="0" y="260" width="225" height="60" fill="#C0392B"/>
  <rect x="0" y="255" width="225" height="10" fill="#922B21"/>
  <rect x="0" y="315" width="225" height="8" fill="#A93226"/>
  
  <!-- Counter top surface -->
  <rect x="0" y="248" width="225" height="12" fill="#F5F5F5"/>
  <rect x="0" y="248" width="225" height="3" fill="#E0E0E0"/>
  
  <!-- Cash register -->
  <rect x="140" y="200" width="50" height="48" fill="#2C3E50"/>
  <rect x="145" y="205" width="40" height="25" fill="#1ABC9C"/>
  <text x="165" y="222" font-size="12" fill="#0E6251" text-anchor="middle" font-family="Arial">$0.00</text>
  <rect x="148" y="235" width="10" height="8" fill="#34495E" rx="1"/>
  <rect x="161" y="235" width="10" height="8" fill="#34495E" rx="1"/>
  <rect x="174" y="235" width="10" height="8" fill="#34495E" rx="1"/>
  
  <!-- Drink dispenser -->
  <rect x="15" y="185" width="55" height="63" fill="#7F8C8D"/>
  <rect x="20" y="190" width="14" height="35" fill="#E74C3C"/>
  <rect x="36" y="190" width="14" height="35" fill="#F39C12"/>
  <rect x="52" y="190" width="14" height="35" fill="#3498DB"/>
  <rect x="20" y="228" width="14" height="8" fill="#5D6D7E"/>
  <rect x="36" y="228" width="14" height="8" fill="#5D6D7E"/>
  <rect x="52" y="228" width="14" height="8" fill="#5D6D7E"/>
  
  <!-- Tray with food on counter -->
  <ellipse cx="100" cy="245" rx="35" ry="8" fill="#E67E22"/>
  <rect x="80" y="220" width="25" height="25" fill="#F1C40F" rx="3"/>
  <rect x="82" y="215" width="21" height="8" fill="#E74C3C" rx="2"/>
  <ellipse cx="115" cy="235" rx="12" ry="15" fill="#C0392B"/>
  <rect x="108" y="225" width="14" height="8" fill="#F39C12"/>
  
  <!-- Floor -->
  <rect x="0" y="320" width="225" height="80" fill="#D35400"/>
  <!-- Floor tiles pattern -->
  <rect x="0" y="320" width="45" height="40" fill="#E67E22"/>
  <rect x="90" y="320" width="45" height="40" fill="#E67E22"/>
  <rect x="180" y="320" width="45" height="40" fill="#E67E22"/>
  <rect x="45" y="360" width="45" height="40" fill="#E67E22"/>
  <rect x="135" y="360" width="45" height="40" fill="#E67E22"/>
  
  <!-- Stanchion posts for queue -->
  <rect x="30" y="340" width="6" height="50" fill="#BDC3C7"/>
  <ellipse cx="33" cy="340" rx="8" ry="4" fill="#95A5A6"/>
  <rect x="189" y="340" width="6" height="50" fill="#BDC3C7"/>
  <ellipse cx="192" cy="340" rx="8" ry="4" fill="#95A5A6"/>
  <!-- Rope -->
  <path d="M 41 345 Q 112 365 183 345" stroke="#C0392B" stroke-width="4" fill="none"/>
</svg>