<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark walls -->
  <rect x="0" y="0" width="400" height="225" fill="#2a1f1a"/>

  <!-- Wallpaper pattern -->
  <pattern id="gothic-wp" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M15 3 Q18 15 15 27 Q12 15 15 3Z" fill="#32261f" opacity="0.5"/>
    <circle cx="15" cy="15" r="2" fill="#3a2e25" opacity="0.3"/>
  </pattern>
  <rect x="0" y="0" width="400" height="140" fill="url(#gothic-wp)"/>

  <!-- Wainscoting -->
  <rect x="0" y="138" width="400" height="2" fill="#4a3828"/>
  <rect x="0" y="140" width="400" height="45" fill="#241a14"/>
  <!-- Wainscoting panels -->
  <rect x="10" y="145" width="55" height="34" rx="1" fill="none" stroke="#3a2a1e" stroke-width="1.5"/>
  <rect x="75" y="145" width="55" height="34" rx="1" fill="none" stroke="#3a2a1e" stroke-width="1.5"/>
  <rect x="270" y="145" width="55" height="34" rx="1" fill="none" stroke="#3a2a1e" stroke-width="1.5"/>
  <rect x="335" y="145" width="55" height="34" rx="1" fill="none" stroke="#3a2a1e" stroke-width="1.5"/>

  <!-- Floor - dark wood -->
  <rect x="0" y="185" width="400" height="40" fill="#1a120e"/>
  <!-- Floor boards -->
  <g opacity="0.2">
    <line x1="0" y1="195" x2="400" y2="195" stroke="#2a1a14" stroke-width="0.5"/>
    <line x1="0" y1="205" x2="400" y2="205" stroke="#2a1a14" stroke-width="0.5"/>
    <line x1="0" y1="215" x2="400" y2="215" stroke="#2a1a14" stroke-width="0.5"/>
    <line x1="50" y1="185" x2="50" y2="225" stroke="#2a1a14" stroke-width="0.3"/>
    <line x1="120" y1="185" x2="120" y2="225" stroke="#2a1a14" stroke-width="0.3"/>
    <line x1="190" y1="185" x2="190" y2="225" stroke="#2a1a14" stroke-width="0.3"/>
    <line x1="260" y1="185" x2="260" y2="225" stroke="#2a1a14" stroke-width="0.3"/>
    <line x1="330" y1="185" x2="330" y2="225" stroke="#2a1a14" stroke-width="0.3"/>
  </g>

  <!-- Fireplace - center -->
  <rect x="150" y="80" width="100" height="105" fill="#1a1410"/>
  <!-- Fireplace mantle -->
  <rect x="140" y="75" width="120" height="8" rx="2" fill="#3a2a1e"/>
  <rect x="143" y="78" width="114" height="3" fill="#4a3828"/>
  <!-- Fireplace arch -->
  <path d="M165 185 L165 120 Q200 95 235 120 L235 185" fill="#0a0808" stroke="#3a2a1e" stroke-width="2"/>
  <!-- Fire -->
  <ellipse cx="200" cy="175" rx="25" ry="8" fill="#1a3a1a" opacity="0.3"/>
  <path d="M185 180 Q188 155 195 160 Q192 145 200 150 Q198 135 205 145 Q210 140 208 155 Q215 158 212 180Z" fill="#4a8a3a" opacity="0.5"/>
  <path d="M190 180 Q193 162 198 165 Q196 152 202 158 Q207 153 205 165 Q210 168 207 180Z" fill="#6aaa4a" opacity="0.4"/>
  <!-- Eerie green glow from fire -->
  <radialGradient id="fire-glow" cx="200" cy="170" r="80" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#4a8a3a" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#4a8a3a" stop-opacity="0"/>
  </radialGradient>
  <rect x="0" y="0" width="400" height="225" fill="url(#fire-glow)"/>
  <!-- Fireplace logs -->
  <ellipse cx="192" cy="182" rx="12" ry="4" fill="#2a1a10"/>
  <ellipse cx="208" cy="182" rx="10" ry="3.5" fill="#1a1208"/>

  <!-- Mantle decorations -->
  <!-- Skull -->
  <g transform="translate(155, 68)">
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#d8d0c0"/>
    <circle cx="-2" cy="-1" r="1.2" fill="#2a1f1a"/>
    <circle cx="2" cy="-1" r="1.2" fill="#2a1f1a"/>
    <path d="M-2 2 L-1 2.5 L0 2 L1 2.5 L2 2" fill="none" stroke="#2a1f1a" stroke-width="0.5"/>
  </g>
  <!-- Candelabra left -->
  <g transform="translate(175, 72)">
    <rect x="-1" y="0" width="2" height="8" fill="#8a7a4a"/>
    <rect x="-1" y="-4" width="2" height="4" fill="#d8c8a0"/>
    <ellipse cx="0" cy="-5" rx="1.5" ry="2.5" fill="#FFD700" opacity="0.7"/>
    <circle cx="0" cy="-5" r="4" fill="#FFD700" opacity="0.06"/>
  </g>
  <!-- Candelabra right -->
  <g transform="translate(225, 72)">
    <rect x="-1" y="0" width="2" height="8" fill="#8a7a4a"/>
    <rect x="-1" y="-4" width="2" height="4" fill="#d8c8a0"/>
    <ellipse cx="0" cy="-5" rx="1.5" ry="2.5" fill="#FFD700" opacity="0.7"/>
    <circle cx="0" cy="-5" r="4" fill="#FFD700" opacity="0.06"/>
  </g>

  <!-- Gothic chandelier -->
  <g transform="translate(200, 0)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#4a3828" stroke-width="1.5"/>
    <ellipse cx="0" cy="24" rx="20" ry="6" fill="none" stroke="#4a3828" stroke-width="1.5"/>
    <!-- Chandelier arms -->
    <line x1="-18" y1="24" x2="-18" y2="18" stroke="#4a3828" stroke-width="1"/>
    <line x1="-9" y1="22" x2="-9" y2="16" stroke="#4a3828" stroke-width="1"/>
    <line x1="9" y1="22" x2="9" y2="16" stroke="#4a3828" stroke-width="1"/>
    <line x1="18" y1="24" x2="18" y2="18" stroke="#4a3828" stroke-width="1"/>
    <!-- Candle flames -->
    <ellipse cx="-18" cy="16" rx="1.5" ry="2.5" fill="#FFD700" opacity="0.8"/>
    <ellipse cx="-9" cy="14" rx="1.5" ry="2.5" fill="#FFD700" opacity="0.8"/>
    <ellipse cx="9" cy="14" rx="1.5" ry="2.5" fill="#FFD700" opacity="0.8"/>
    <ellipse cx="18" cy="16" rx="1.5" ry="2.5" fill="#FFD700" opacity="0.8"/>
    <!-- Glow -->
    <ellipse cx="0" cy="20" rx="35" ry="18" fill="#FFD700" opacity="0.04"/>
  </g>

  <!-- Portrait left - vampire ancestor -->
  <rect x="20" y="25" width="40" height="50" rx="2" fill="#5a4a30"/>
  <rect x="23" y="28" width="34" height="44" fill="#1a1520"/>
  <!-- Simple portrait figure -->
  <ellipse cx="40" cy="42" rx="6" ry="7" fill="#6a5a6a"/>
  <rect x="33" y="52" width="14" height="16" fill="#2a0a0a"/>
  <!-- Portrait frame detail -->
  <rect x="20" y="25" width="40" height="50" rx="2" fill="none" stroke="#6a5a38" stroke-width="1.5"/>

  <!-- Portrait right - witch ancestor -->
  <rect x="340" y="30" width="40" height="45" rx="2" fill="#5a4a30"/>
  <rect x="343" y="33" width="34" height="39" fill="#1a1820"/>
  <ellipse cx="360" cy="46" rx="6" ry="7" fill="#6a7a6a"/>
  <polygon points="354,40 360,28 366,40" fill="#1a1a1a"/>
  <rect x="340" y="30" width="40" height="45" rx="2" fill="none" stroke="#6a5a38" stroke-width="1.5"/>

  <!-- Armchair left -->
  <g transform="translate(30, 155)">
    <rect x="0" y="8" width="35" height="28" rx="3" fill="#4a2028"/>
    <rect x="-4" y="0" width="8" height="36" rx="3" fill="#5a2830"/>
    <rect x="31" y="0" width="8" height="36" rx="3" fill="#5a2830"/>
    <!-- Cushion -->
    <ellipse cx="17" cy="18" rx="12" ry="6" fill="#5a2830" opacity="0.6"/>
  </g>

  <!-- Armchair right -->
  <g transform="translate(335, 155)">
    <rect x="0" y="8" width="35" height="28" rx="3" fill="#4a2028"/>
    <rect x="-4" y="0" width="8" height="36" rx="3" fill="#5a2830"/>
    <rect x="31" y="0" width="8" height="36" rx="3" fill="#5a2830"/>
    <ellipse cx="17" cy="18" rx="12" ry="6" fill="#5a2830" opacity="0.6"/>
  </g>

  <!-- Cobweb top-left corner -->
  <g opacity="0.25">
    <path d="M0 0 Q15 15 30 5" fill="none" stroke="#aaa" stroke-width="0.3"/>
    <path d="M0 0 Q10 20 5 35" fill="none" stroke="#aaa" stroke-width="0.3"/>
    <path d="M0 0 Q20 10 25 25" fill="none" stroke="#aaa" stroke-width="0.3"/>
    <path d="M5 5 Q15 8 20 15" fill="none" stroke="#aaa" stroke-width="0.2"/>
    <path d="M10 3 Q12 12 5 18" fill="none" stroke="#aaa" stroke-width="0.2"/>
  </g>

  <!-- Cobweb top-right corner -->
  <g opacity="0.25" transform="translate(400, 0) scale(-1, 1)">
    <path d="M0 0 Q15 15 30 5" fill="none" stroke="#aaa" stroke-width="0.3"/>
    <path d="M0 0 Q10 20 5 35" fill="none" stroke="#aaa" stroke-width="0.3"/>
    <path d="M0 0 Q20 10 25 25" fill="none" stroke="#aaa" stroke-width="0.3"/>
    <path d="M5 5 Q15 8 20 15" fill="none" stroke="#aaa" stroke-width="0.2"/>
    <path d="M10 3 Q12 12 5 18" fill="none" stroke="#aaa" stroke-width="0.2"/>
  </g>

  <!-- Dusty rug on floor -->
  <ellipse cx="200" cy="205" rx="80" ry="15" fill="#3a1a1a" opacity="0.3"/>
  <ellipse cx="200" cy="205" rx="75" ry="13" fill="none" stroke="#4a2a2a" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="200" cy="205" rx="60" ry="10" fill="none" stroke="#4a2a2a" stroke-width="0.5" opacity="0.2"/>
</svg>