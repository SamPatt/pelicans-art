<svg viewBox="0 0 225 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall background -->
  <rect x="0" y="0" width="225" height="400" fill="#E8DDD4"/>
  
  <!-- Accent wall stripe -->
  <rect x="0" y="0" width="225" height="180" fill="#C9B8A8"/>
  
  <!-- Window -->
  <rect x="130" y="30" width="70" height="90" fill="#87CEEB" stroke="#8B7355" stroke-width="6"/>
  <line x1="165" y1="30" x2="165" y2="120" stroke="#8B7355" stroke-width="4"/>
  <line x1="130" y1="75" x2="200" y2="75" stroke="#8B7355" stroke-width="4"/>
  <!-- Curtain -->
  <path d="M125 25 Q135 60 125 120 L125 25" fill="#D4A574" opacity="0.8"/>
  <path d="M205 25 Q195 60 205 120 L205 25" fill="#D4A574" opacity="0.8"/>
  
  <!-- Framed picture -->
  <rect x="25" y="45" width="50" height="40" fill="#F5E6D3" stroke="#5D4E37" stroke-width="4"/>
  <circle cx="50" cy="60" r="10" fill="#7CB342"/>
  <rect x="35" y="68" width="30" height="8" fill="#8D6E63"/>
  
  <!-- Bookshelf -->
  <rect x="10" y="140" width="55" height="100" fill="#8B7355"/>
  <rect x="14" y="145" width="47" height="28" fill="#6D5D4E"/>
  <rect x="14" y="178" width="47" height="28" fill="#6D5D4E"/>
  <rect x="14" y="211" width="47" height="24" fill="#6D5D4E"/>
  <!-- Books -->
  <rect x="17" y="148" width="8" height="22" fill="#E57373"/>
  <rect x="26" y="150" width="7" height="20" fill="#64B5F6"/>
  <rect x="34" y="147" width="9" height="23" fill="#81C784"/>
  <rect x="44" y="149" width="6" height="21" fill="#FFB74D"/>
  <rect x="17" y="182" width="10" height="20" fill="#BA68C8"/>
  <rect x="28" y="181" width="8" height="21" fill="#4DB6AC"/>
  <rect x="37" y="183" width="7" height="19" fill="#F06292"/>
  <!-- Plant on shelf -->
  <ellipse cx="52" cy="230" rx="8" ry="5" fill="#5D4037"/>
  <ellipse cx="52" cy="222" rx="10" ry="12" fill="#66BB6A"/>
  
  <!-- Couch -->
  <rect x="80" y="200" width="130" height="60" rx="8" fill="#6B8E7B"/>
  <rect x="85" y="205" width="55" height="45" rx="5" fill="#5A7D6A"/>
  <rect x="145" y="205" width="55" height="45" rx="5" fill="#5A7D6A"/>
  <!-- Couch pillows -->
  <ellipse cx="105" cy="220" rx="18" ry="14" fill="#F4A460"/>
  <ellipse cx="175" cy="218" rx="16" ry="13" fill="#DEB887"/>
  <!-- Couch arm -->
  <rect x="200" y="195" width="18" height="65" rx="5" fill="#5A7D6A"/>
  <rect x="72" y="195" width="18" height="65" rx="5" fill="#5A7D6A"/>
  
  <!-- Coffee table -->
  <rect x="95" y="275" width="70" height="8" rx="2" fill="#A1887F"/>
  <rect x="100" y="283" width="5" height="20" fill="#8D6E63"/>
  <rect x="155" y="283" width="5" height="20" fill="#8D6E63"/>
  <!-- Items on table -->
  <ellipse cx="115" cy="273" rx="12" ry="3" fill="#FFCC80"/>
  <rect x="140" y="268" width="15" height="10" rx="1" fill="#90A4AE"/>
  
  <!-- Floor lamp -->
  <rect x="15" y="250" width="6" height="95" fill="#5D4037"/>
  <ellipse cx="18" cy="345" rx="12" ry="4" fill="#4E342E"/>
  <path d="M5 250 Q18 235 31 250 L31 260 Q18 250 5 260 Z" fill="#FFECB3"/>
  
  <!-- Rug -->
  <ellipse cx="130" cy="340" rx="70" ry="25" fill="#B39DDB"/>
  <ellipse cx="130" cy="340" rx="50" ry="17" fill="#9575CD"/>
  <ellipse cx="130" cy="340" rx="25" ry="8" fill="#7E57C2"/>
  
  <!-- Floor -->
  <rect x="0" y="355" width="225" height="45" fill="#D7CCC8"/>
  <!-- Floor boards -->
  <line x1="0" y1="370" x2="225" y2="370" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="0" y1="385" x2="225" y2="385" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="45" y1="355" x2="45" y2="400" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="90" y1="355" x2="90" y2="400" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="135" y1="355" x2="135" y2="400" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="180" y1="355" x2="180" y2="400" stroke="#BCAAA4" stroke-width="1"/>
  
  <!-- Baseboard -->
  <rect x="0" y="350" width="225" height="6" fill="#8D6E63"/>
</svg>