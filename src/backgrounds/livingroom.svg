<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Wall -->
  <rect x="0" y="0" width="800" height="320" fill="#fff3e0"/>
  <!-- Floor -->
  <rect x="0" y="320" width="800" height="130" fill="#8d6e63"/>
  <!-- Baseboard -->
  <rect x="0" y="310" width="800" height="15" fill="#5d4037"/>
  <!-- Couch -->
  <rect x="80" y="250" width="280" height="80" fill="#5c6bc0" rx="10"/>
  <rect x="80" y="240" width="280" height="30" fill="#7986cb" rx="8"/>
  <rect x="70" y="250" width="30" height="70" fill="#3f51b5" rx="5"/>
  <rect x="340" y="250" width="30" height="70" fill="#3f51b5" rx="5"/>
  <!-- Cushions -->
  <ellipse cx="140" cy="280" rx="35" ry="25" fill="#7986cb"/>
  <ellipse cx="220" cy="280" rx="35" ry="25" fill="#7986cb"/>
  <ellipse cx="300" cy="280" rx="35" ry="25" fill="#7986cb"/>
  <!-- TV -->
  <rect x="500" y="120" width="220" height="130" fill="#212121"/>
  <rect x="510" y="130" width="200" height="110" fill="#4fc3f7"/>
  <rect x="590" y="250" width="40" height="50" fill="#424242"/>
  <rect x="560" y="295" width="100" height="10" fill="#616161"/>
  <!-- Lamp -->
  <rect x="430" y="200" width="15" height="120" fill="#8d6e63"/>
  <polygon points="395,200 480,200 460,140 415,140" fill="#ffcc80"/>
  <!-- Picture -->
  <rect x="200" y="60" width="120" height="90" fill="#5d4037" stroke="#3e2723" stroke-width="5"/>
  <rect x="210" y="70" width="100" height="70" fill="#81d4fa"/>
  <circle cx="260" cy="100" r="15" fill="#fff176"/>
  <!-- Rug -->
  <ellipse cx="250" cy="380" rx="180" ry="50" fill="#e57373"/>
  <ellipse cx="250" cy="380" rx="140" ry="35" fill="#ef5350"/>
</svg>
