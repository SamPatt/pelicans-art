<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Sky -->
  <rect x="0" y="0" width="800" height="300" fill="#87ceeb"/>
  <!-- Sun -->
  <circle cx="650" cy="80" r="50" fill="#fff176"/>
  <!-- Clouds -->
  <ellipse cx="150" cy="80" rx="60" ry="30" fill="white"/>
  <ellipse cx="200" cy="70" rx="40" ry="25" fill="white"/>
  <ellipse cx="500" cy="100" rx="50" ry="25" fill="white"/>
  <!-- Grass -->
  <rect x="0" y="280" width="800" height="170" fill="#4caf50"/>
  <!-- Path -->
  <ellipse cx="400" cy="450" rx="300" ry="100" fill="#8d6e63"/>
  <!-- Trees -->
  <rect x="50" y="180" width="30" height="120" fill="#5d4037"/>
  <ellipse cx="65" cy="160" rx="50" ry="60" fill="#2e7d32"/>
  <rect x="700" y="200" width="25" height="100" fill="#5d4037"/>
  <ellipse cx="712" cy="180" rx="40" ry="50" fill="#388e3c"/>
  <!-- Bench -->
  <rect x="320" y="320" width="160" height="10" fill="#6d4c41"/>
  <rect x="330" y="330" width="10" height="30" fill="#5d4037"/>
  <rect x="460" y="330" width="10" height="30" fill="#5d4037"/>
  <rect x="320" y="290" width="160" height="8" fill="#6d4c41"/>
  <!-- Bush -->
  <ellipse cx="600" cy="340" rx="40" ry="30" fill="#388e3c"/>
  <ellipse cx="200" cy="350" rx="35" ry="25" fill="#43a047"/>
</svg>
