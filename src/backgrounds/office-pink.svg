<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Pink office wall background like the comic -->
  <rect width="800" height="450" fill="#f5d5d5"/>
  
  <!-- Floor -->
  <rect y="380" width="800" height="70" fill="#d4c4b0"/>
  
  <!-- Subtle wall texture/gradient -->
  <rect width="800" height="380" fill="url(#wallGrad)" opacity="0.3"/>
  
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Simple office elements -->
  <!-- Clock on wall -->
  <circle cx="650" cy="100" r="35" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <circle cx="650" cy="100" r="3" fill="#333"/>
  <line x1="650" y1="100" x2="650" y2="75" stroke="#333" stroke-width="2"/>
  <line x1="650" y1="100" x2="665" y2="105" stroke="#333" stroke-width="2"/>
  
  <!-- Simple desk hint on right -->
  <rect x="550" y="300" width="250" height="80" fill="#8b7355"/>
  <rect x="550" y="295" width="250" height="8" fill="#6b5344"/>
</svg>
