<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Space background -->
  <rect x="0" y="0" width="800" height="450" fill="#0a0a20"/>
  <!-- Stars -->
  <circle cx="50" cy="30" r="2" fill="white"/>
  <circle cx="150" cy="80" r="1.5" fill="white"/>
  <circle cx="250" cy="50" r="2" fill="white"/>
  <circle cx="350" cy="120" r="1" fill="white"/>
  <circle cx="450" cy="40" r="2.5" fill="white"/>
  <circle cx="550" cy="90" r="1.5" fill="white"/>
  <circle cx="650" cy="60" r="2" fill="white"/>
  <circle cx="750" cy="100" r="1" fill="white"/>
  <circle cx="100" cy="150" r="1.5" fill="white"/>
  <circle cx="300" cy="200" r="2" fill="white"/>
  <circle cx="500" cy="180" r="1" fill="white"/>
  <circle cx="700" cy="220" r="2" fill="white"/>
  <circle cx="200" cy="250" r="1.5" fill="white"/>
  <circle cx="600" cy="280" r="2" fill="white"/>
  <!-- Planet -->
  <circle cx="680" cy="350" r="80" fill="#ff7043"/>
  <ellipse cx="680" cy="350" rx="100" ry="15" fill="#ffab91" opacity="0.5"/>
  <!-- Spaceship floor -->
  <rect x="0" y="380" width="800" height="70" fill="#37474f"/>
  <rect x="0" y="375" width="800" height="8" fill="#546e7a"/>
  <!-- Windows -->
  <ellipse cx="150" cy="200" rx="80" ry="100" fill="#1a237e" stroke="#546e7a" stroke-width="10"/>
  <ellipse cx="150" cy="200" rx="60" ry="80" fill="#0a0a20"/>
  <!-- Control panel -->
  <rect x="500" y="320" width="200" height="60" fill="#263238"/>
  <rect x="510" cy="330" width="40" height="20" fill="#4caf50"/>
  <rect x="560" cy="330" width="40" height="20" fill="#f44336"/>
  <circle cx="640" cy="345" r="15" fill="#2196f3"/>
</svg>
