<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouth Animation Test</title>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }
    h1 { color: #e94560; margin-bottom: 10px; }
    h3 { color: #4ecca3; margin-bottom: 10px; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .panel {
      background: #16213e;
      border-radius: 10px;
      padding: 15px;
      min-width: 280px;
    }
    canvas {
      background: #0d0d1a;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }
    input[type="file"] {
      margin-bottom: 15px;
      padding: 10px;
      background: #0d0d1a;
      border: 2px dashed #0f3460;
      border-radius: 8px;
      color: #eee;
      width: 100%;
    }
    .controls { margin-top: 10px; }
    .control-group { margin-bottom: 10px; }
    .control-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
    .control-group input[type="range"] { width: 100%; }
    button {
      background: #e94560;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
      font-size: 0.9em;
    }
    button:hover { background: #ff6b8a; }
    button.active { background: #4ecca3; }
    .status { color: #4ecca3; margin: 10px 0; font-size: 0.9em; }
    .comparison { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px; }
    .method { text-align: center; }
    .method-label { 
      background: #0f3460; 
      padding: 5px 10px; 
      border-radius: 5px; 
      margin-bottom: 10px;
      display: inline-block;
    }
  </style>
<script defer src="/js/site-analytics.js"></script>
</head>
<body>
  <h1>🎭 Mouth Animation Comparison</h1>
  
  <div class="container">
    <div class="panel">
      <h3>📷 Upload Photo</h3>
      <input type="file" id="photo-upload" accept="image/*">
      <canvas id="source-canvas" width="250" height="300"></canvas>
      <div id="status" class="status">Upload a photo to begin</div>
    </div>
    
    <div class="panel">
      <h3>🎚️ Controls</h3>
      <div class="controls">
        <div class="control-group">
          <label>Mouth Open: <span id="mouth-val">0</span>%</label>
          <input type="range" id="mouth-open" min="0" max="100" value="0" oninput="updateAll()">
        </div>
        <div style="margin: 15px 0;">
          <button onclick="animateTalk()">🗣️ Simulate Talking</button>
          <button onclick="stopAnim()">⏹️ Stop</button>
        </div>
        <div>
          <button onclick="setMouth(0)">😐 Closed</button>
          <button onclick="setMouth(30)">😮 Slight</button>
          <button onclick="setMouth(60)">😲 Open</button>
          <button onclick="setMouth(100)">😱 Wide</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="comparison">
    <div class="method">
      <div class="method-label">Method 1: Sprite Swap</div>
      <canvas id="sprite-canvas" width="250" height="300"></canvas>
      <div style="font-size: 0.8em; color: #888;">Cartoon mouth overlays</div>
    </div>
    
    <div class="method">
      <div class="method-label">Method 2: Jaw Puppet</div>
      <canvas id="jaw-canvas" width="250" height="300"></canvas>
      <div style="font-size: 0.8em; color: #888;">Rotating jaw cutout</div>
    </div>
  </div>

  <script>
    let sourceImage = null;
    let landmarks = null;
    let animInterval = null;
    
    const sourceCanvas = document.getElementById('source-canvas');
    const sourceCtx = sourceCanvas.getContext('2d');
    const spriteCanvas = document.getElementById('sprite-canvas');
    const spriteCtx = spriteCanvas.getContext('2d');
    const jawCanvas = document.getElementById('jaw-canvas');
    const jawCtx = jawCanvas.getContext('2d');
    
    // Image positioning
    let imgX = 0, imgY = 0, imgW = 0, imgH = 0, scale = 1;
    
    // Load face-api
    async function loadModels() {
      document.getElementById('status').textContent = 'Loading face detection...';
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)
      ]);
      document.getElementById('status').textContent = 'Ready. Upload a photo.';
    }
    
    // Handle upload
    document.getElementById('photo-upload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const img = new Image();
      img.onload = async () => {
        sourceImage = img;
        
        // Scale to fit
        scale = Math.min(sourceCanvas.width / img.width, sourceCanvas.height / img.height);
        imgW = img.width * scale;
        imgH = img.height * scale;
        imgX = (sourceCanvas.width - imgW) / 2;
        imgY = (sourceCanvas.height - imgH) / 2;
        
        // Draw source
        sourceCtx.fillStyle = '#0d0d1a';
        sourceCtx.fillRect(0, 0, sourceCanvas.width, sourceCanvas.height);
        sourceCtx.drawImage(img, imgX, imgY, imgW, imgH);
        
        document.getElementById('status').textContent = 'Detecting face...';
        
        // Detect
        const detection = await faceapi.detectSingleFace(sourceCanvas, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks();
        
        if (!detection) {
          document.getElementById('status').textContent = 'No face found. Try another photo.';
          return;
        }
        
        landmarks = detection.landmarks.positions.map(p => ({ x: p.x, y: p.y }));
        
        // Draw landmark dots on source
        sourceCtx.fillStyle = '#4ecca3';
        landmarks.forEach(p => {
          sourceCtx.beginPath();
          sourceCtx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          sourceCtx.fill();
        });
        
        document.getElementById('status').textContent = 'Face detected! Try the controls.';
        updateAll();
      };
      img.src = URL.createObjectURL(file);
    });
    
    function setMouth(val) {
      document.getElementById('mouth-open').value = val;
      updateAll();
    }
    
    function updateAll() {
      const mouthOpen = parseInt(document.getElementById('mouth-open').value);
      document.getElementById('mouth-val').textContent = mouthOpen;
      
      if (!sourceImage || !landmarks) return;
      
      renderSpriteSwap(mouthOpen);
      renderJawPuppet(mouthOpen);
    }
    
    // ==========================================
    // METHOD 1: Sprite Swap
    // ==========================================
    function renderSpriteSwap(mouthOpen) {
      // Draw base image
      spriteCtx.fillStyle = '#0d0d1a';
      spriteCtx.fillRect(0, 0, spriteCanvas.width, spriteCanvas.height);
      spriteCtx.drawImage(sourceImage, imgX, imgY, imgW, imgH);
      
      // Get mouth position from landmarks
      // 48 = left corner, 54 = right corner, 51 = top center, 57 = bottom center
      const left = landmarks[48];
      const right = landmarks[54];
      const top = landmarks[51];
      const bottom = landmarks[57];
      
      const centerX = (left.x + right.x) / 2;
      const centerY = (top.y + bottom.y) / 2;
      const width = (right.x - left.x) * 1.3;
      const height = (bottom.y - top.y) * 1.5;
      
      // Cover original mouth with skin-colored ellipse
      // Sample skin color from cheek
      const cheekX = Math.floor((landmarks[36].x + landmarks[48].x) / 2);
      const cheekY = Math.floor((landmarks[36].y + landmarks[48].y) / 2);
      const pixel = spriteCtx.getImageData(cheekX, cheekY, 1, 1).data;
      const skinColor = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
      
      // Draw skin patch over mouth
      spriteCtx.fillStyle = skinColor;
      spriteCtx.beginPath();
      spriteCtx.ellipse(centerX, centerY, width / 2, height / 2, 0, 0, Math.PI * 2);
      spriteCtx.fill();
      
      // Draw cartoon mouth based on openness
      drawCartoonMouth(spriteCtx, centerX, centerY, width, mouthOpen);
    }
    
    function drawCartoonMouth(ctx, cx, cy, width, openness) {
      const w = width * 0.7;
      
      if (openness < 15) {
        // Closed - simple line/slight smile
        ctx.strokeStyle = '#4a2020';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - w/2, cy);
        ctx.quadraticCurveTo(cx, cy + 3, cx + w/2, cy);
        ctx.stroke();
      } else if (openness < 40) {
        // Slightly open - small oval
        const h = 5 + openness * 0.15;
        ctx.fillStyle = '#2a0a0a';
        ctx.beginPath();
        ctx.ellipse(cx, cy, w/3, h, 0, 0, Math.PI * 2);
        ctx.fill();
        // Lips
        ctx.strokeStyle = '#8b4a4a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, w/3 + 2, h + 2, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (openness < 70) {
        // Open - medium oval with hint of teeth
        const h = 8 + openness * 0.2;
        // Dark interior
        ctx.fillStyle = '#1a0505';
        ctx.beginPath();
        ctx.ellipse(cx, cy, w/2.5, h, 0, 0, Math.PI * 2);
        ctx.fill();
        // Teeth hint (top)
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(cx - w/4, cy - h + 2, w/2, 4);
        // Lip outline
        ctx.strokeStyle = '#9b5a5a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(cx, cy, w/2.5 + 2, h + 2, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        // Wide open - big oval, teeth, maybe tongue
        const h = 15 + openness * 0.15;
        // Dark interior
        ctx.fillStyle = '#0d0000';
        ctx.beginPath();
        ctx.ellipse(cx, cy, w/2, h, 0, 0, Math.PI * 2);
        ctx.fill();
        // Teeth (top row)
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(cx - w/3, cy - h + 3, w/1.5, 5);
        // Tongue hint
        ctx.fillStyle = '#c44';
        ctx.beginPath();
        ctx.ellipse(cx, cy + h/2, w/4, h/3, 0, 0, Math.PI);
        ctx.fill();
        // Lip outline
        ctx.strokeStyle = '#a06060';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, w/2 + 3, h + 3, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    
    // ==========================================
    // METHOD 2: Jaw Puppet
    // ==========================================
    function renderJawPuppet(mouthOpen) {
      jawCtx.fillStyle = '#0d0d1a';
      jawCtx.fillRect(0, 0, jawCanvas.width, jawCanvas.height);
      
      // Pivot point - between the lips
      // Use landmarks: 51 (top lip center), 57 (bottom lip center)
      const pivotY = (landmarks[51].y + landmarks[57].y) / 2; // Center of lips
      const leftPivotX = landmarks[3].x;
      const rightPivotX = landmarks[13].x;
      const pivotX = (leftPivotX + rightPivotX) / 2;
      
      // Rotation angle based on mouth open (max ~15 degrees)
      const angle = (mouthOpen / 100) * 12 * (Math.PI / 180);
      
      // Draw upper face (above pivot) - stays still
      jawCtx.save();
      jawCtx.beginPath();
      jawCtx.rect(0, 0, jawCanvas.width, pivotY);
      jawCtx.clip();
      jawCtx.drawImage(sourceImage, imgX, imgY, imgW, imgH);
      jawCtx.restore();
      
      // Draw lower face (below pivot) - rotates down
      jawCtx.save();
      
      // Move origin to pivot point, rotate, draw, restore
      jawCtx.translate(pivotX, pivotY);
      jawCtx.rotate(angle);
      jawCtx.translate(-pivotX, -pivotY);
      
      // Clip to lower region
      jawCtx.beginPath();
      jawCtx.rect(0, pivotY - 5, jawCanvas.width, jawCanvas.height - pivotY + 10);
      jawCtx.clip();
      
      jawCtx.drawImage(sourceImage, imgX, imgY, imgW, imgH);
      jawCtx.restore();
      
      // Draw dark mouth interior in the gap
      if (mouthOpen > 10) {
        const gapHeight = Math.sin(angle) * (landmarks[8].y - pivotY) * 0.5;
        const mouthCenterX = (landmarks[48].x + landmarks[54].x) / 2;
        const mouthWidth = (landmarks[54].x - landmarks[48].x) * 0.8;
        
        jawCtx.fillStyle = '#1a0505';
        jawCtx.beginPath();
        jawCtx.ellipse(mouthCenterX, pivotY + gapHeight/2, mouthWidth/2, gapHeight/2 + 2, 0, 0, Math.PI * 2);
        jawCtx.fill();
      }
    }
    
    // ==========================================
    // Animation
    // ==========================================
    function animateTalk() {
      stopAnim();
      let frame = 0;
      animInterval = setInterval(() => {
        // Simulate talking with random-ish mouth movement
        const patterns = [0, 30, 10, 50, 20, 40, 15, 60, 25, 35, 5, 45];
        const val = patterns[frame % patterns.length];
        document.getElementById('mouth-open').value = val;
        updateAll();
        frame++;
      }, 100);
    }
    
    function stopAnim() {
      if (animInterval) {
        clearInterval(animInterval);
        animInterval = null;
      }
    }
    
    // Init
    loadModels();
  </script>
</body>
</html>
