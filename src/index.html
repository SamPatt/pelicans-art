<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Improv Theater</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0f;
      color: #eee;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    
    h1 {
      color: #e94560;
      margin-bottom: 5px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
    
    .stage-container {
      background: #1a1a2e;
      border: 3px solid #e94560;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    
    #stage {
      display: block;
    }
    
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    
    .loading-overlay.hidden {
      display: none;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #333;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: #e94560;
      font-size: 14px;
      margin-bottom: 10px;
    }
    
    .loading-progress {
      width: 300px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }
    
    .loading-progress-fill {
      height: 100%;
      background: #e94560;
      width: 0%;
      transition: width 0.3s;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      align-items: center;
    }
    
    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #ff6b6b;
    }
    
    button:disabled {
      background: #444;
      cursor: not-allowed;
    }
    
    .time-display {
      background: #16213e;
      padding: 10px 15px;
      border-radius: 5px;
      min-width: 120px;
      text-align: center;
    }
    
    .progress-container {
      margin-top: 15px;
      width: 800px;
    }
    
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #16213e;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
    }
    
    .progress-fill {
      height: 100%;
      background: #e94560;
      width: 0%;
      transition: width 0.1s linear;
    }
    
    .script-info {
      margin-top: 20px;
      padding: 15px;
      background: #16213e;
      border-radius: 5px;
      max-width: 800px;
    }
    
    .script-info h3 {
      color: #e94560;
      margin-bottom: 10px;
    }
    
    .script-selector {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    
    .script-selector button {
      background: #16213e;
      border: 1px solid #e94560;
    }
    
    .script-selector button.active {
      background: #e94560;
    }
    
    .audio-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 15px;
      color: #888;
      font-size: 13px;
    }
    
    .audio-toggle input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .voice-info {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>🎭 AI Improv Theater</h1>
  <p class="subtitle">where AIs perform questionable comedy</p>
  
  <div class="stage-container">
    <canvas id="stage" width="800" height="450"></canvas>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loadingText">Generating voices...</div>
      <div class="loading-progress">
        <div class="loading-progress-fill" id="loadingProgressFill"></div>
      </div>
    </div>
  </div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
  
  <div class="controls">
    <button id="playBtn" disabled>▶ Play</button>
    <button id="stopBtn">⬛ Stop</button>
    <div class="time-display">
      <span id="currentTime">0.0</span>s / <span id="totalTime">0</span>s
    </div>
    <div class="audio-toggle">
      <input type="checkbox" id="audioEnabled" checked>
      <label for="audioEnabled">🔊 Audio</label>
    </div>
  </div>
  
  <div class="script-selector">
    <button id="script1Btn" class="active">The Performance Review</button>
    <button id="script2Btn">Existential Kitchen</button>
  </div>
  
  <div class="script-info">
    <h3 id="scriptTitle">Loading...</h3>
    <p id="scriptDesc"></p>
    <p class="voice-info" id="voiceInfo"></p>
  </div>

  <script src="renderer.js"></script>
  <script src="audio-manager.js"></script>
  <script>
    // Test scripts from our AI generation
    const scripts = {
      performanceReview: {
        meta: { title: "The Performance Review", duration: 18 },
        stage: { background: "office", width: 800, height: 450 },
        cast: {
          boss: { sprite: "woman_business", startPos: [600, 320] },
          employee: { sprite: "man_suit", startPos: [-100, 320] }
        },
        props: {
          sword: { sprite: "sword", visible: false }
        },
        script: [
          { t: 0, do: "enter", who: "employee", from: "left" },
          { t: 1.5, do: "say", who: "boss", line: "Have a seat. Let's discuss your performance.", duration: 2.5 },
          { t: 4.5, do: "emote", who: "employee", emotion: "confused" },
          { t: 5, do: "say", who: "employee", line: "I don't work here.", duration: 2 },
          { t: 7.5, do: "say", who: "boss", line: "Exactly. That's the problem.", duration: 2 },
          { t: 10, do: "emote", who: "employee", emotion: "shocked" },
          { t: 10.5, do: "spawn", what: "sword", at: [620, 300] },
          { t: 11, do: "say", who: "boss", line: "We're letting you go.", duration: 2 },
          { t: 13.5, do: "emote", who: "boss", emotion: "happy" },
          { t: 14, do: "move", who: "boss", to: [400, 320], duration: 1 },
          { t: 14.5, do: "emote", who: "employee", emotion: "shocked" },
          { t: 15, do: "exit", who: "employee", to: "right" },
          { t: 16.5, do: "say", who: "boss", line: "Same time next week.", duration: 1.5 }
        ],
        description: "Being fired from a job you don't have. The sword is never addressed."
      },
      
      existentialKitchen: {
        meta: { title: "Existential Kitchen", duration: 16 },
        stage: { background: "kitchen", width: 800, height: 450 },
        cast: {
          human: { sprite: "man_casual", startPos: [200, 320] },
          cat: { sprite: "cat", startPos: [500, 340] }
        },
        props: {
          banana: { sprite: "banana", visible: false }
        },
        script: [
          { t: 0, do: "say", who: "human", line: "I should eat something healthy.", duration: 2 },
          { t: 2, do: "spawn", what: "banana", at: [350, 350] },
          { t: 2.5, do: "move", who: "human", to: [320, 320], duration: 1 },
          { t: 3.5, do: "say", who: "cat", line: "Don't.", duration: 1 },
          { t: 4.5, do: "emote", who: "human", emotion: "shocked" },
          { t: 5, do: "say", who: "human", line: "You can talk?!", duration: 1.5 },
          { t: 6.5, do: "say", who: "cat", line: "You can hear?", duration: 1.5 },
          { t: 8, do: "emote", who: "cat", emotion: "confused" },
          { t: 8.5, do: "say", who: "cat", line: "This has never happened before.", duration: 2 },
          { t: 10.5, do: "despawn", what: "banana" },
          { t: 10.5, do: "say", who: "human", line: "Where did the banana go?", duration: 1.5 },
          { t: 12, do: "say", who: "cat", line: "We don't talk about the banana.", duration: 2 },
          { t: 12.5, do: "emote", who: "cat", emotion: "angry" }
        ],
        description: "The cat has been talking this whole time. The banana knows too much."
      }
    };
    
    // Initialize renderer
    const canvas = document.getElementById('stage');
    const renderer = new SkitRenderer(canvas, {
      onTimeUpdate: (time) => {
        document.getElementById('currentTime').textContent = time.toFixed(1);
        const duration = renderer.script?.meta?.duration || 1;
        document.getElementById('progressFill').style.width = (time / duration * 100) + '%';
        
        // Trigger audio playback
        if (audioEnabled && audioManager) {
          audioManager.playAudioAt(time);
        }
      },
      onEnd: () => {
        document.getElementById('playBtn').textContent = '▶ Play';
        // Delay stopping audio so final line can finish
        if (audioManager) {
          setTimeout(() => {
            audioManager.stopAll();
            audioManager.resetTriggers();
          }, 3000);  // 3 second grace period for final audio
        }
      }
    });
    
    // Initialize audio manager
    const audioManager = new AudioManager({
      onProgress: (completed, total, message) => {
        document.getElementById('loadingText').textContent = message;
        document.getElementById('loadingProgressFill').style.width = (completed / total * 100) + '%';
      },
      onReady: () => {
        document.getElementById('loadingOverlay').classList.add('hidden');
        document.getElementById('playBtn').disabled = false;
      }
    });
    
    let currentScript = 'performanceReview';
    let audioEnabled = true;
    
    async function loadScript(name) {
      currentScript = name;
      const script = scripts[name];
      
      // Update UI
      document.getElementById('scriptTitle').textContent = script.meta.title;
      document.getElementById('scriptDesc').textContent = script.description;
      document.getElementById('totalTime').textContent = script.meta.duration;
      document.getElementById('currentTime').textContent = '0.0';
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('playBtn').textContent = '▶ Play';
      document.getElementById('playBtn').disabled = true;
      
      // Update button states
      document.getElementById('script1Btn').classList.toggle('active', name === 'performanceReview');
      document.getElementById('script2Btn').classList.toggle('active', name === 'existentialKitchen');
      
      // Load into renderer
      renderer.load(script);
      
      // Show voice info
      const voices = [...new Set(script.script.filter(b => b.do === 'say').map(b => 
        `${b.who}: ${audioManager.getVoiceForCharacter(b.who)}`
      ))];
      document.getElementById('voiceInfo').textContent = `Voices: ${voices.join(', ')}`;
      
      // Generate audio
      if (audioEnabled) {
        document.getElementById('loadingOverlay').classList.remove('hidden');
        await audioManager.generateAudioForScript(script);
      } else {
        document.getElementById('loadingOverlay').classList.add('hidden');
        document.getElementById('playBtn').disabled = false;
      }
    }
    
    // Controls
    document.getElementById('playBtn').addEventListener('click', () => {
      if (renderer.isPlaying) {
        renderer.pause();
        document.getElementById('playBtn').textContent = '▶ Play';
        if (audioManager) audioManager.stopAll();
      } else {
        renderer.play();
        document.getElementById('playBtn').textContent = '⏸ Pause';
      }
    });
    
    document.getElementById('stopBtn').addEventListener('click', () => {
      renderer.stop();
      document.getElementById('playBtn').textContent = '▶ Play';
      if (audioManager) {
        audioManager.stopAll();
        audioManager.resetTriggers();
      }
    });
    
    document.getElementById('progressBar').addEventListener('click', (e) => {
      const rect = e.target.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percent = x / rect.width;
      const duration = renderer.script?.meta?.duration || 1;
      renderer.seek(percent * duration);
      if (audioManager) audioManager.seekTo(percent * duration);
    });
    
    document.getElementById('audioEnabled').addEventListener('change', (e) => {
      audioEnabled = e.target.checked;
      if (audioEnabled && currentScript) {
        loadScript(currentScript);
      }
    });
    
    // Script selection
    document.getElementById('script1Btn').addEventListener('click', () => loadScript('performanceReview'));
    document.getElementById('script2Btn').addEventListener('click', () => loadScript('existentialKitchen'));
    
    // Load initial script
    loadScript('performanceReview');
  </script>
</body>
</html>
