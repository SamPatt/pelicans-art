<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pelicans.art — AI Improv Theater</title>
  <link rel="stylesheet" href="pelicans-theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--plumage-white);
      color: var(--wing-gray);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    /* === HERO === */
    .hero {
      background: linear-gradient(180deg, #87CEEB 0%, #2D8EC4 40%, #1B6B96 100%);
      padding: 60px 40px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-10);
      position: relative;
      overflow: hidden;
      min-height: 380px;
    }

    .hero-text {
      max-width: 480px;
      z-index: 2;
    }

    .hero-text h1 {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 700;
      color: #fff;
      line-height: 1.15;
      margin-bottom: var(--space-3);
    }

    .hero-text p {
      color: rgba(255,255,255,0.85);
      font-size: var(--text-lg);
      margin-bottom: var(--space-6);
      line-height: 1.6;
    }

    .hero-buttons {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    .hero-buttons .btn-ocean {
      color: #fff;
      border-color: rgba(255,255,255,0.6);
    }

    .hero-buttons .btn-ocean:hover {
      background: rgba(255,255,255,0.15);
      border-color: #fff;
    }

    .hero-pelican {
      flex-shrink: 0;
      z-index: 2;
      transform: rotate(5deg);
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.15));
      animation: hero-bob 4s ease-in-out infinite;
    }

    @keyframes hero-bob {
      0%, 100% { transform: rotate(5deg) translateY(0); }
      50% { transform: rotate(5deg) translateY(-10px); }
    }

    .hero-wave {
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      z-index: 1;
    }

    /* === MAIN CONTENT === */
    .main-content {
      max-width: 860px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 600;
      color: var(--wing-dark);
      margin-bottom: var(--space-5);
    }

    /* === STAGE === */
    .stage-section {
      margin-bottom: var(--space-8);
    }

    .stage-container {
      background: var(--player-bg);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    }

    .stage-container iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: var(--radius-md);
      transition: aspect-ratio 0.3s ease;
    }

    .stage-container iframe.portrait {
      aspect-ratio: 9 / 16;
      max-height: 70vh;
    }

    /* === SCRIPT SELECTOR === */
    .script-selector {
      margin-top: var(--space-5);
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .script-tab {
      padding: 8px 18px;
      background: var(--plumage-cream);
      border: 1px solid var(--sand-warm);
      border-radius: var(--radius-full);
      color: var(--wing-gray);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      transition: all var(--duration-fast) var(--ease-standard);
    }

    .script-tab:hover {
      background: var(--sand-warm);
      color: var(--wing-dark);
    }

    .script-tab.active {
      background: var(--pouch-orange);
      border-color: var(--pouch-orange);
      color: #fff;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
        padding: 40px 24px 60px;
        text-align: center;
      }

      .hero-text h1 { font-size: 32px; }

      .hero-buttons { justify-content: center; }

      .hero-pelican { margin-top: -10px; }

      .main-content { padding: var(--space-5) var(--space-4); }

      .script-selector { justify-content: center; }
    }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="pelicans-nav">
    <a href="/" class="pelicans-nav-logo">pelicans<span>.art</span></a>
    <ul class="pelicans-nav-links">
      <li><a href="/sprite-editor.html">Create</a></li>
      <li><a href="/" class="active">Watch</a></li>
      <li><a href="/community.html">Community</a></li>
      <li><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><span class="theme-toggle-icon" id="themeIcon">&#127754;</span> <span id="themeLabel">Ocean</span></button></li>
    </ul>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-text">
      <h1>Make silly cartoons talk.</h1>
      <p>AI-powered improv with cartoony characters you create. Pick your cast, write a scene, and watch them perform.</p>
      <div class="hero-buttons">
        <a href="/sprite-editor.html" class="btn btn-pouch" style="font-size: var(--text-lg); padding: 12px 28px;">Start Creating</a>
        <a href="/community.html" class="btn btn-ocean" style="font-size: var(--text-lg); padding: 12px 28px;">Browse Community</a>
      </div>
    </div>
    <div class="hero-pelican">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="160" height="240">
        <g id="body">
          <ellipse cx="50" cy="110" rx="28" ry="35" fill="#f5f5f5"/>
          <ellipse cx="50" cy="115" rx="20" ry="28" fill="#ffffff"/>
          <ellipse cx="25" cy="105" rx="10" ry="25" fill="#e0e0e0"/>
          <ellipse cx="75" cy="105" rx="10" ry="25" fill="#e0e0e0"/>
          <ellipse cx="22" cy="125" rx="6" ry="10" fill="#424242"/>
          <ellipse cx="78" cy="125" rx="6" ry="10" fill="#424242"/>
          <ellipse cx="40" cy="145" rx="8" ry="4" fill="#ffb300"/>
          <ellipse cx="60" cy="145" rx="8" ry="4" fill="#ffb300"/>
        </g>
        <g id="head-top">
          <ellipse cx="50" cy="75" rx="12" ry="18" fill="#f5f5f5"/>
          <ellipse cx="50" cy="45" rx="18" ry="16" fill="#f5f5f5"/>
          <path d="M45 30 Q50 22 55 30" stroke="#e0e0e0" stroke-width="4" fill="none" stroke-linecap="round"/>
          <ellipse cx="42" cy="43" rx="5" ry="6" fill="#ffffff"/>
          <ellipse cx="58" cy="43" rx="5" ry="6" fill="#ffffff"/>
          <ellipse cx="42" cy="44" rx="2" ry="3" fill="#000000"/>
          <ellipse cx="58" cy="44" rx="2" ry="3" fill="#000000"/>
          <circle cx="40" cy="41" r="1.5" fill="#fff" opacity="0.8"/>
          <circle cx="56" cy="41" r="1.5" fill="#fff" opacity="0.8"/>
        </g>
        <g id="head-bottom">
          <path d="M32 48 Q50 44 68 48 L65 55 Q50 52 35 55 Z" fill="#ffb300"/>
          <path d="M50 44 L50 55" stroke="#ff8f00" stroke-width="1" opacity="0.5"/>
          <path d="M35 55 Q30 70 50 78 Q70 70 65 55" fill="#ffcc80"/>
          <path d="M38 60 Q50 72 62 60" stroke="#ffb300" stroke-width="1" fill="none" opacity="0.5"/>
          <path d="M40 65 Q50 75 60 65" stroke="#ffb300" stroke-width="1" fill="none" opacity="0.5"/>
          <ellipse cx="50" cy="78" rx="4" ry="2" fill="#ff8f00"/>
          <path d="M44 68 Q50 66 56 68" stroke="#8d6e63" stroke-width="1.5" fill="none"/>
          <ellipse cx="50" cy="68" rx="10" ry="8" fill="#f44336" opacity="0"/>
        </g>
      </svg>
    </div>
    <svg class="hero-wave" viewBox="0 0 1200 60" preserveAspectRatio="none">
      <path d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 L1200 60 L0 60Z" fill="var(--plumage-white)"/>
    </svg>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="stage-section">
      <h2 class="section-title">Now Playing</h2>

      <div class="stage-container">
        <iframe id="skitFrame" src="skit-player.html?embed=1&skit=batsDontEatLettuce" allow="autoplay"></iframe>
      </div>

      <div class="script-selector" id="skitSelector">
        <button class="script-tab active" data-skit="batsDontEatLettuce">Bats Don't Eat Lettuce</button>
        <button class="script-tab" data-skit="luckyCharms">Lucky Charms</button>
        <button class="script-tab" data-skit="theBox">The Box</button>
        <button class="script-tab" data-skit="theNegotiation">The Negotiation</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="pelicans-footer">
    <svg class="pelicans-footer-wave" viewBox="0 0 1200 30" preserveAspectRatio="none">
      <path d="M0 15 Q150 0 300 15 T600 15 T900 15 T1200 15 L1200 30 L0 30Z" fill="var(--water-dark)"/>
    </svg>
    <div class="pelicans-footer-logo">pelicans<span>.art</span></div>
    <div class="pelicans-footer-tagline">Stuff it in the pouch.</div>
  </footer>

  <script>
    // Skit selector - switch iframe src when user clicks a tab
    const skitFrame = document.getElementById('skitFrame');
    const selector = document.getElementById('skitSelector');

    selector.addEventListener('click', (e) => {
      const btn = e.target.closest('.script-tab');
      if (!btn) return;

      const skitName = btn.dataset.skit;
      if (!skitName) return;

      // Update active state
      selector.querySelectorAll('.script-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Reload iframe with new skit
      skitFrame.src = `skit-player.html?embed=1&skit=${skitName}`;
    });

    // Listen for orientation changes from embedded skit player
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'skit-orientation') {
        if (e.data.orientation === 'portrait') {
          skitFrame.classList.add('portrait');
        } else {
          skitFrame.classList.remove('portrait');
        }
      }
    });

    // --- Theme toggle ---
    function applyTheme(theme) {
      if (theme === 'ocean') {
        document.documentElement.dataset.theme = 'ocean';
        document.getElementById('themeIcon').innerHTML = '&#9728;';
        document.getElementById('themeLabel').textContent = 'Beach';
      } else {
        delete document.documentElement.dataset.theme;
        document.getElementById('themeIcon').innerHTML = '&#127754;';
        document.getElementById('themeLabel').textContent = 'Ocean';
      }
    }
    function toggleTheme() {
      const current = document.documentElement.dataset.theme === 'ocean' ? 'ocean' : 'beach';
      const next = current === 'ocean' ? 'beach' : 'ocean';
      localStorage.setItem('pelicans-theme', next);
      applyTheme(next);
    }
    (function initTheme() {
      const saved = localStorage.getItem('pelicans-theme');
      if (saved) { applyTheme(saved); return; }
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) { applyTheme('ocean'); }
    })();
  </script>
</body>
</html>
