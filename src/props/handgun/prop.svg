  <!-- Barrel hole -->
  <circle cx="93.1" cy="38.8" r="3" fill="#1a1a1a" style="cursor: pointer;" class=""></circle>
  <!-- Slide serrations -->
  <rect x="30" y="32" width="2" height="14" fill="#2a2a2a" style="cursor: pointer;"></rect>
  <rect x="35" y="32" width="2" height="14" fill="#2a2a2a" style="cursor: pointer;"></rect>
  <rect x="40" y="32" width="2" height="14" fill="#2a2a2a" style="cursor: pointer;"></rect>
  <!-- Frame -->
  <rect x="28" y="48" width="40" height="10" rx="1" fill="#4a4a4a" style="cursor: pointer;"></rect>
  <!-- Grip -->
  <path d="M32 58 L32 82 Q32 85 35 85 L50 85 Q53 85 53 82 L53 58 Z" fill="#5c4033" style="cursor: pointer;"></path>
  <!-- Grip texture lines -->
  <line x1="36" y1="62" x2="36" y2="80" stroke="#4a3528" stroke-width="1.5" style="cursor: pointer;"></line>
  <line x1="40" y1="62" x2="40" y2="80" stroke="#4a3528" stroke-width="1.5" style="cursor: pointer;"></line>
  <line x1="44" y1="62" x2="44" y2="80" stroke="#4a3528" stroke-width="1.5" style="cursor: pointer;"></line>
  <line x1="48" y1="62" x2="48" y2="80" stroke="#4a3528" stroke-width="1.5" style="cursor: pointer;"></line>
  <!-- Trigger guard -->
