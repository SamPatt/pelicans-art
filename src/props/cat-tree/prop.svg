<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Base -->
  <rect x="25" y="90" width="50" height="8" rx="2" fill="#8B7355"/>
  
  <!-- Main post -->
  <rect x="44" y="25" width="12" height="65" fill="#D2B48C"/>
  <line x1="46" y1="25" x2="46" y2="90" stroke="#C4A574" stroke-width="1"/>
  <line x1="50" y1="25" x2="50" y2="90" stroke="#C4A574" stroke-width="1"/>
  <line x1="54" y1="25" x2="54" y2="90" stroke="#C4A574" stroke-width="1"/>
  
  <!-- Bottom platform -->
  <rect x="20" y="65" width="35" height="6" rx="2" fill="#6B8E6B"/>
  <rect x="20" y="65" width="35" height="2" rx="1" fill="#7DA07D"/>
  
  <!-- Middle platform -->
  <rect x="45" y="45" width="40" height="6" rx="2" fill="#6B8E6B"/>
