  <circle cx="25" cy="82" r="3" fill="#FF6B6B"/>
  
  <!-- Paw prints on top bed -->
  <circle cx="45" cy="19" r="1.5" fill="#D4A0A4"/>
  <circle cx="55" cy="21" r="1.5" fill="#D4A0A4"/>
