  <!-- Top platform/bed -->
  <ellipse cx="50" cy="22" rx="22" ry="8" fill="#E8B4B8"/>
  <ellipse cx="50" cy="20" rx="18" ry="5" fill="#F5D0D3"/>
  
  <!-- Side scratching post -->
