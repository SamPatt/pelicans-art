<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG prompt study — review</title><style>
:root{font-family:system-ui,sans-serif;color:#173b40;background:#f7f5ed}*{box-sizing:border-box}body{margin:0}header,main{max-width:1200px;margin:auto;padding:22px}h1{margin:0 0 8px;font-size:clamp(26px,5vw,40px)}p{line-height:1.5;max-width:850px}button,select,input{font:inherit}button,select{padding:10px;border:1px solid #67898a;background:white;color:#173b40;border-radius:6px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #d28b11;outline-offset:3px}.tools{display:flex;gap:10px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{border:1px solid #b7c9c7;background:white;padding:14px;border-radius:8px}.picture{height:270px;display:flex;align-items:center;justify-content:center;background:#edf1ef;border:1px solid #d7dfdc}.picture img{max-height:100%;max-width:100%;object-fit:contain}.small .picture img{max-width:64px;max-height:96px}.dark .picture{background:#19353c}.label{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.scores label{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0}.scores select{width:95px}textarea{width:100%;min-height:75px;font:inherit;padding:8px}.details{font-size:14px;overflow-wrap:anywhere}.probe{display:flex;gap:8px}.probe img{width:48%;max-height:180px;object-fit:contain;background:#edf1ef}summary{cursor:pointer;padding:8px 0}.notice{padding:12px;background:#ffedb9;border-left:4px solid #ca8a12}#save-status{min-height:24px}a{color:#145c70}@media(max-width:450px){header,main{padding:16px}.cards{grid-template-columns:1fr}.picture{height:280px}}
</style></head><body><header><h1>Which drawings work?</h1><p>Judge the artwork before revealing the recipe. Pick favorites within each brief; optional scores help explain why. Ratings stay on this device until you export them.</p><p class="notice" id="execution"></p><div class="tools"><select id="brief" aria-label="Asset brief"></select><button id="size">View at thumbnail size</button><button id="background">Dark preview background</button><button id="reveal">Reveal methods & checks</button><button id="export">Export ratings</button></div><p id="save-status" role="status"></p></header><main><h2 id="title"></h2><p id="brief-text"></p><div class="cards" id="cards"></div></main><script>
(async()=>{const data=await fetch('results.json').then(r=>r.json()),key='svg-study-ratings-'+data.studyId+'-'+data.run;let scores={};try{scores=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let everRevealed=false;try{everRevealed=localStorage.getItem(key+'-revealed')==='true'}catch{}let revealed=false,small=false,dark=false;const axes=['fidelity','recognition','appeal','distinctiveness','usability'];const names={fidelity:'Brief fidelity',recognition:'Recognition',appeal:'Visual appeal',distinctiveness:'Distinctiveness',usability:'Production usability'};const $=id=>document.getElementById(id);$('execution').textContent=(data.execution.mode||'Execution not recorded')+'. '+(data.execution.limitation||'This is a screening pilot, not a definitive prompt ranking.');for(const b of data.briefs){const option=document.createElement('option');option.value=b.id;option.textContent=b.title;$('brief').append(option)}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(scores));$('save-status').textContent='Saved on this device.'}catch{$('save-status').textContent='Device storage unavailable. Export your ratings before leaving.'}};
function render(){const b=data.briefs.find(b=>b.id===$('brief').value);$('title').textContent=b.title;$('brief-text').textContent=b.brief;$('cards').replaceChildren();const rows=data.results.filter(r=>r.briefId===b.id).sort((a,b)=>a.promptSha256.localeCompare(b.promptSha256));rows.forEach((r,i)=>{const card=document.createElement('article');card.className='card';const pic=document.createElement('div');pic.className='picture';if(r.preview){const img=document.createElement('img');img.src=r.preview;img.alt=b.title+' candidate '+(i+1);pic.append(img)}else pic.textContent=r.status==='missing'?'Not generated':'No renderable preview';card.append(pic);const label=document.createElement('div');label.className='label';const strong=document.createElement('strong');strong.textContent='Candidate '+(i+1);label.append(strong);const favorite=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=!!scores[r.id]?.favorite;check.disabled=r.status==='missing';check.onchange=()=>{scores[r.id]={...scores[r.id],favorite:check.checked,ratedAfterReveal:everRevealed};save()};favorite.append(check,document.createTextNode(' Favorite'));label.append(favorite);card.append(label);
 const detail=document.createElement('details');detail.className='scores';const summary=document.createElement('summary');summary.textContent='Optional scores & notes';detail.append(summary);for(const axis of axes){const l=document.createElement('label');l.append(document.createTextNode(names[axis]));const select=document.createElement('select');select.setAttribute('aria-label',names[axis]+' candidate '+(i+1));for(const value of ['',1,2,3,4,5]){const o=document.createElement('option');o.value=value;o.textContent=value||'Unrated';select.append(o)}select.value=scores[r.id]?.[axis]||'';select.disabled=r.status==='missing';select.onchange=()=>{scores[r.id]={...scores[r.id],[axis]:select.value?Number(select.value):null,ratedAfterReveal:everRevealed};save()};l.append(select);detail.append(l)}const confidence=document.createElement('select');confidence.setAttribute('aria-label','Confidence candidate '+(i+1));for(const value of ['', 'low','medium','high']){const o=document.createElement('option');o.value=value;o.textContent=value||'Confidence (optional)';confidence.append(o)}confidence.value=scores[r.id]?.confidence||'';confidence.onchange=()=>{scores[r.id]={...scores[r.id],confidence:confidence.value,ratedAfterReveal:everRevealed};save()};detail.append(confidence);const notes=document.createElement('textarea');notes.placeholder='What works? What needs changing?';notes.setAttribute('aria-label','Notes candidate '+(i+1));notes.value=scores[r.id]?.notes||'';notes.oninput=()=>{scores[r.id]={...scores[r.id],notes:notes.value,ratedAfterReveal:everRevealed};save()};detail.append(notes);card.append(detail);
 if(revealed){const meta=document.createElement('div');meta.className='details';const method=data.methods.find(m=>m.id===r.methodId);const p=document.createElement('p');p.textContent=(method?.title||r.methodId)+' · '+r.phase+' · '+r.status+' · '+(r.bytes||0)+' bytes';meta.append(p);for(const message of [...r.errors,...r.warnings]){const p=document.createElement('p');p.textContent=message;meta.append(p)}if(r.svg){const a=document.createElement('a');a.href=r.svg;a.download='asset.svg';a.textContent='Download original SVG';meta.append(a)}if(r.mouth){const p=document.createElement('p');p.textContent='Mouth-open and gaze probes (approximate, not a full player test)';meta.append(p);const probe=document.createElement('div');probe.className='probe';for(const [src,alt] of [[r.mouth,'Mouth open'],[r.gaze,'Gaze right']]){const img=document.createElement('img');img.src=src;img.alt=alt;probe.append(img)}meta.append(probe)}card.append(meta)}$('cards').append(card)});document.body.classList.toggle('small',small);document.body.classList.toggle('dark',dark)}
$('brief').onchange=render;$('size').onclick=()=>{small=!small;$('size').textContent=small?'View at normal size':'View at thumbnail size';render()};$('background').onclick=()=>{dark=!dark;$('background').textContent=dark?'Light preview background':'Dark preview background';render()};$('reveal').onclick=()=>{revealed=!revealed;if(revealed){everRevealed=true;try{localStorage.setItem(key+'-revealed','true')}catch{}}$('reveal').textContent=revealed?'Hide methods & checks':'Reveal methods & checks';render()};$('export').onclick=()=>{const payload={studyId:data.studyId,run:data.run,exportedAt:new Date().toISOString(),methodsRevealed:revealed,methodsEverRevealed:everRevealed,ratings:scores};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='svg-study-ratings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();})().catch(e=>{document.getElementById('execution').textContent='Could not load the study: '+e.message});
</script></body></html>
